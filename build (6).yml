          @Composable
          fun AddGameScreen(
              vm: GameViewModel,
              onBack: () -> Unit,
              onSaved: (Long) -> Unit,
              onAccent: (Color) -> Unit
          ) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var uri by remember { mutableStateOf<Uri?>(null) }
              var fileName by remember { mutableStateOf("") }
              var platform by remember { mutableStateOf(Platform.UNKNOWN) }
              var saving by remember { mutableStateOf(false) }
              var progress by remember { mutableFloatStateOf(0f) }

              LaunchedEffect(platform) { onAccent(Color(platform.color)) }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u ->
                  if (u != null) {
                      uri = u
                      fileName = FileHelper.queryName(ctx, u)
                      platform = PlatformDetector.detect(fileName)
                  }
              }

              val inf = rememberInfiniteTransition(label = "add")
              val bob by inf.animateFloat(
                  -10f, 10f,
                  infiniteRepeatable(tween(1800, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "bob"
              )

              val canSave = uri != null && !saving &&
                  (platform != Platform.UNKNOWN || fileName.endsWith(".zip", true))

              val save: () -> Unit = {
                  val u = uri
                  if (u != null && !saving) {
                      scope.launch {
                          saving = true
                          progress = 0f
                          val result = withContext(Dispatchers.IO) {
                              try {
                                  val dest = FileHelper.uniqueFile(FileHelper.gamesDir(ctx), fileName)
                                  FileHelper.copyFromUri(ctx, u, dest) { pr -> progress = pr }
                                  FileHelper.resolveGameFile(dest)
                              } catch (e: Exception) {
                                  null
                              }
                          }
                          saving = false
                          if (result == null) {
                              toast(ctx, "Dosya kopyalanamadi")
                          } else {
                              val plat = if (platform == Platform.UNKNOWN) PlatformDetector.detect(result.name) else platform
                              if (plat == Platform.UNKNOWN) {
                                  result.delete()
                                  toast(ctx, "Desteklenmeyen dosya turu")
                              } else {
                                  val game = Game(
                                      name = FileHelper.displayName(result.name),
                                      filePath = result.absolutePath,
                                      platform = plat.display
                                  )
                                  vm.addGame(game) { id ->
                                      toast(ctx, "Kutuphaneye eklendi")
                                      onSaved(id)
                                  }
                              }
                          }
                      }
                  }
              }

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader("Oyun Ekle", onBack = { Sfx.back(); onBack() })
                  Row(
                      Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .padding(horizontal = 40.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(28.dp)
                  ) {
                      Reveal(0, Modifier.weight(1f).fillMaxHeight()) {
                          Column(
                              Modifier
                                  .fillMaxSize()
                                  .glass(RoundedCornerShape(26.dp))
                                  .padding(20.dp),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Icon(
                                  Icons.Rounded.FolderOpen,
                                  null,
                                  tint = AC.Cyan,
                                  modifier = Modifier
                                      .size(64.dp)
                                      .graphicsLayer { translationY = bob }
                              )
                              Spacer(Modifier.height(10.dp))
                              Text("Oyun dosyasini sec", color = AC.Text, fontSize = 20.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.height(4.dp))
                              Text(
                                  "PS1, PS2, PS3, PSP, EXE, APK ve daha fazlasi",
                                  color = AC.Muted,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center
                              )
                              Spacer(Modifier.height(16.dp))
                              AcButton("Dosya Sec", Icons.Rounded.FolderOpen, BtnKind.Primary) {
                                  picker.launch(arrayOf("*/*"))
                              }
                          }
                      }
                      Reveal(120, Modifier.weight(1f).fillMaxHeight()) {
                          Column(
                              Modifier.fillMaxSize().verticalScroll(rememberScrollState()),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              InfoCard("DOSYA", if (fileName.isEmpty()) "Henuz secilmedi" else fileName)
                              InfoCard("ALGILANAN PLATFORM", if (uri == null) "-" else platform.title)
                              Text("Platformu degistir", color = AC.Muted, fontSize = 12.sp)
                              Row(
                                  Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  Platform.values().filter { it != Platform.UNKNOWN }.forEach { pl ->
                                      SelectChip(pl.display, platform == pl, Color(pl.color)) { platform = pl }
                                  }
                              }
                              if (saving) {
                                  Text(
                                      "Kopyalaniyor %" + (progress * 100).toInt(),
                                      color = AC.Cyan,
                                      fontSize = 12.sp
                                  )
                                  ProgressBar(progress, Modifier.fillMaxWidth())
                              }
                              AcButton(
                                  "Kutuphaneye Ekle",
                                  Icons.Rounded.Add,
                                  BtnKind.Primary,
                                  enabled = canSave,
                                  modifier = Modifier.fillMaxWidth()
                              ) { save() }
                              Spacer(Modifier.height(8.dp))
                          }
                      }
                  }
              }
          }
