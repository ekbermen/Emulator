          fun normalizeUrl(input: String): String {
              val t = input.trim()
              if (t.isEmpty()) return "https://www.google.com"
              if (t.startsWith("http://") || t.startsWith("https://")) return t
              if (!t.contains(' ') && t.contains('.')) return "https://$t"
              return "https://www.google.com/search?q=" + Uri.encode(t)
          }

          fun startDownload(ctx: Context, url: String, ua: String?, cd: String?, mime: String?) {
              try {
                  val dir = ctx.getExternalFilesDir("games")
                  if (dir == null) {
                      toast(ctx, "Depolama alani bulunamadi")
                      return
                  }
                  val name = URLUtil.guessFileName(url, cd, mime)
                  val file = FileHelper.uniqueFile(dir, name)
                  val req = DownloadManager.Request(Uri.parse(url))
                  req.setTitle(file.name)
                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                  req.setDestinationInExternalFilesDir(ctx, "games", file.name)
                  val cookie = CookieManager.getInstance().getCookie(url)
                  if (cookie != null) req.addRequestHeader("Cookie", cookie)
                  if (ua != null) req.addRequestHeader("User-Agent", ua)
                  val dm = ctx.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  val id = dm.enqueue(req)
                  DownloadTracker.pending[id] = file
                  toast(ctx, "Indirme basladi: " + file.name)
              } catch (e: Exception) {
                  toast(ctx, "Indirme baslatilamadi")
              }
          }

          // Indirme bitince dosyayi otomatik kutuphaneye ekler
          @Composable
          fun DownloadWatcher(vm: GameViewModel) {
              val ctx = LocalContext.current
              DisposableEffect(Unit) {
                  val app = ctx.applicationContext
                  val main = Handler(Looper.getMainLooper())
                  val r = object : BroadcastReceiver() {
                      override fun onReceive(c: Context, i: Intent) {
                          val id = i.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L)
                          val f = DownloadTracker.pending.remove(id) ?: return
                          thread(name = "allcore-dl") {
                              var ok = false
                              try {
                                  val dm = app.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                  val cur = dm.query(DownloadManager.Query().setFilterById(id))
                                  if (cur != null) {
                                      cur.use {
                                          if (it.moveToFirst()) {
                                              val st = it.getInt(it.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                                              ok = st == DownloadManager.STATUS_SUCCESSFUL
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                              }
                              if (!ok || !f.exists()) {
                                  main.post { toast(app, "Indirme basarisiz") }
                                  return@thread
                              }
                              val res = FileHelper.resolveGameFile(f)
                              val p = PlatformDetector.detect(res.name)
                              if (p == Platform.UNKNOWN) {
                                  main.post { toast(app, "Indirilen dosya taninmadi: " + res.name) }
                                  return@thread
                              }
                              val game = Game(
                                  name = FileHelper.displayName(res.name),
                                  filePath = res.absolutePath,
                                  platform = p.display
                              )
                              vm.addGame(game) { toast(app, game.name + " kutuphaneye eklendi") }
                          }
                      }
                  }
                  ContextCompat.registerReceiver(
                      app, r,
                      IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE),
                      ContextCompat.RECEIVER_EXPORTED
                  )
                  onDispose {
                      try {
                          app.unregisterReceiver(r)
                      } catch (e: Exception) {
                      }
                  }
              }
          }

          @SuppressLint("SetJavaScriptEnabled")
          @Composable
          fun BrowserScreen(holder: BrowserHolder) {
              val focus = LocalFocusManager.current
              var text by remember(holder.url) { mutableStateOf(holder.url) }
              val go: () -> Unit = {
                  val u = normalizeUrl(text)
                  holder.url = u
                  holder.webView?.loadUrl(u)
                  focus.clearFocus()
              }
              Column(Modifier.fillMaxSize().padding(horizontal = 32.dp)) {
                  Row(
                      Modifier.fillMaxWidth().padding(vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconPill(
                          Icons.Rounded.ArrowBackIosNew, { holder.webView?.goBack() },
                          tint = if (holder.canBack) AC.Text else AC.Muted, size = 38.dp, sound = false
                      )
                      Spacer(Modifier.width(8.dp))
                      IconPill(
                          Icons.Rounded.ArrowForwardIos, { holder.webView?.goForward() },
                          tint = if (holder.canForward) AC.Text else AC.Muted, size = 38.dp, sound = false
                      )
                      Spacer(Modifier.width(8.dp))
                      IconPill(Icons.Rounded.Refresh, { holder.webView?.reload() }, size = 38.dp)
                      Spacer(Modifier.width(8.dp))
                      IconPill(Icons.Rounded.Home, {
                          holder.url = "https://www.google.com"
                          holder.webView?.loadUrl("https://www.google.com")
                      }, size = 38.dp)
                      Spacer(Modifier.width(12.dp))
                      Row(
                          Modifier
                              .weight(1f)
                              .height(38.dp)
                              .clip(RoundedCornerShape(50))
                              .background(AC.Glass)
                              .border(1.dp, AC.GlassStroke, RoundedCornerShape(50))
                              .padding(horizontal = 16.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          BasicTextField(
                              value = text,
                              onValueChange = { text = it },
                              singleLine = true,
                              textStyle = TextStyle(color = AC.Text, fontSize = 13.sp),
                              cursorBrush = SolidColor(AC.Cyan),
                              keyboardOptions = KeyboardOptions(imeAction = ImeAction.Go, keyboardType = KeyboardType.Uri),
                              keyboardActions = KeyboardActions(onGo = { go() }),
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                      Spacer(Modifier.width(8.dp))
                      IconPill(Icons.Rounded.Search, { go() }, size = 38.dp)
                  }
                  if (holder.loading) {
                      ProgressBar(holder.progress, Modifier.fillMaxWidth())
                  } else {
                      Spacer(Modifier.height(6.dp))
                  }
                  Spacer(Modifier.height(6.dp))
                  AndroidView(
                      modifier = Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .padding(bottom = 10.dp)
                          .clip(RoundedCornerShape(16.dp)),
                      factory = { c ->
                          val existing = holder.webView
                          if (existing != null) {
                              (existing.parent as? ViewGroup)?.removeView(existing)
                              existing
                          } else {
                              val wv = WebView(c)
                              wv.settings.javaScriptEnabled = true
                              wv.settings.domStorageEnabled = true
                              wv.settings.loadWithOverviewMode = true
                              wv.settings.useWideViewPort = true
                              wv.settings.setSupportZoom(true)
                              wv.settings.builtInZoomControls = true
                              wv.settings.displayZoomControls = false
                              CookieManager.getInstance().setAcceptCookie(true)
                              wv.webViewClient = object : WebViewClient() {
                                  override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                                      holder.loading = true
                                      if (url != null) holder.url = url
                                  }

                                  override fun onPageFinished(view: WebView?, url: String?) {
                                      holder.loading = false
                                      if (url != null) holder.url = url
                                      holder.canBack = view?.canGoBack() == true
                                      holder.canForward = view?.canGoForward() == true
                                  }

                                  override fun shouldOverrideUrlLoading(
                                      view: WebView?,
                                      request: WebResourceRequest?
                                  ): Boolean {
                                      val s = request?.url?.scheme
                                      return !(s == "http" || s == "https")
                                  }
                              }
                              wv.webChromeClient = object : WebChromeClient() {
                                  override fun onProgressChanged(view: WebView?, newProgress: Int) {
                                      holder.progress = newProgress / 100f
                                  }
                              }
                              wv.setDownloadListener { u, ua, cd, mime, _ ->
                                  startDownload(c, u, ua, cd, mime)
                              }
                              wv.loadUrl(holder.url)
                              holder.webView = wv
                              wv
                          }
                      }
                  )
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/allcore/emulator/ui/AllCoreApp.kt
          package com.allcore.emulator.ui

          import androidx.activity.compose.BackHandler
          import androidx.compose.animation.AnimatedContent
          import androidx.compose.animation.Crossfade
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.scaleIn
          import androidx.compose.animation.slideInHorizontally
          import androidx.compose.animation.core.tween
          import androidx.compose.animation.togetherWith
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.displayCutoutPadding
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.collectAsState
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import com.allcore.emulator.data.GameViewModel
          import com.allcore.emulator.util.AmbientMusic
          import com.allcore.emulator.util.Prefs
          import com.allcore.emulator.util.Sfx
          import com.allcore.emulator.util.toast

          sealed class Screen {
              object Home : Screen()
              object Add : Screen()
              data class Detail(val id: Long) : Screen()
          }

          @Composable
          fun AllCoreApp(vm: GameViewModel) {
              val ctx = LocalContext.current
              val games by vm.games.collectAsState()
              var splash by remember { mutableStateOf(true) }
              var screen by remember { mutableStateOf<Screen>(Screen.Home) }
              var tab by remember { mutableStateOf(NavTab.HOME) }
              var sel by remember { mutableIntStateOf(0) }
              var accent by remember { mutableStateOf(AC.Blue) }
              var musicOn by remember { mutableStateOf(Prefs.music(ctx)) }
              val browser = remember { BrowserHolder() }

              DownloadWatcher(vm)

              LaunchedEffect(tab, screen) {
                  if (screen == Screen.Home && tab != NavTab.HOME) accent = AC.Blue
              }

              BackHandler(enabled = !splash && (screen != Screen.Home || tab != NavTab.HOME)) {
                  if (screen != Screen.Home) {
                      Sfx.back()
                      screen = Screen.Home
                  } else if (tab == NavTab.BROWSER && browser.webView?.canGoBack() == true) {
                      browser.webView?.goBack()
                  } else {
                      Sfx.back()
                      tab = NavTab.HOME
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  AnimatedBackground(accent)
                  Crossfade(targetState = splash, animationSpec = tween(600), label = "splash") { s ->
                      if (s) {
                          SplashScreen { splash = false }
                      } else {
                          Box(Modifier.fillMaxSize().displayCutoutPadding()) {
                              AnimatedContent(
                                  targetState = screen,
                                  transitionSpec = {
                                      (fadeIn(tween(350)) + scaleIn(tween(350), initialScale = 0.96f)) togetherWith
                                          fadeOut(tween(200))
                                  },
                                  label = "screen"
                              ) { sc ->
                                  when (sc) {
                                      is Screen.Home -> Column(Modifier.fillMaxSize()) {
                                          TopNav(tab, musicOn) { t ->
                                              if (t != tab) {
                                                  Sfx.move()
                                                  tab = t
                                              }
                                          }
                                          Box(Modifier.weight(1f).fillMaxSize()) {
                                              AnimatedContent(
                                                  targetState = tab,
                                                  transitionSpec = {
                                                      (fadeIn(tween(350)) + slideInHorizontally(tween(350)) { it / 10 }) togetherWith
                                                          fadeOut(tween(200))
                                                  },
                                                  label = "tab"
                                              ) { t ->
                                                  when (t) {
                                                      NavTab.HOME -> LibraryScreen(
                                                          games = games,
                                                          selIndex = sel,
                                                          onSel = { sel = it },
                                                          onOpen = { g -> screen = Screen.Detail(g.id) },
                                                          onAdd = { screen = Screen.Add },
                                                          onToggleFav = { g -> vm.updateGame(g.copy(favorite = !g.favorite)) },
                                                          onAccent = { accent = it }
                                                      )
                                                      NavTab.CONSOLES -> ConsolesScreen()
                                                      NavTab.BROWSER -> BrowserScreen(browser)
                                                      NavTab.SETTINGS -> SettingsScreen(games.size) { musicOn = it }
                                                  }
                                              }
                                          }
                                      }
                                      is Screen.Add -> AddGameScreen(
                                          vm = vm,
                                          onBack = { screen = Screen.Home },
                                          onSaved = { id ->
                                              sel = 0
                                              screen = Screen.Detail(id)
                                          },
                                          onAccent = { accent = it }
                                      )
                                      is Screen.Detail -> {
                                          val g = games.firstOrNull { it.id == sc.id }
                                          if (g == null) {
                                              LaunchedEffect(Unit) { screen = Screen.Home }
                                          } else {
                                              GameDetailScreen(
                                                  game = g,
                                                  onBack = { screen = Screen.Home },
                                                  onToggleFav = { vm.updateGame(g.copy(favorite = !g.favorite)) },
                                                  onDelete = {
                                                      vm.deleteGame(g)
                                                      sel = 0
                                                      screen = Screen.Home
                                                      toast(ctx, "Oyun kutuphaneden silindi")
                                                  },
                                                  onAccent = { accent = it }
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllCore-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
