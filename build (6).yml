          package com.allcore.emulator.emulator

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import com.allcore.emulator.data.Game
          import com.allcore.emulator.util.Platform
          import com.allcore.emulator.util.toast
          import java.io.File

          object EmulatorRegistry {
              private val duck = DuckStationBridge()
              private val ppsspp = PPSSPPBridge()
              private val aether = AetherSX2Bridge()
              private val armsx3 = Armsx3Bridge()
              private val retro = RetroArchBridge()
              private val dolphin = DolphinBridge()
              private val winlator = WinlatorBridge()
              private val apk = ApkBridge()

              private val map: Map<Platform, EmulatorBridge> = linkedMapOf<Platform, EmulatorBridge>(
                  Platform.PS1 to duck,
                  Platform.PSP to ppsspp,
                  Platform.PS2 to aether,
                  Platform.PS3 to armsx3,
                  Platform.NES to retro,
                  Platform.SNES to retro,
                  Platform.GB to retro,
                  Platform.GBC to retro,
                  Platform.GBA to retro,
                  Platform.N64 to retro,
                  Platform.NDS to retro,
                  Platform.GAMECUBE to dolphin,
                  Platform.WII to dolphin,
                  Platform.PC to winlator,
                  Platform.ANDROID to apk
              )

              fun bridgeFor(platform: Platform): EmulatorBridge? = map[platform]

              fun all(): Collection<EmulatorBridge> = map.values.distinct()

              fun platformsOf(bridge: EmulatorBridge): List<Platform> =
                  map.filterValues { it === bridge }.keys.toList()
          }

          object GameLauncher {

              fun play(context: Context, game: Game) {
                  val platform = Platform.fromDisplay(game.platform)
                  val bridge = EmulatorRegistry.bridgeFor(platform)
                  if (bridge == null) {
                      toast(context, "Bu platform icin emulator bulunamadi")
                      return
                  }
                  if (!File(game.filePath).exists()) {
                      toast(context, "Oyun dosyasi bulunamadi. Kutuphaneden silip yeniden ekle.")
                      return
                  }
                  if (!bridge.isInstalled(context)) {
                      toast(context, "${bridge.displayName} kurulu degil. Play Store aciliyor...")
                      bridge.openStore(context)
                      return
                  }
                  val ok = try {
                      bridge.launch(context, game.filePath)
                  } catch (e: Exception) {
                      false
                  }
                  if (!ok) {
                      toast(context, "${bridge.displayName} dogrudan baslatilamadi, emulator aciliyor")
                      if (!bridge.openEmulator(context)) bridge.openStore(context)
                  } else if (bridge.manualSelect) {
                      try {
                          val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("AllCore", game.filePath))
                      } catch (e: Exception) {
                      }
                      toast(context, "${bridge.displayName} acildi. Oyun yolu panoya kopyalandi, emulatorden oyunu sec.")
                  }
              }

              fun openSettings(context: Context, game: Game) {
                  val platform = Platform.fromDisplay(game.platform)
                  val bridge = EmulatorRegistry.bridgeFor(platform)
                  if (bridge == null) {
                      toast(context, "Bu platform icin emulator bulunamadi")
                      return
                  }
                  if (!bridge.isInstalled(context)) {
                      toast(context, "${bridge.displayName} kurulu degil. Play Store aciliyor...")
                      bridge.openStore(context)
                      return
                  }
                  if (!bridge.openEmulator(context)) {
                      toast(context, "${bridge.displayName} acilamadi")
                      bridge.openStore(context)
                  }
              }
          }
