          fun hexPath(cx: Float, cy: Float, r: Float): Path {
              val path = Path()
              for (i in 0 until 6) {
                  val a = Math.toRadians((60 * i - 90).toDouble())
                  val x = cx + r * cos(a).toFloat()
                  val y = cy + r * sin(a).toFloat()
                  if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
              }
              path.close()
              return path
          }

          @Composable
          fun GameCover(
              game: Game,
              modifier: Modifier = Modifier,
              showLabel: Boolean = true,
              big: Boolean = false
          ) {
              val p = Platform.fromDisplay(game.platform)
              val c = Color(p.color)
              val coverFile = remember(game.coverPath) {
                  val cp = game.coverPath
                  if (cp != null && File(cp).exists()) File(cp) else null
              }
              val initials = remember(game.name) {
                  game.name.split(' ').filter { it.isNotBlank() }.take(2)
                      .joinToString("") { it.first().uppercase() }
              }
              Box(
                  modifier
                      .background(
                          Brush.linearGradient(
                              listOf(c.copy(alpha = 0.95f), Color(0xFF0B1226)),
                              start = Offset.Zero,
                              end = Offset(700f, 1000f)
                          )
                      )
                      .drawBehind {
                          drawCircle(
                              Color.White.copy(alpha = 0.07f),
                              size.width * 0.7f,
                              Offset(size.width * 0.9f, size.height * 0.1f)
                          )
                          drawCircle(
                              Color.White.copy(alpha = 0.05f),
                              size.width * 0.5f,
                              Offset(size.width * 0.1f, size.height * 0.95f)
                          )
                      }
              ) {
                  if (coverFile != null) {
                      AsyncImage(
                          model = coverFile,
                          contentDescription = null,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else {
                      Text(
                          initials,
                          Modifier.align(Alignment.Center),
                          color = Color.White.copy(alpha = 0.25f),
                          fontSize = if (big) 84.sp else 34.sp,
                          fontWeight = FontWeight.Black
                      )
                  }
                  Text(
                      p.display,
                      Modifier
                          .align(Alignment.TopStart)
                          .padding(if (big) 14.dp else 7.dp)
                          .clip(RoundedCornerShape(50))
                          .background(Color(0x66000000))
                          .padding(horizontal = 8.dp, vertical = 2.dp),
                      color = Color.White,
                      fontSize = if (big) 12.sp else 9.sp,
                      fontWeight = FontWeight.Bold,
                      letterSpacing = 0.8.sp
                  )
                  if (showLabel) {
                      Box(
                          Modifier
                              .align(Alignment.BottomCenter)
                              .fillMaxWidth()
                              .background(Brush.verticalGradient(listOf(Color.Transparent, Color(0xCC000000))))
                              .padding(horizontal = 8.dp, vertical = 7.dp)
                      ) {
                          Text(
                              game.name,
                              color = Color.White,
                              fontSize = if (big) 16.sp else 11.sp,
                              fontWeight = FontWeight.Bold,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                  }
              }
          }

