          @Composable
          fun LibraryScreen(
              games: List<Game>,
              selIndex: Int,
              onSel: (Int) -> Unit,
              onOpen: (Game) -> Unit,
              onAdd: () -> Unit,
              onToggleFav: (Game) -> Unit,
              onAccent: (Color) -> Unit
          ) {
              val ctx = LocalContext.current
              val tick = rememberResumeTick()
              val needPerm = remember(tick) { FileHelper.needsAllFiles() }
              val sel = if (games.isEmpty()) 0 else selIndex.coerceIn(0, games.size - 1)
              val current = games.getOrNull(sel)
              val accent = if (current != null) Color(Platform.fromDisplay(current.platform).color) else AC.Blue
              LaunchedEffect(accent) { onAccent(accent) }

              val listState = rememberLazyListState()
              LaunchedEffect(sel, games.size) {
                  if (games.isNotEmpty()) listState.animateScrollToItem(sel)
              }
              val focus = remember { FocusRequester() }
              LaunchedEffect(Unit) {
                  try {
                      focus.requestFocus()
                  } catch (e: Exception) {
                  }
              }
              val haptic = LocalHapticFeedback.current
              val inf = rememberInfiniteTransition(label = "wm")
              val drift by inf.animateFloat(
                  -1f, 1f,
                  infiniteRepeatable(tween(5000, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "drift"
              )

              BoxWithConstraints(
                  Modifier
                      .fillMaxSize()
                      .focusRequester(focus)
                      .onPreviewKeyEvent { e ->
                          if (e.type != KeyEventType.KeyDown || games.isEmpty()) {
                              false
                          } else when (e.key) {
                              Key.DirectionRight -> {
                                  if (sel < games.size - 1) {
                                      Sfx.move()
                                      onSel(sel + 1)
                                  }
                                  true
                              }
                              Key.DirectionLeft -> {
                                  if (sel > 0) {
                                      Sfx.move()
                                      onSel(sel - 1)
                                  }
                                  true
                              }
                              Key.Enter, Key.NumPadEnter, Key.ButtonA -> {
                                  Sfx.select()
                                  GameLauncher.play(ctx, games[sel])
                                  true
                              }
                              else -> false
                          }
                      }
                      .focusable()
              ) {
                  val tile = (maxHeight * 0.28f).coerceIn(88.dp, 150.dp)
                  Column(Modifier.fillMaxSize()) {
                      Box(
                          Modifier
                              .weight(1f)
                              .fillMaxWidth()
                              .padding(horizontal = 40.dp)
                      ) {
                          Box(Modifier.align(Alignment.CenterEnd)) {
                              Crossfade(
                                  targetState = current?.platform ?: "",
                                  animationSpec = tween(500),
                                  label = "watermark"
                              ) { name ->
                                  Text(
                                      name,
                                      modifier = Modifier.graphicsLayer { translationX = drift * 24f },
                                      color = Color.White.copy(alpha = 0.07f),
                                      fontSize = 130.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 1
                                  )
                              }
                          }
                          AnimatedContent(
                              targetState = current?.id,
                              modifier = Modifier.fillMaxSize(),
                              transitionSpec = {
                                  (fadeIn(tween(450, delayMillis = 100)) +
                                      slideInVertically(tween(450, delayMillis = 100)) { it / 8 }) togetherWith
                                      fadeOut(tween(180))
                              },
                              label = "hero"
                          ) { id ->
                              val g = games.firstOrNull { it.id == id }
                              if (g == null) {
                                  EmptyHero(onAdd)
                              } else {
                                  HeroInfo(g, tick, onOpen, onToggleFav)
                              }
                          }
                          AddFab(onAdd, Modifier.align(Alignment.BottomEnd))
                          if (needPerm) {
                              Row(
                                  Modifier
                                      .align(Alignment.TopEnd)
                                      .bounceClick { FileHelper.requestAllFiles(ctx) }
                                      .clip(RoundedCornerShape(50))
                                      .background(AC.Orange.copy(alpha = 0.18f))
                                      .border(1.dp, AC.Orange.copy(alpha = 0.6f), RoundedCornerShape(50))
                                      .padding(horizontal = 12.dp, vertical = 6.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Icon(Icons.Rounded.Security, null, tint = AC.Orange, modifier = Modifier.size(16.dp))
                                  Spacer(Modifier.width(6.dp))
                                  Text(
                                      "Tum dosyalara erisim izni ver",
                                      color = AC.Orange,
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.SemiBold
                                  )
                              }
                          }
                      }
                      LazyRow(
                          state = listState,
                          contentPadding = PaddingValues(start = 40.dp, end = 160.dp),
                          horizontalArrangement = Arrangement.spacedBy(20.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier.fillMaxWidth().height(tile * 1.3f + 10.dp)
                      ) {
                          itemsIndexed(games, key = { _, g -> g.id }) { i, g ->
                              GameTile(g, i, i == sel, tile) {
                                  if (i == sel) {
                                      Sfx.select()
                                      onOpen(g)
                                  } else {
                                      Sfx.move()
                                      haptic.performHapticFeedback(HapticFeedbackType.TextHandleMove)
                                      onSel(i)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun HeroInfo(g: Game, tick: Int, onOpen: (Game) -> Unit, onToggleFav: (Game) -> Unit) {
              val ctx = LocalContext.current
              val p = Platform.fromDisplay(g.platform)
              val c = Color(p.color)
              val bridge = EmulatorRegistry.bridgeFor(p)
              val installed = remember(tick, g.id) { bridge?.isInstalled(ctx) ?: false }
              Column(
                  Modifier.fillMaxHeight().fillMaxWidth(0.66f),
                  verticalArrangement = Arrangement.Center
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Chip(p.title.uppercase(), c)
                      Spacer(Modifier.width(12.dp))
                      StatusDot(installed)
                      Spacer(Modifier.width(6.dp))
                      Text(
                          if (bridge == null) "Emulator yok"
                          else if (installed) "${bridge.displayName} hazir"
                          else "${bridge.displayName} kurulu degil",
                          color = AC.Muted,
                          fontSize = 12.sp
                      )
                  }
                  Spacer(Modifier.height(8.dp))
                  Text(
                      g.name,
                      color = AC.Text,
                      fontSize = 30.sp,
                      lineHeight = 34.sp,
                      fontWeight = FontWeight.Black,
                      maxLines = 2,
                      overflow = TextOverflow.Ellipsis
                  )
                  Spacer(Modifier.height(14.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      AcButton("Oyna", Icons.Rounded.PlayArrow, BtnKind.Primary) { GameLauncher.play(ctx, g) }
                      Spacer(Modifier.width(12.dp))
                      AcButton("Detaylar", Icons.Rounded.Info, BtnKind.Glass) { onOpen(g) }
                      Spacer(Modifier.width(12.dp))
                      IconPill(
                          if (g.favorite) Icons.Rounded.Star else Icons.Rounded.StarBorder,
                          { onToggleFav(g) },
                          tint = if (g.favorite) AC.Gold else AC.Text
                      )
                  }
              }
          }

          @Composable
          fun EmptyHero(onAdd: () -> Unit) {
              val inf = rememberInfiniteTransition(label = "empty")
              val pulse by inf.animateFloat(
                  0.9f, 1.1f,
                  infiniteRepeatable(tween(1300, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "pulse"
              )
              Column(
                  Modifier.fillMaxHeight().fillMaxWidth(0.66f),
                  verticalArrangement = Arrangement.Center
              ) {
                  Box(
                      Modifier
                          .size(56.dp)
                          .graphicsLayer {
                              scaleX = pulse
                              scaleY = pulse
                          }
                          .clip(CircleShape)
                          .background(Brush.linearGradient(listOf(AC.Blue, AC.Violet))),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Rounded.Add, null, tint = Color.White, modifier = Modifier.size(30.dp))
                  }
                  Spacer(Modifier.height(14.dp))
                  Text("Henuz oyun yok", color = AC.Text, fontSize = 32.sp, fontWeight = FontWeight.Black)
                  Spacer(Modifier.height(4.dp))
                  Text(
                      "+ butonuyla ilk oyununu ekle ya da Tarayici sekmesinden indir",
                      color = AC.Muted,
                      fontSize = 14.sp
                  )
                  Spacer(Modifier.height(14.dp))
                  AcButton("Oyun Ekle", Icons.Rounded.Add, BtnKind.Primary) { onAdd() }
              }
          }

          @Composable
          fun AddFab(onClick: () -> Unit, modifier: Modifier = Modifier) {
              val inf = rememberInfiniteTransition(label = "fab")
              val ring by inf.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(1800, easing = LinearEasing)),
                  label = "ring"
              )
              Box(modifier.size(76.dp), contentAlignment = Alignment.Center) {
                  Box(
                      Modifier
                          .size(56.dp)
                          .graphicsLayer {
                              scaleX = 1f + ring * 0.6f
                              scaleY = 1f + ring * 0.6f
                              alpha = 1f - ring
                          }
                          .border(2.dp, AC.Cyan, CircleShape)
                  )
                  Box(
                      Modifier
                          .size(56.dp)
                          .bounceClick(onClick = onClick)
                          .clip(CircleShape)
                          .background(Brush.linearGradient(listOf(AC.Blue, AC.Violet))),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Rounded.Add, "Ekle", tint = Color.White, modifier = Modifier.size(30.dp))
                  }
              }
          }

          @Composable
          fun GameTile(game: Game, index: Int, selected: Boolean, tile: Dp, onClick: () -> Unit) {
              val c = Color(Platform.fromDisplay(game.platform).color)
              val sc by animateFloatAsState(
                  if (selected) 1.16f else 1f,
                  spring(dampingRatio = 0.55f, stiffness = 320f),
                  label = "tileScale"
              )
              val dim by animateFloatAsState(if (selected) 1f else 0.6f, tween(320), label = "tileDim")
              val elev by animateDpAsState(if (selected) 24.dp else 0.dp, tween(320), label = "tileElev")
              val enter = remember { Animatable(0f) }
              LaunchedEffect(Unit) {
                  delay(min(index, 8) * 70L)
                  enter.animateTo(1f, tween(520, easing = FastOutSlowInEasing))
              }
              val inf = rememberInfiniteTransition(label = "tilePulse")
              val pulse by inf.animateFloat(
                  0.45f, 1f,
                  infiniteRepeatable(tween(1000, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "pulse"
              )
              val shape = RoundedCornerShape(18.dp)
              Box(
                  Modifier
                      .size(tile)
                      .graphicsLayer {
                          scaleX = sc
                          scaleY = sc
                          alpha = dim * enter.value
                          translationY = (1f - enter.value) * 70f
                      }
                      .shadow(elev, shape, ambientColor = c, spotColor = c)
                      .bounceClick(sound = false, onClick = onClick)
                      .clip(shape)
                      .border(
                          if (selected) 3.dp else 1.dp,
                          if (selected) Color.White.copy(alpha = pulse) else AC.GlassStroke,
                          shape
                      )
              ) {
                  GameCover(game, Modifier.fillMaxSize())
                  if (game.favorite) {
                      Icon(
                          Icons.Rounded.Star,
                          null,
                          tint = AC.Gold,
                          modifier = Modifier.align(Alignment.TopEnd).padding(6.dp).size(18.dp)
                      )
                  }
              }
          }
