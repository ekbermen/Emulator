          @Composable
          fun AnimatedBackground(accent: Color, modifier: Modifier = Modifier) {
              val tint by animateColorAsState(accent, tween(900), label = "bgAccent")
              val inf = rememberInfiniteTransition(label = "bg")
              val a by inf.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(16000, easing = LinearEasing), RepeatMode.Reverse),
                  label = "a"
              )
              val b by inf.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(23000, easing = LinearEasing), RepeatMode.Reverse),
                  label = "b"
              )
              val p by inf.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(26000, easing = LinearEasing), RepeatMode.Restart),
                  label = "p"
              )
              Canvas(modifier.fillMaxSize()) {
                  val w = size.width
                  val h = size.height
                  drawRect(Brush.verticalGradient(listOf(AC.Bg1, AC.Bg0)))
                  val c1 = Offset(w * (0.15f + 0.55f * a), h * (0.25f + 0.25f * b))
                  drawCircle(
                      Brush.radialGradient(
                          listOf(tint.copy(alpha = 0.34f), Color.Transparent),
                          center = c1, radius = h * 0.95f
                      ),
                      radius = h * 0.95f, center = c1
                  )
                  val c2 = Offset(w * (0.85f - 0.5f * b), h * (0.85f - 0.3f * a))
                  drawCircle(
                      Brush.radialGradient(
                          listOf(AC.Violet.copy(alpha = 0.22f), Color.Transparent),
                          center = c2, radius = h * 0.8f
                      ),
                      radius = h * 0.8f, center = c2
                  )
                  val c3 = Offset(w * (0.5f + 0.3f * (1f - a)), h * (0.1f + 0.1f * b))
                  drawCircle(
                      Brush.radialGradient(
                          listOf(AC.Cyan.copy(alpha = 0.10f), Color.Transparent),
                          center = c3, radius = h * 0.6f
                      ),
                      radius = h * 0.6f, center = c3
                  )
                  for (i in 0 until 34) {
                      val seedX = ((i * 53) % 97) / 97f
                      val speed = 0.6f + ((i * 31) % 7) / 10f
                      val ph = (p * speed + i * 0.113f) % 1f
                      val x = w * seedX + sin((ph * 2f * PI + i).toFloat()) * 18f
                      val y = h * (1f - ph)
                      val al = (sin(ph * PI).toFloat() * 0.55f).coerceIn(0f, 1f)
                      val r = 1.5f + (i % 4) * 1.3f
                      drawCircle(Color.White.copy(alpha = al), r, Offset(x, y))
                  }
              }
          }

          @Composable
          fun Modifier.bounceClick(
              sound: Boolean = true,
              enabled: Boolean = true,
              onClick: () -> Unit
          ): Modifier {
              val src = remember { MutableInteractionSource() }
              val pressed by src.collectIsPressedAsState()
              val s by animateFloatAsState(
                  if (pressed) 0.93f else 1f,
                  spring(dampingRatio = Spring.DampingRatioMediumBouncy, stiffness = Spring.StiffnessMedium),
                  label = "press"
              )
              return this
                  .graphicsLayer {
                      scaleX = s
                      scaleY = s
                  }
                  .clickable(interactionSource = src, indication = null, enabled = enabled) {
                      if (sound) Sfx.select()
                      onClick()
                  }
          }

          fun Modifier.glass(
              shape: Shape = RoundedCornerShape(20.dp),
              fill: Color = AC.Glass
          ): Modifier = this
              .clip(shape)
              .background(fill)
              .border(1.dp, AC.GlassStroke, shape)

          @Composable
          fun Reveal(
              delayMs: Int = 0,
              modifier: Modifier = Modifier,
              content: @Composable () -> Unit
          ) {
              var shown by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) {
                  delay(delayMs.toLong())
                  shown = true
              }
              AnimatedVisibility(
                  visible = shown,
                  modifier = modifier,
                  enter = fadeIn(animationSpec = tween(500)) +
                      slideInVertically(tween(600, easing = FastOutSlowInEasing)) { it / 4 } +
                      scaleIn(animationSpec = tween(500), initialScale = 0.92f)
              ) {
                  content()
              }
          }

          @Composable
          fun rememberResumeTick(): Int {
              var tick by remember { mutableIntStateOf(0) }
              val owner = LocalLifecycleOwner.current
              DisposableEffect(owner) {
                  val obs = LifecycleEventObserver { _, e ->
                      if (e == Lifecycle.Event.ON_RESUME) tick++
                  }
                  owner.lifecycle.addObserver(obs)
                  onDispose { owner.lifecycle.removeObserver(obs) }
              }
              return tick
          }
