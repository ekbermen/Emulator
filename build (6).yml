          @Composable
          fun GameDetailScreen(
              game: Game,
              onBack: () -> Unit,
              onToggleFav: () -> Unit,
              onDelete: () -> Unit,
              onAccent: (Color) -> Unit
          ) {
              val ctx = LocalContext.current
              val p = Platform.fromDisplay(game.platform)
              val c = Color(p.color)
              LaunchedEffect(c) { onAccent(c) }
              val tick = rememberResumeTick()
              val bridge = EmulatorRegistry.bridgeFor(p)
              val installed = remember(tick) { bridge?.isInstalled(ctx) ?: false }
              val file = remember(game.filePath) { File(game.filePath) }
              val exists = remember(game.filePath, tick) { file.exists() }
              val sizeText = remember(game.filePath, tick) {
                  if (file.exists()) {
                      val mb = file.length() / (1024.0 * 1024.0)
                      if (mb >= 1024) String.format(Locale.US, "%.2f GB", mb / 1024.0)
                      else String.format(Locale.US, "%.1f MB", mb)
                  } else "-"
              }
              val dateText = remember(game.addedAt) {
                  SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(Date(game.addedAt))
              }
              var confirm by remember { mutableStateOf(false) }
              val inf = rememberInfiniteTransition(label = "detail")
              val floatY by inf.animateFloat(
                  -8f, 8f,
                  infiniteRepeatable(tween(2600, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "float"
              )

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader(game.name, onBack = { Sfx.back(); onBack() }) {
                      IconPill(
                          if (game.favorite) Icons.Rounded.Star else Icons.Rounded.StarBorder,
                          onToggleFav,
                          tint = if (game.favorite) AC.Gold else AC.Text
                      )
                      Spacer(Modifier.width(10.dp))
                      IconPill(Icons.Rounded.Delete, { confirm = true }, tint = AC.Danger)
                  }
                  Row(
                      Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .padding(horizontal = 40.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(36.dp)
                  ) {
                      Reveal(0, Modifier.fillMaxHeight().aspectRatio(1f)) {
                          val shape = RoundedCornerShape(26.dp)
                          GameCover(
                              game,
                              Modifier
                                  .fillMaxSize()
                                  .graphicsLayer { translationY = floatY * 2f }
                                  .shadow(28.dp, shape, ambientColor = c, spotColor = c)
                                  .clip(shape),
                              big = true
                          )
                      }
                      Box(Modifier.weight(1f).fillMaxHeight(), contentAlignment = Alignment.Center) {
                          Column(Modifier.verticalScroll(rememberScrollState())) {
                              Reveal(80) { Chip(p.title.uppercase(), c) }
                              Spacer(Modifier.height(8.dp))
                              Reveal(140) {
                                  Text(
                                      game.name,
                                      color = AC.Text,
                                      fontSize = 26.sp,
                                      lineHeight = 30.sp,
                                      fontWeight = FontWeight.Black,
                                      maxLines = 2
                                  )
                              }
                              Spacer(Modifier.height(10.dp))
                              Reveal(200) {
                                  Column(Modifier.fillMaxWidth()) {
                                      InfoRow("Platform", p.title, c)
                                      InfoRow("Dosya adi", file.name)
                                      InfoRow("Boyut", sizeText)
                                      InfoRow("Eklenme", dateText)
                                      InfoRow("Emulator", bridge?.displayName ?: "Yok")
                                      InfoRow(
                                          "Durum",
                                          if (!exists) "Dosya bulunamadi"
                                          else if (installed) "Oynamaya hazir"
                                          else "Emulator kurulu degil",
                                          if (exists && installed) AC.Green else AC.Orange
                                      )
                                  }
                              }
                              Spacer(Modifier.height(14.dp))
                              Reveal(320) {
                                  Row(
                                      Modifier.horizontalScroll(rememberScrollState()),
                                      horizontalArrangement = Arrangement.spacedBy(10.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      AcButton("Oyna", Icons.Rounded.PlayArrow, BtnKind.Primary) {
                                          GameLauncher.play(ctx, game)
                                      }
                                      AcButton("Emulator Ayarlari", Icons.Rounded.Tune, BtnKind.Glass, compact = true) {
                                          GameLauncher.openSettings(ctx, game)
                                      }
                                      AcButton("Kutuphaneden Sil", Icons.Rounded.Delete, BtnKind.Danger, compact = true) {
                                          confirm = true
                                      }
                                  }
                              }
                              Spacer(Modifier.height(12.dp))
                          }
                      }
                  }
              }

              if (confirm) {
                  AlertDialog(
                      onDismissRequest = { confirm = false },
                      containerColor = AC.Bg1,
                      title = { Text("Oyunu sil", color = AC.Text, fontWeight = FontWeight.Bold) },
                      text = {
                          Text(
                              "${game.name} kutuphaneden silinecek. Kopyalanan oyun dosyasi da silinir.",
                              color = AC.Muted
                          )
                      },
                      confirmButton = {
                          TextButton(onClick = {
                              confirm = false
                              onDelete()
                          }) { Text("Sil", color = AC.Danger, fontWeight = FontWeight.Bold) }
                      },
                      dismissButton = {
                          TextButton(onClick = { confirm = false }) { Text("Vazgec", color = AC.Text) }
                      }
                  )
              }
          }
