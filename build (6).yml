          package com.allcore.emulator.emulator

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import androidx.core.content.FileProvider
          import com.allcore.emulator.util.toast
          import java.io.File

          interface EmulatorBridge {
              val packageName: String
              val displayName: String
              val manualSelect: Boolean get() = false
              fun isInstalled(context: Context): Boolean
              fun openStore(context: Context)
              fun launch(context: Context, gamePath: String): Boolean
              fun openEmulator(context: Context): Boolean
          }

          fun EmulatorBridge.checkInstalled(context: Context): Boolean {
              return try {
                  context.packageManager.getPackageInfo(packageName, 0)
                  true
              } catch (e: Exception) {
                  false
              }
          }

          fun EmulatorBridge.launchStore(context: Context) {
              try {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$packageName"))
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(i)
              } catch (e: Exception) {
                  try {
                      val i2 = Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("https://play.google.com/store/apps/details?id=$packageName")
                      )
                      i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(i2)
                  } catch (e2: Exception) {
                      toast(context, "Play Store acilamadi")
                  }
              }
          }

          fun EmulatorBridge.launchEmulator(context: Context): Boolean {
              val i = context.packageManager.getLaunchIntentForPackage(packageName) ?: return false
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              return context.startSafe(i)
          }

          internal fun Context.startSafe(intent: Intent): Boolean {
              return try {
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(intent)
                  true
              } catch (e: Exception) {
                  false
              }
          }

          internal fun contentUriFor(context: Context, path: String): Uri? {
              return try {
                  FileProvider.getUriForFile(context, context.packageName + ".fileprovider", File(path))
              } catch (e: Exception) {
                  null
              }
          }
