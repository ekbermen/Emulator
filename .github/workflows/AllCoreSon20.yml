  - name: Fetch libretro cores
    run: |
     d=app/src/main/jniLibs/arm64-v8a
     mkdir -p $d app/src/main/assets
     b=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
     echo "3DS cekirdekleri sunucuda: $(curl -s $b/ | grep -oiE '(citra|azahar|lime)[a-z0-9_]*_libretro_android' | sort -u | tr '\n' ' ')"
     for c in ppsspp pcsx_rearmed mupen64plus_next_gles3 snes9x mgba fceumm gambatte melondsds melonds desmume azahar genesis_plus_gx picodrive yabasanshiro flycast mednafen_pce_fast stella prosystem virtualjaguar handy mednafen_vb pokemini mednafen_ngp mednafen_wswan fbneo mame2003_plus opera bluemsx puae dosbox_pure scummvm vice_x64 fuse cap32 atari800 hatari freeintv vecx o2em mednafen_pcfx gw sameduck retro8 citra citra_canary mednafen_supergrafx freechaf potator neocd vice_xvic vice_x128 vice_xplus4 vice_xpet np2kai px68k x1 theodore xroar 81 minivmac arduous tic80 lowresnx uzem jaxe emux_chip8 prboom tyrquake nxengine another_world wasm4 vircon32 lutro; do
      if curl -fsSL --retry 3 -o /tmp/$c.zip "$b/${c}_libretro_android.so.zip" && unzip -oq /tmp/$c.zip -d /tmp/k_$c; then
       cp /tmp/k_$c/${c}_libretro_android.so $d/lib${c}_libretro_android.so
      else
       echo "UYARI: $c indirilemedi, bu sistem calismayacak"
      fi
     done
     echo "=== Pakete giren cekirdekler ==="
     ls -la $d
     for need in azahar citra; do
     [ -f $d/lib${need}_libretro_android.so ] && echo "OK: $need" || echo "::warning::$need cekirdegi pakete girmedi"
     done
     curl -fsSL --retry 3 -o app/src/main/assets/PPSSPP.zip https://buildbot.libretro.com/assets/system/PPSSPP.zip || echo "UYARI: PPSSPP sistem dosyalari indirilemedi"
     curl -fsSL --retry 3 -o app/src/main/assets/scummvm.zip https://buildbot.libretro.com/assets/cores/ScummVM/scummvm.zip || echo "UYARI: ScummVM sistem dosyalari indirilemedi"
  - name: Restore Dolphin core cache
    id: dolphin_cache
    uses: actions/cache/restore@v4
    with:
     path: dolphin_core_cache
     key: dolphin-libretro-arm64-v1
  - name: Restore Dolphin failure marker
    id: dolphin_fail
    uses: actions/cache/restore@v4
    with:
     path: dolphin_fail_marker
     key: dolphin-fail-v1
  - name: Get Dolphin libretro core (GameCube / Wii)
    if: steps.dolphin_cache.outputs.cache-hit != 'true' && (steps.dolphin_fail.outputs.cache-hit != 'true' || github.event.inputs.dolphin == 'true')
    continue-on-error: true
    timeout-minutes: 150
    run: |
     mkdir -p dolphin_core_cache
     b=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
     if curl -fsSL --retry 2 -o /tmp/dolphin.zip "$b/dolphin_libretro_android.so.zip" && unzip -oq /tmp/dolphin.zip -d /tmp/k_dolphin; then
      cp /tmp/k_dolphin/dolphin_libretro_android.so dolphin_core_cache/libdolphin_libretro_android.so
      echo "Dolphin hazir cekirdek indirildi"
     else
      echo "Hazir Dolphin cekirdegi yok, kaynaktan derleniyor"
      NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
      rm -rf /tmp/dolphin_src
      git clone --recursive --depth 1 https://github.com/libretro/dolphin.git /tmp/dolphin_src || exit 0
      mkdir -p /tmp/dolphin_src/build
      cd /tmp/dolphin_src/build
      if cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DLIBRETRO=ON -DENABLE_QT=OFF -DENABLE_NOGUI=OFF -DENABLE_CLI_TOOL=OFF -DENABLE_TESTS=OFF -DENABLE_ANALYTICS=OFF -DENABLE_LTO=OFF -DUSE_DISCORD_PRESENCE=OFF > /tmp/dolphin_cmake.log 2>&1; then
       cmake --build . --target dolphin_libretro -j"$(nproc)" > /tmp/dolphin_build.log 2>&1 || { echo "Dolphin derleme hatasi:"; grep -E "error|Error" /tmp/dolphin_build.log | head -40; }
      else
       echo "Dolphin cmake hatasi:"
       tail -40 /tmp/dolphin_cmake.log
      fi
      SO="$(find /tmp/dolphin_src/build -name 'dolphin_libretro*.so' | head -n1)"
      if [ -n "$SO" ]; then
       "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$SO" || true
       cp "$SO" "$GITHUB_WORKSPACE/dolphin_core_cache/libdolphin_libretro_android.so"
       echo "Dolphin cekirdegi derlendi"
      else
       echo "Dolphin cekirdegi uretilemedi, GameCube ve Wii icin Dolphin uygulamasi kullanilacak"
      fi
     fi
     cd "$GITHUB_WORKSPACE"
     if [ -f dolphin_core_cache/libdolphin_libretro_android.so ]; then
      rm -rf /tmp/dolphin_data
      git clone --depth 1 --filter=blob:none --sparse https://github.com/libretro/dolphin.git /tmp/dolphin_data && (cd /tmp/dolphin_data && git sparse-checkout set Data/Sys) || true
      if [ -d /tmp/dolphin_data/Data/Sys ]; then
       mkdir -p /tmp/dz/dolphin-emu
       cp -r /tmp/dolphin_data/Data/Sys /tmp/dz/dolphin-emu/
       (cd /tmp/dz && zip -qr "$GITHUB_WORKSPACE/dolphin_core_cache/dolphin.zip" dolphin-emu)
      else
       echo "UYARI: Dolphin sistem dosyalari alinamadi"
      fi
     fi
  - name: Save Dolphin core cache
    if: steps.dolphin_cache.outputs.cache-hit != 'true' && hashFiles('dolphin_core_cache/libdolphin_libretro_android.so') != ''
    uses: actions/cache/save@v4
    with:
     path: dolphin_core_cache
     key: dolphin-libretro-arm64-v1
  - name: Save Dolphin failure marker
    if: steps.dolphin_cache.outputs.cache-hit != 'true' && steps.dolphin_fail.outputs.cache-hit != 'true' && hashFiles('dolphin_core_cache/libdolphin_libretro_android.so') == ''
    run: |
     mkdir -p dolphin_fail_marker
     echo failed > dolphin_fail_marker/marker.txt
  - name: Save Dolphin failure marker cache
    if: steps.dolphin_cache.outputs.cache-hit != 'true' && steps.dolphin_fail.outputs.cache-hit != 'true' && hashFiles('dolphin_core_cache/libdolphin_libretro_android.so') == ''
    uses: actions/cache/save@v4
    with:
     path: dolphin_fail_marker
     key: dolphin-fail-v1
  - name: Add Dolphin core to APK
    run: |
     d=app/src/main/jniLibs/arm64-v8a
     mkdir -p $d app/src/main/assets
     if [ -f dolphin_core_cache/libdolphin_libretro_android.so ]; then
      cp dolphin_core_cache/libdolphin_libretro_android.so $d/
      echo "OK: dolphin"
     else
      echo "::warning::dolphin cekirdegi pakete girmedi (GameCube ve Wii Dolphin uygulamasi ile acilir)"
     fi
     if [ -f dolphin_core_cache/dolphin.zip ]; then cp dolphin_core_cache/dolphin.zip app/src/main/assets/dolphin.zip; fi
  - name: Build native crash logger
    continue-on-error: true
    run: |
     NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
     CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
     cat << 'CEOF' > /tmp/crashlog.c
     #define _GNU_SOURCE
     #include <android/log.h>
     #include <dlfcn.h>
     #include <signal.h>
     #include <stdint.h>
     #include <stdio.h>
     #include <stdlib.h>
     #include <pthread.h>
     #include <dirent.h>
     #include <stdarg.h>
     #include <string.h>
     #include <sys/prctl.h>
     #include <sys/syscall.h>
     #include <ucontext.h>
     #include <unistd.h>
     #include <unwind.h>
     #define TAG "AllCoreCrash"
     #define L(...) __android_log_print(ANDROID_LOG_FATAL, TAG, __VA_ARGS__)
     struct bt { int n; };
     static void where(const char* label, void* addr) {
       Dl_info i;
       if (addr && dladdr(addr, &i) && i.dli_fname) {
         L("%s %s +0x%lx (%s)", label, i.dli_fname, (unsigned long)((char*)addr - (char*)i.dli_fbase), i.dli_sname ? i.dli_sname : "?");
       } else {
         L("%s %p", label, addr);
       }
     }
     static _Unwind_Reason_Code cb(struct _Unwind_Context* c, void* arg) {
       struct bt* b = (struct bt*)arg;
       uintptr_t pc = _Unwind_GetIP(c);
       if (pc) {
         char lab[16];
         snprintf(lab, sizeof(lab), "#%02d", b->n);
         where(lab, (void*)pc);
         b->n++;
       }
       return b->n >= 40 ? _URC_END_OF_STACK : _URC_NO_REASON;
     }
     static void handler(int sig, siginfo_t* si, void* ctx) {
       char name[32];
       memset(name, 0, sizeof(name));
       prctl(PR_GET_NAME, name, 0, 0, 0);
       ucontext_t* uc = (ucontext_t*)ctx;
       L("SIGNAL %d code %d fault_addr %p tid %d thread '%s'", sig, si->si_code, si->si_addr, (int)syscall(__NR_gettid), name);
       where("PC", (void*)uc->uc_mcontext.pc);
       where("LR", (void*)uc->uc_mcontext.regs[30]);
       L("SP %p  x0 %llx x1 %llx x2 %llx x3 %llx x29 %llx", (void*)uc->uc_mcontext.sp, (unsigned long long)uc->uc_mcontext.regs[0], (unsigned long long)uc->uc_mcontext.regs[1], (unsigned long long)uc->uc_mcontext.regs[2], (unsigned long long)uc->uc_mcontext.regs[3], (unsigned long long)uc->uc_mcontext.regs[29]);
       {
         FILE* mf = fopen("/proc/self/maps", "r");
         if (mf) {
           char ln[512];
           unsigned long pc = (unsigned long)uc->uc_mcontext.pc;
           unsigned long fa = (unsigned long)si->si_addr;
           while (fgets(ln, sizeof(ln), mf)) {
             unsigned long a = 0, b = 0;
             if (sscanf(ln, "%lx-%lx", &a, &b) == 2) {
               if (pc >= a && pc < b) L("PC_MAP %s", ln);
               if (fa >= a && fa < b) L("FAULT_MAP %s", ln);
             }
           }
           fclose(mf);
         }
       }
       struct bt b;
       b.n = 0;
       _Unwind_Backtrace(cb, &b);
       signal(sig, SIG_DFL);
     }
     static char sample_path[512];
     static void S(const char* fmt, ...) {
       if (!sample_path[0]) return;
       FILE* f = fopen(sample_path, "a");
       if (!f) return;
       va_list ap;
       va_start(ap, fmt);
       vfprintf(f, fmt, ap);
       va_end(ap);
       fputc('\n', f);
       fclose(f);
     }
     static void where_s(const char* label, void* addr) {
       Dl_info i;
       if (addr && dladdr(addr, &i) && i.dli_fname) {
         S("%s %s +0x%lx (%s)", label, i.dli_fname, (unsigned long)((char*)addr - (char*)i.dli_fbase), i.dli_sname ? i.dli_sname : "?");
       } else {
         S("%s %p", label, addr);
       }
     }
     static volatile uintptr_t sbuf[40];
     static volatile int sn = 0;
     static volatile int sdone = 0;
     static _Unwind_Reason_Code scb(struct _Unwind_Context* c, void* arg) {
       uintptr_t pc = _Unwind_GetIP(c);
       if (pc && sn < 40) sbuf[sn++] = pc;
       return sn >= 40 ? _URC_END_OF_STACK : _URC_NO_REASON;
     }
     static void sample_handler(int sig, siginfo_t* si, void* ctx) {
       ucontext_t* uc = (ucontext_t*)ctx;
       sn = 0;
       sbuf[sn++] = (uintptr_t)uc->uc_mcontext.pc;
       sbuf[sn++] = (uintptr_t)uc->uc_mcontext.regs[30];
       _Unwind_Backtrace(scb, NULL);
       sdone = 1;
     }
     static int find_tid(const char* want) {
       DIR* d = opendir("/proc/self/task");
       if (!d) return -1;
       int found = -1;
       struct dirent* e;
       while ((e = readdir(d)) != NULL) {
         int tid = atoi(e->d_name);
         if (tid <= 0) continue;
         char path[64];
         snprintf(path, sizeof(path), "/proc/self/task/%d/comm", tid);
         FILE* f = fopen(path, "r");
         if (!f) continue;
         char comm[32];
         memset(comm, 0, sizeof(comm));
         if (fgets(comm, sizeof(comm), f) && strncmp(comm, want, strlen(want)) == 0) found = tid;
         fclose(f);
         if (found > 0) break;
       }
       closedir(d);
       return found;
     }
     static void* sampler(void* arg) {
       sleep(8);
       for (int k = 0; k < 12; k++) {
         const char* nm = (k == 1) ? "GLThread" : "PS2VM";
         int tid = find_tid(nm);
         if (tid > 0) {
           sdone = 0;
           sn = 0;
           syscall(__NR_tgkill, getpid(), tid, SIGUSR2);
           for (int w = 0; w < 50 && !sdone; w++) usleep(10000);
           if (sdone) {
             uintptr_t local[40];
             int n = sn;
             for (int i = 0; i < n; i++) local[i] = sbuf[i];
             S("SAMPLE %d %s tid %d adim %d", k, nm, tid, n);
             for (int i = 0; i < n && i < 24; i++) {
               char lab[16];
               snprintf(lab, sizeof(lab), "S%02d", i);
               where_s(lab, (void*)local[i]);
             }
           } else {
             S("SAMPLE %d %s zaman asimi", k, nm);
           }
         }
         sleep(3);
       }
       return NULL;
     }
     static void install_all(int verbose) {
       struct sigaction sa;
       memset(&sa, 0, sizeof(sa));
       sa.sa_sigaction = handler;
       sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
       sigemptyset(&sa.sa_mask);
       int sigs[] = { SIGSEGV, SIGABRT, SIGBUS, SIGILL, SIGFPE };
       for (unsigned k = 0; k < sizeof(sigs) / sizeof(sigs[0]); k++) {
         struct sigaction cur;
         memset(&cur, 0, sizeof(cur));
         sigaction(sigs[k], NULL, &cur);
         if (cur.sa_sigaction != handler) {
           sigaction(sigs[k], &sa, NULL);
           if (verbose) L("handler (yeniden) kuruldu sinyal %d", sigs[k]);
         }
       }
     }
     __attribute__((constructor)) static void init_crashlog(void) {
       install_all(0);
       {
         const char* sp = getenv("ALLCORE_SAMPLE");
         if (sp) strncpy(sample_path, sp, sizeof(sample_path) - 1);
       }
       L("crashlog hazir");
     }
     CEOF
