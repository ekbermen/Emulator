name: Build AllCore APK
on:
 push:
  branches: [main]
 workflow_dispatch:
  inputs:
   dolphin:
    description: 'Dolphin cekirdegini tekrar derle (true yaz)'
    default: 'false'
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-java@v4
    with:
     distribution: temurin
     java-version: '17'
  - name: Install Gradle 8.5
    run: |
     ok=0
     for i in 1 2 3 4 5; do
      for u in https://services.gradle.org/distributions/gradle-8.5-bin.zip https://downloads.gradle.org/distributions/gradle-8.5-bin.zip; do
       if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/gradle.zip "$u" && unzip -tq /tmp/gradle.zip > /dev/null; then ok=1; break; fi
       echo "indirme basarisiz: $u (deneme $i)"
      done
      [ "$ok" = "1" ] && break
      sleep 20
     done
     [ "$ok" = "1" ] || { echo "Gradle 8.5 indirilemedi"; exit 1; }
     sudo unzip -q -o /tmp/gradle.zip -d /opt
     echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"
     /opt/gradle-8.5/bin/gradle --version
