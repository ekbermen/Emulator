     package com.allcore.emulator.emulator
     import android.content.Context
     import java.io.ByteArrayInputStream
     import java.io.ByteArrayOutputStream
     import java.io.File
     import java.io.InputStream
     import java.util.zip.ZipInputStream
     object BiosStore {
         private val NAMES = listOf("scph10000.bin", "scph39001.bin", "scph70012.bin", "scph77001.bin", "bios.bin", "ps2-bios.bin")
         private const val MIN = 1000000
         private const val MAX = 64 * 1024 * 1024
         fun sysDir(ctx: Context): File {
             val d = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "system")
             d.mkdirs()
             return d
         }
         fun has(ctx: Context): Boolean {
             val s = sysDir(ctx)
             return NAMES.any { n ->
                 val f = File(s, n)
                 f.exists() && f.length() >= MIN
             }
         }
         private fun readLimited(ins: InputStream): ByteArray? {
             val out = ByteArrayOutputStream()
             val buf = ByteArray(65536)
             var total = 0
             while (true) {
                 val n = ins.read(buf)
                 if (n < 0) break
                 total += n
                 if (total > MAX) return null
                 out.write(buf, 0, n)
             }
             return out.toByteArray()
         }
         fun install(ctx: Context, ins: InputStream, origName: String): String? {
             try {
                 var data: ByteArray = readLimited(ins) ?: return "Dosya cok buyuk, bu bir BIOS dosyasi degil (BIOS yaklasik 4 MB olur)"
                 if (data.size > 3 && data[0] == 'P'.code.toByte() && data[1] == 'K'.code.toByte()) {
                     var best: ByteArray? = null
                     ZipInputStream(ByteArrayInputStream(data)).use { z ->
                         var e = z.nextEntry
                         while (e != null) {
                             if (!e.isDirectory) {
                                 val b = z.readBytes()
                                 val cur = best
                                 if (b.size >= MIN && (cur == null || b.size > cur.size)) best = b
                             }
                             e = z.nextEntry
                         }
                     }
                     data = best ?: return "Zip icinde BIOS bulunamadi"
                 }
                 if (data.size < MIN) return "Dosya cok kucuk (" + data.size + " bayt). PS2 BIOS yaklasik 4 MB olmali"
                 val s = sysDir(ctx)
                 val safeName = origName.replace(Regex("[^A-Za-z0-9._!-]"), "_").ifEmpty { "bios.bin" }
                 val dirs = extraDirs(s)
                 for (d in dirs) {
                     d.mkdirs()
                     val names = if (d == s) NAMES + safeName else listOf("scph10000.bin", "scph39001.bin", "scph70012.bin", "bios.bin", safeName)
                     for (n in names) File(d, n).writeBytes(data)
                 }
                 Dbg.log(ctx, "BIOS kuruldu: " + safeName + " (" + data.size + " bayt)")
                 return null
             } catch (t: Throwable) {
                 return "BIOS yazilamadi: " + (t.message ?: "")
             }
         }
         private fun extraDirs(s: File): List<File> = listOf(s, File(s, "Play!"), File(s, "Play! Data Files"), File(s, "Play! Data Files/bios"), File(s, "Play"), File(s, "pcsx2/bios"), File(s, "ps2"), File(s, "bios"))
        fun ensureCopies(ctx: Context) {
            try {
                val s = sysDir(ctx)
                var src: File? = null
                for (n in NAMES) {
                    val f = File(s, n)
                    if (f.exists() && f.length() >= MIN && (src == null || f.length() > src.length())) src = f
                }
                val from = src ?: return
                val data = from.readBytes()
                var tag = "yok"
                for (i in 0 until minOf(data.size - 6, 4200000)) {
                    if (data[i] == 'R'.code.toByte() && data[i + 1] == 'O'.code.toByte() && data[i + 2] == 'M'.code.toByte() && data[i + 3] == 'V'.code.toByte() && data[i + 4] == 'E'.code.toByte() && data[i + 5] == 'R'.code.toByte()) {
                        tag = String(data, i, minOf(20, data.size - i), Charsets.ISO_8859_1).filter { it.code in 32..126 }
                        break
                    }
                }
                Dbg.log(ctx, "PS2 BIOS: " + from.name + " " + data.size + " bayt | ROMVER=" + tag)
                for (d in extraDirs(s)) {
                    d.mkdirs()
                    val names = if (d == s) NAMES else listOf("scph10000.bin", "scph39001.bin", "scph70012.bin", "bios.bin")
                    for (n in names) {
                        val t = File(d, n)
                        if (!t.exists() || t.length() != data.size.toLong()) t.writeBytes(data)
                    }
                }
            } catch (t: Throwable) {
                Dbg.log(ctx, "BIOS kopyalanamadi: " + (t.message ?: ""))
            }
        }
        fun autoImport(ctx: Context): Boolean {
             if (has(ctx)) return true
             try {
                 val root = android.os.Environment.getExternalStorageDirectory()
                 val dirs = ArrayList<File>()
                 ctx.getExternalFilesDir(null)?.let {
                     dirs.add(File(it, "bios"))
                     dirs.add(File(it, "games"))
                     dirs.add(it)
                 }
                 for (p in listOf("AllCore", "AllCore/bios", "AllCore/games", "AllCore/system", "Download", "Documents", "BIOS", "bios", "")) dirs.add(File(root, p))
                 for (d in dirs) {
                     val f = find(d, 2) ?: continue
                     Dbg.log(ctx, "BIOS otomatik bulundu: " + f.absolutePath)
                     val err = f.inputStream().use { install(ctx, it, f.name) }
                     if (err == null) return true
                 }
             } catch (t: Throwable) {
             }
             return false
         }
         private fun find(d: File, depth: Int): File? {
             val list = d.listFiles() ?: return null
             var n = 0
             for (f in list) {
                 n++
                 if (n > 500) break
                 if (f.isFile) {
                     val ln = f.name.lowercase()
                     val len = f.length()
                     val isZip = ln.endsWith(".zip")
                     val extOk = ln.endsWith(".bin") || ln.endsWith(".rom") || ln.endsWith(".bios") || isZip
                     val nameOk = ln.contains("scph") || ln.contains("bios") || ln.contains("ps2")
                     val sizeOk = len in 1000000L..8000000L
                     if (extOk && sizeOk && (nameOk || (!isZip && len == 4194304L))) return f
                 }
             }
             if (depth > 0) {
                 for (f in list) {
                     if (f.isDirectory && !f.name.startsWith(".")) {
                         val r = find(f, depth - 1)
                         if (r != null) return r
                     }
                 }
             }
             return null
         }
     }
