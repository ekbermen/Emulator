     @Volatile var current: Dev? = null
     private val main = Handler(Looper.getMainLooper())
     private fun esc(s: String): String =
     s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;")
     private fun httpGet(u: String, ct: Int, rt: Int): String? {
     return try {
     val c = URL(u).openConnection() as HttpURLConnection
     c.connectTimeout = ct
     c.readTimeout = rt
     if (c.responseCode !in 200..299) {
     c.disconnect()
     null
     } else {
     val t = c.inputStream.bufferedReader().use { it.readText() }
     c.disconnect()
     t
     }
     } catch (e: Throwable) {
     null
     }
     }
     private fun tag(s: String, n: String): String? =
     Regex("(?is)<" + n + "[^>]*>(.*?)</" + n + ">").find(s)?.groupValues?.get(1)?.trim()
     private fun describe(loc: String): Dev? {
     val xml = httpGet(loc, 1500, 3000) ?: return null
     if (!xml.contains("AVTransport", true)) return null
     val name = (tag(xml, "friendlyName") ?: "TV").replace("&amp;", "&")
     val urlBase = tag(xml, "URLBase")
     for (m in Regex("(?is)<service>(.*?)</service>").findAll(xml)) {
     val b = m.groupValues[1]
     if (!b.contains("AVTransport", true)) continue
     val cu = tag(b, "controlURL") ?: continue
     return try {
     val ctrl = if (cu.startsWith("http", true)) cu else URL(URL(urlBase ?: loc), cu).toString()
     Dev(name, URL(loc).host, ctrl)
     } catch (e: Throwable) {
     null
     }
     }
     return null
     }
     private fun ssdp(ctx: Context, targetIp: String?, ms: Int): List<String> {
     val found = LinkedHashSet<String>()
     var lock: android.net.wifi.WifiManager.MulticastLock? = null
     var s: DatagramSocket? = null
     try {
     try {
     val wm = ctx.applicationContext.getSystemService(Context.WIFI_SERVICE) as? android.net.wifi.WifiManager
     lock = wm?.createMulticastLock("allcore")
     lock?.setReferenceCounted(false)
     lock?.acquire()
     } catch (e: Throwable) {
     }
     s = DatagramSocket()
     s.soTimeout = 400
     val sts = arrayOf("urn:schemas-upnp-org:device:MediaRenderer:1", "urn:schemas-upnp-org:service:AVTransport:1", "upnp:rootdevice")
     for (st in sts) {
     val m = ("M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:1900\r\nMAN: \"ssdp:discover\"\r\nMX: 2\r\nST: " + st + "\r\n\r\n").toByteArray()
     try {
     s.send(DatagramPacket(m, m.size, InetAddress.getByName("239.255.255.250"), 1900))
     } catch (e: Throwable) {
     }
     if (targetIp != null) {
     try {
     s.send(DatagramPacket(m, m.size, InetAddress.getByName(targetIp), 1900))
     } catch (e: Throwable) {
     }
     }
     }
     val end = System.currentTimeMillis() + ms
     val buf = ByteArray(2048)
     while (System.currentTimeMillis() < end) {
     try {
     val p = DatagramPacket(buf, buf.size)
     s.receive(p)
     if (targetIp != null && p.address.hostAddress != targetIp) continue
     val txt = String(p.data, 0, p.length)
     val loc = Regex("(?im)^location:\\s*(\\S+)").find(txt)?.groupValues?.get(1) ?: continue
     found.add(loc)
     } catch (e: SocketTimeoutException) {
     }
     }
     } catch (e: Throwable) {
     } finally {
     try {
     s?.close()
     } catch (e: Throwable) {
     }
     try {
     lock?.release()
     } catch (e: Throwable) {
     }
     }
     return found.toList()
     }
     private fun find(ctx: Context, ip: String): Dev? {
     for (l in ssdp(ctx, ip, 2500)) {
     val d = describe(l)
     if (d != null) return d
     }
     val ports = intArrayOf(9197, 55000, 7676, 52235, 52323, 49152, 49153, 49154, 1400, 8000)
     val paths = arrayOf("/dmr", "/dd.xml", "/description.xml", "/DeviceDescription.xml", "/rootDesc.xml", "/dmr.xml", "/upnp/desc/aios_device/aios_device.xml", "/xml/device_description.xml")
     val pool = Executors.newFixedThreadPool(16)
     return try {
     val tasks = ArrayList<Callable<Dev>>()
     for (pt in ports) for (ph in paths) {
     val u = "http://" + ip + ":" + pt + ph
     tasks.add(Callable<Dev> { describe(u) ?: throw Exception("yok") })
     }
     pool.invokeAny(tasks, 7, TimeUnit.SECONDS)
     } catch (e: Throwable) {
     null
     } finally {
     pool.shutdownNow()
     }
     }
     private fun soap(ctrl: String, action: String, args: String): String? {
     return try {
     val body = "<?xml version=\"1.0\" encoding=\"utf-8\"?><s:Envelope xmlns:s=\"http://schemas.xmlsoap.org/soap/envelope/\" " +
     "s:encodingStyle=\"http://schemas.xmlsoap.org/soap/encoding/\"><s:Body><u:" + action +
     " xmlns:u=\"urn:schemas-upnp-org:service:AVTransport:1\">" + args + "</u:" + action + "></s:Body></s:Envelope>"
     val c = URL(ctrl).openConnection() as HttpURLConnection
     c.requestMethod = "POST"
     c.doOutput = true
     c.connectTimeout = 4000
     c.readTimeout = 6000
     c.setRequestProperty("Content-Type", "text/xml; charset=\"utf-8\"")
     c.setRequestProperty("SOAPAction", "\"urn:schemas-upnp-org:service:AVTransport:1#" + action + "\"")
     c.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
     val code = c.responseCode
     c.disconnect()
     if (code in 200..299) null else "TV istegi reddetti (HTTP $code)"
     } catch (e: Throwable) {
     "TV'ye ulasilamadi"
     }
     }
     private fun play(d: Dev, url: String, title: String): String? {
     val didl = "<DIDL-Lite xmlns=\"urn:schemas-upnp-org:metadata-1-0/DIDL-Lite/\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\" " +
     "xmlns:upnp=\"urn:schemas-upnp-org:metadata-1-0/upnp/\"><item id=\"1\" parentID=\"0\" restricted=\"1\"><dc:title>" + esc(title) +
     "</dc:title><upnp:class>object.item.videoItem</upnp:class><res protocolInfo=\"http-get:*:video/mpeg:" +
     "DLNA.ORG_OP=00;DLNA.ORG_CI=0;DLNA.ORG_FLAGS=01700000000000000000000000000000\">" + esc(url) + "</res></item></DIDL-Lite>"
     soap(d.control, "Stop", "<InstanceID>0</InstanceID>")
     val e1 = soap(
     d.control, "SetAVTransportURI",
     "<InstanceID>0</InstanceID><CurrentURI>" + esc(url) + "</CurrentURI><CurrentURIMetaData>" + esc(didl) + "</CurrentURIMetaData>"
     )
     if (e1 != null) return e1
     try {
     Thread.sleep(700)
     } catch (e: Throwable) {
     }
     return soap(d.control, "Play", "<InstanceID>0</InstanceID><Speed>1</Speed>")
     }
     private fun castDevSync(app: Context, d: Dev, cb: (String) -> Unit) {
     if (!TvHub.start(app)) {
     main.post { cb("Sunucu baslatilamadi") }
     return
     }
     val me = TvHub.localIp()
     if (me == null) {
     main.post { cb("Wi-Fi baglantisi bulunamadi") }
     return
     }
     if (!Caster.start(app)) {
     main.post { cb("Bu telefonda video kodlayici acilamadi") }
     return
     }
     val err = play(d, "http://" + me + ":" + TvHub.PORT + "/cast.ts", "AllCore")
     if (err != null) {
     Caster.stop()
     main.post { cb(err) }
     return
     }
     current = d
     main.post { cb("TV'de yayin basladi: " + d.name) }
     }
     fun cast(ctx: Context, ip: String, cb: (String) -> Unit) {
     val app = ctx.applicationContext
     if (!Regex("\\d{1,3}(\\.\\d{1,3}){3}").matches(ip)) {
     main.post { cb("TV IP adresi gecersiz (ornek: 192.168.1.45)") }
     return
     }
     Thread {
     val d = find(app, ip)
     if (d == null) {
     main.post { cb("TV bulunamadi. TV acik mi, ayni Wi-Fi mi, TV'de DLNA / ekran paylasimi acik mi?") }
     return@Thread
     }
     castDevSync(app, d, cb)
     }.start()
     }
     fun castDev(ctx: Context, d: Dev, cb: (String) -> Unit) {
     val app = ctx.applicationContext
     Thread { castDevSync(app, d, cb) }.start()
     }
     fun scan(ctx: Context, cb: (List<Dev>) -> Unit) {
     val app = ctx.applicationContext
     Thread {
     val out = ArrayList<Dev>()
     val seen = HashSet<String>()
     for (loc in ssdp(app, null, 3000)) {
     val d = describe(loc) ?: continue
     if (seen.add(d.ip + d.control)) out.add(d)
     }
     main.post { cb(out) }
     }.start()
     }
     fun stop() {
     val d = current
     current = null
     Thread {
     if (d != null) soap(d.control, "Stop", "<InstanceID>0</InstanceID>")
     Caster.stop()
     }.start()
     }
     }
