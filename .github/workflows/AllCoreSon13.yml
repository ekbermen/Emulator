     package com.allcore.emulator.emulator
     import android.content.Context
     import java.io.File
     import java.net.HttpURLConnection
     import java.net.URL
     import java.util.zip.ZipInputStream
     object CoreStore {
     private const val BASE = "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/"
     fun dir(ctx: Context): File = File(ctx.filesDir, "cores").also { it.mkdirs() }
     fun file(ctx: Context, core: String): File = File(dir(ctx), "lib${core}_libretro_android.so")
     fun bundled(ctx: Context, core: String): Boolean =
     File(ctx.applicationInfo.nativeLibraryDir, "lib${core}_libretro_android.so").exists()
     fun downloaded(ctx: Context, core: String): Boolean = file(ctx, core).exists()
     fun install(ctx: Context, core: String, onProgress: (Int) -> Unit): String? {
     var conn: HttpURLConnection? = null
     try {
     val c = URL(BASE + "lib${core}_libretro_android.so.zip").openConnection() as HttpURLConnection
     conn = c
     c.connectTimeout = 15000
     c.readTimeout = 30000
     if (c.responseCode != 200) return "Sunucuda yok (" + c.responseCode + ")"
     val total = c.contentLength.toLong()
     val zf = File(dir(ctx), "$core.zip")
     c.inputStream.use { ins ->
     zf.outputStream().use { out ->
     val buf = ByteArray(65536)
     var got = 0L
     while (true) {
     val n = ins.read(buf)
     if (n <= 0) break
     out.write(buf, 0, n)
     got += n
     if (total > 0) onProgress((got * 100 / total).toInt())
     }
     }
     }
     val tmp = File(dir(ctx), "$core.so.tmp")
     var ok = false
     ZipInputStream(zf.inputStream().buffered()).use { z ->
     var e = z.nextEntry
     while (e != null) {
     if (e.name.endsWith(".so")) {
     tmp.outputStream().use { o -> z.copyTo(o) }
     ok = true
     break
     }
     e = z.nextEntry
     }
     }
     zf.delete()
     if (!ok) return "Zip bos"
     val target = file(ctx, core)
     target.delete()
     if (!tmp.renameTo(target)) return "Kaydedilemedi"
     target.setReadOnly()
     return null
     } catch (e: Exception) {
     return e.message ?: "Hata"
     } finally {
     conn?.disconnect()
     }
     }
     fun remove(ctx: Context, core: String) {
     file(ctx, core).delete()
     }
     }
