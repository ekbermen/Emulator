     @Composable
     fun SettingToggle(title: String, sub: String, checked: Boolean, onChange: (Boolean) -> Unit) {
     Row(
     Modifier.fillMaxWidth().padding(vertical = 8.dp),
     verticalAlignment = Alignment.CenterVertically
     ) {
     Column(Modifier.weight(1f)) {
     Text(title, color = AC.Text, fontSize = 15.sp, fontWeight = FontWeight.SemiBold)
     if (sub.isNotEmpty()) Text(sub, color = AC.Muted, fontSize = 12.sp)
     }
     Switch(
     checked = checked,
     onCheckedChange = {
     Sfx.toggle()
     onChange(it)
