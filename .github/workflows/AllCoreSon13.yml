     list = ProfileStore.all(ctx)
     del = null
     if (list.isEmpty()) adding = true
     }) { Text("Sil", color = AC.Danger, fontWeight = FontWeight.Bold) }
     },
     dismissButton = { TextButton(onClick = { del = null }) { Text("Vazgec", color = AC.Text) } }
     )
     }
