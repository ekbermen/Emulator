     package com.allcore.emulator.emulator
     import android.content.Intent
     import android.graphics.Color
     import android.os.Bundle
     import android.view.Gravity
     import android.widget.Button
     import android.widget.LinearLayout
     import android.widget.TextView
     import androidx.activity.ComponentActivity
     import androidx.activity.result.contract.ActivityResultContracts
     class BiosActivity : ComponentActivity() {
         private var info: TextView? = null
         private val picker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { u ->
             if (u == null) {
                 info?.text = "Dosya secilmedi. Tekrar dene."
             } else {
                 info?.text = "BIOS hazirlaniyor..."
                 Thread {
                     var err: String? = null
                     try {
                         val name = com.allcore.emulator.util.FileHelper.queryName(this, u).toString()
                         val ins = contentResolver.openInputStream(u)
                         err = if (ins == null) "Dosya acilamadi" else ins.use { BiosStore.install(this, it, name) }
                     } catch (t: Throwable) {
                         err = "Hata: " + (t.message ?: "")
                     }
                     val msg = err
                     runOnUiThread {
                         if (msg == null) proceed() else info?.text = msg
                     }
                 }.start()
             }
         }
         override fun onCreate(b: Bundle?) {
             super.onCreate(b)
             val d = resources.displayMetrics.density
             val box = LinearLayout(this)
             box.orientation = LinearLayout.VERTICAL
             box.gravity = Gravity.CENTER
             box.setBackgroundColor(Color.rgb(5, 7, 13))
             val pad = (24 * d).toInt()
             box.setPadding(pad, pad, pad, pad)
             val title = TextView(this)
             title.text = "PS2 BIOS gerekli"
             title.setTextColor(Color.WHITE)
             title.textSize = 22f
             title.gravity = Gravity.CENTER
             val inf = TextView(this)
             inf.text = "PS2 oyunlari BIOS dosyasi olmadan acilmaz. Telefondaki BIOS dosyasini sec (adi onemli degil, .bin veya .zip olabilir). Bir kez eklemen yeterli."
             inf.setTextColor(Color.rgb(200, 210, 230))
             inf.textSize = 15f
             inf.gravity = Gravity.CENTER
             inf.setPadding(0, pad / 2, 0, pad / 2)
             info = inf
             val pick = Button(this)
             pick.text = "BIOS dosyasi sec"
             pick.setOnClickListener { picker.launch(arrayOf("*/*")) }
             val cancel = Button(this)
             cancel.text = "Vazgec"
             cancel.setOnClickListener { finish() }
             box.addView(title)
             box.addView(inf)
             box.addView(pick)
             box.addView(cancel)
             setContentView(box)
             Thread {
                 val ok = BiosStore.autoImport(this)
                 runOnUiThread { if (ok && !isFinishing) proceed() }
             }.start()
         }
         private fun proceed() {
             val go = Intent(this, GameActivity::class.java)
             intent.extras?.let { go.putExtras(it) }
             startActivity(go)
             finish()
         }
     }
