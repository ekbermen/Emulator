     import androidx.compose.ui.Modifier
     import androidx.compose.ui.text.style.TextOverflow
     import androidx.compose.ui.unit.dp
     import androidx.compose.ui.unit.sp
     import androidx.compose.ui.window.Dialog
     import androidx.compose.ui.window.DialogProperties
     import java.io.File

     // Uygulama ici dosya gezgini: gercek yolu verir, kopyalama/tasima yok
     @Composable
     fun FilePicker(folderMode: Boolean, multi: Boolean, onDone: (List<File>) -> Unit, onCancel: () -> Unit) {
     val root = Environment.getExternalStorageDirectory()
     var dir by remember { mutableStateOf(File(root, "Download").let { if (it.isDirectory) it else root }) }
     val sel = remember { mutableStateListOf<File>() }
     val items = remember(dir) {
     val l = ArrayList<File>()
     if (dir.absolutePath == root.absolutePath) {
     (File("/storage").listFiles() ?: emptyArray()).filter { it.isDirectory && it.name != "emulated" && it.name != "self" && it.canRead() }.forEach { l.add(it) }
     }
     l.addAll((dir.listFiles() ?: emptyArray()).filter { !it.name.startsWith(".") }.sortedWith(compareBy({ !it.isDirectory }, { it.name.lowercase() })))
     l
     }
     Dialog(onDismissRequest = onCancel, properties = DialogProperties(usePlatformDefaultWidth = false)) {
     Column(Modifier.fillMaxSize().background(AC.Bg1).padding(12.dp)) {
     Text(dir.absolutePath, color = AC.Muted, fontSize = 12.sp, maxLines = 2, overflow = TextOverflow.Ellipsis)
     TextButton(onClick = { dir = dir.parentFile ?: dir }, enabled = dir.absolutePath != root.absolutePath && dir.parentFile != null) { Text(".. Yukari", color = AC.Cyan) }
     LazyColumn(Modifier.weight(1f)) {
     items(items) { f ->
     val on = sel.contains(f)
     Text(
     (if (f.isDirectory) "[ ] " else "") + f.name,
     Modifier.fillMaxWidth().clickable {
     if (f.isDirectory) {
     dir = f
     } else if (!multi) {
     onDone(listOf(f))
     } else if (on) {
     sel.remove(f)
     } else {
     sel.add(f)
     }
     }.padding(vertical = 10.dp),
     color = if (on) AC.Cyan else AC.Text,
     fontSize = 15.sp
     )
     }
     }
     Row {
     TextButton(onClick = onCancel) { Text("Iptal", color = AC.Muted) }
     TextButton(onClick = { onDone(if (folderMode) listOf(dir) else sel.toList()) }, enabled = folderMode || sel.isNotEmpty()) {
     Text(if (folderMode) "Bu klasoru sec" else "Ekle (" + sel.size + ")", color = AC.Cyan)
     }
     }
     }
     }
     }
