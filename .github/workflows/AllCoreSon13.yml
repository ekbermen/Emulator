     if (p != null && !isGamesRoot(p) && isInGamesDir(File(p, "x"))) p.deleteRecursively() else f.delete()
     }
     fun resolveGameFile(file: File, outDir: File? = null): File {
     val ext = file.extension.lowercase()
     if (ext != "zip" && ext != "rar") return file
     if (PlatformDetector.detect(file.name) in keepZipPlatforms) return file
     return try {
     if (ext == "zip") resolveZip(file, outDir) else resolveRar(file, outDir)
     } catch (e: Throwable) {
     file
     }
     }
     private fun resolveZip(file: File, outDir: File?): File {
     val parent = outDir ?: file.parentFile ?: return file
     val zf = java.util.zip.ZipFile(file)
     var made: File? = null
     try {
     val entries = zf.entries().asSequence().toList()
     val names = entries.filter { !it.isDirectory }.map { it.name }
     val primary = pickPrimary(names) ?: return file
     if (needsSiblings(primary)) {
     val dir = uniqueDir(parent, file.nameWithoutExtension)
     made = dir
     dir.mkdirs()
     val root = dir.canonicalPath
     for (e in entries) {
     val out = File(dir, e.name)
     if (!out.canonicalPath.startsWith(root + File.separator)) continue
     if (e.isDirectory) {
     out.mkdirs()
     } else {
     out.parentFile?.mkdirs()
     zf.getInputStream(e).use { ins -> FileOutputStream(out).use { ins.copyTo(it) } }
     }
     }
     val result = File(dir, primary)
     if (!result.isFile) {
     dir.deleteRecursively()
     return file
     }
     zf.close()
     if (outDir == null) file.delete()
     return result
     }
     val e = zf.getEntry(primary) ?: return file
     val out = uniqueFile(parent, File(primary).name)
     made = out
     zf.getInputStream(e).use { ins -> FileOutputStream(out).use { ins.copyTo(it) } }
     zf.close()
     if (outDir == null) file.delete()
     return out
     } catch (t: Throwable) {
     try {
     made?.deleteRecursively()
     } catch (x: Throwable) {
     }
     return file
     } finally {
     try {
     zf.close()
     } catch (x: Throwable) {
     }
     }
     }
     private fun resolveRar(file: File, outDir: File?): File {
     val parent = outDir ?: file.parentFile ?: return file
     val tmp = uniqueDir(parent, ".rar_" + file.nameWithoutExtension)
     tmp.mkdirs()
     try {
     com.github.junrar.Junrar.extract(file, tmp)
     } catch (t: Throwable) {
     tmp.deleteRecursively()
     return file
     }
     val rels = tmp.walkTopDown().filter { it.isFile }
     .map { it.relativeTo(tmp).path.replace(File.separatorChar, '/') }.toList()
     val primary = pickPrimary(rels)
     if (primary == null) {
     tmp.deleteRecursively()
     return file
     }
     if (needsSiblings(primary)) {
     val dir = uniqueDir(parent, file.nameWithoutExtension)
     if (!tmp.renameTo(dir)) {
     tmp.deleteRecursively()
     return file
     }
     if (outDir == null) file.delete()
     return File(dir, primary)
     }
     val src = File(tmp, primary)
     val out = uniqueFile(parent, File(primary).name)
     if (!src.renameTo(out)) src.copyTo(out, true)
     tmp.deleteRecursively()
     if (outDir == null) file.delete()
     return out
     }
     }
