     colors = SwitchDefaults.colors(
     checkedThumbColor = Color.White,
     checkedTrackColor = AC.Blue,
     uncheckedThumbColor = AC.Muted,
     uncheckedTrackColor = AC.Glass,
     uncheckedBorderColor = AC.GlassStroke
