     if (started && !menuOpen && ff == 1 && !choreo && resumeAt > 0L && !isFinishing) {
     gWin++
     if (f > gMaxWin) gMaxWin = f
     if (gWin >= 20) {
     gPeak = gMaxWin
     gMaxWin = 0
     gWin = 0
     }
     if (gPeak >= 20 && f < gPeak * 3 / 4) gBad++ else gBad = 0
     var hot = false
     if (Build.VERSION.SDK_INT >= 29) {
     val pm = getSystemService(POWER_SERVICE) as android.os.PowerManager
     hot = pm.currentThermalStatus >= android.os.PowerManager.THERMAL_STATUS_SEVERE
     }
     if (gBad >= 5 || hot) {
     gBad = 0
     govDown()
     }
     }
     } catch (e: Throwable) {
     }
     ui.postDelayed(this, 1000L)
     }
     }
     private fun govDown() {
     val v = gl ?: return
     gPeak = 0
     gMaxWin = 0
     gWin = 0
     gStage++
     if (gStage == 1 && tuneLevel > 0) {
     tuneLevel = 0
     Tuning.updateLive(v, Tuning.options(platform, 0))
     return
     }
     if (gStage <= 2 && !shaderOff && GameSettings.filter(this, gameId) != 0) {
     shaderOff = true
     Tuning.setShader(v, 0)
     return
     }
     low = true
     }
     private val trimCb = object : android.content.ComponentCallbacks2 {
     override fun onTrimMemory(level: Int) {
     if (level == android.content.ComponentCallbacks2.TRIM_MEMORY_RUNNING_CRITICAL) {
     ui.post {
     saveSram(false)
     govDown()
     }
     }
     }
     override fun onConfigurationChanged(newConfig: android.content.res.Configuration) {}
     override fun onLowMemory() {}
     }
     private fun saveSram(wait: Boolean) {
     val v = gl ?: return
     if (!sramReady) return
     if (!sramBusy.compareAndSet(false, true)) return
     val t = Thread {
     try {
     val bytes = v.serializeSRAM()
     if (bytes.isNotEmpty()) {
     val h = bytes.contentHashCode()
     if (h != sramHash) {
     val f = sramFile()
     if (!sramBacked && f.exists()) {
     try {
     f.copyTo(File(f.parentFile, f.name + ".bak"), true)
     } catch (e: Throwable) {
     }
     }
     sramBacked = true
     val tmp = File(f.parentFile, f.name + ".tmp")
     tmp.writeBytes(bytes)
     if (!tmp.renameTo(f)) {
     f.delete()
     tmp.renameTo(f)
     }
     sramHash = h
     }
     }
     } catch (e: Throwable) {
     } finally {
     sramBusy.set(false)
     }
     }
     t.start()
     if (wait) try {
     t.join(700)
     } catch (e: Exception) {
     }
     }
     private val sramRun = object : Runnable {
     override fun run() {
     saveSram(false)
     ui.postDelayed(this, 10_000L)
     }
     }
     private fun saveState(slot: String, toast: Boolean, wait: Boolean) {
     val v = gl ?: return
     if (!started) {
     if (toast) say("Oyun henuz hazir degil")
     return
     }
     if (!saving.compareAndSet(false, true)) return
     val t = Thread {
     try {
     val bytes = v.serializeState()
     if (bytes.isNotEmpty()) {
     val dir = File(filesDir, "states")
     dir.mkdirs()
     val tmp = File(dir, "${profile}_${gameId}_$slot.tmp")
     tmp.writeBytes(bytes)
     val f = stateFile(slot)
     if (!tmp.renameTo(f)) {
     f.delete()
     tmp.renameTo(f)
     }
     if (toast) ui.post { say("Kaydedildi") }
     }
     } catch (e: Throwable) {
     } finally {
     saving.set(false)
     }
     }
     t.start()
     if (wait) try {
     t.join(900)
     } catch (e: Exception) {
     }
     }
     private fun loadState(slot: String, quiet: Boolean) {
     val f = stateFile(slot)
     if (!f.exists()) {
     if (!quiet) say("Bu slot bos")
     return
     }
     Thread {
     try {
     gl?.unserializeState(f.readBytes())
     if (!quiet) ui.post { say("Yuklendi") }
     } catch (e: Throwable) {
     }
     }.start()
     }
     private val capRun = object : Runnable {
     override fun run() {
     val v = gl
     val h = capH
     if (v == null || h == null) return
     val tv = TvHub.running && TvHub.viewerCount() > 0
     val cast = Caster.wantsFrames()
     val r = recorder
     val tr = LiveTranslate.due()
     if ((tv || cast || r != null || tr) && v.width > 0 && v.height > 0 && v.holder.surface.isValid) {
     val big = r != null || tr || cast
     val w = minOf(if (big) (if (low) 640 else 960) else (if (low) 480 else 640), v.width)
     val hh = maxOf(1, v.height * w / v.width)
     var bmp = capBmp
     if (bmp == null || bmp.width != w || bmp.height != hh) {
     bmp = Bitmap.createBitmap(w, hh, Bitmap.Config.ARGB_8888)
     capBmp = bmp
     }
     val target = bmp!!
     try {
     PixelCopy.request(v, target, { res ->
     if (res == PixelCopy.SUCCESS) {
     try {
     if (tv) {
     val bos = ByteArrayOutputStream(40 * 1024)
     target.compress(Bitmap.CompressFormat.JPEG, if (low) 50 else 60, bos)
     TvHub.pushFrame(bos.toByteArray())
     }
     if (cast) Caster.push(target)
     recorder?.push(target)
     if (tr) LiveTranslate.feed(this@GameActivity, target)
     } catch (e: Throwable) {
     }
     }
     h.postDelayed(this, if (r != null) 28L else if (cast) (if (low) 50L else 33L) else if (low) 90L else 45L)
     }, h)
     } catch (e: Throwable) {
     h.postDelayed(this, 300)
     }
     } else {
     h.postDelayed(this, 250)
     }
     }
     }
     private fun toggleRecord() {
