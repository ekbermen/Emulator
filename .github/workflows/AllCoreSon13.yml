     "usa", "europe", "eur", "pal", "ntsc", "japan", "psp", "ps1", "ps2", "iso", "cso", "bin", "cue",
     "rom", "v1", "v2", "rev", "en", "fr", "de", "es", "it", "multi", "dvd", "cd"
     )
     private fun sp(c: Context) = c.applicationContext.getSharedPreferences("allcore_cover", Context.MODE_PRIVATE)
     fun isTried(c: Context, id: Long): Boolean = sp(c).getBoolean("t$id", false)
     fun markTried(c: Context, id: Long) = sp(c).edit().putBoolean("t$id", true).apply()
     fun resetTried(c: Context) = sp(c).edit().clear().apply()
     fun hasBoxArt(g: Game): Boolean {
     val p = g.coverPath ?: return false
     return p.contains("box_") && File(p).exists()
     }
     private fun get(url: String): ByteArray {
     val c = URL(url).openConnection() as HttpURLConnection
     c.connectTimeout = 12000
     c.readTimeout = 25000
     c.setRequestProperty("User-Agent", "AllCore/2.0")
     try {
     if (c.responseCode != 200) throw FileNotFound(c.responseCode)
     return c.inputStream.use { it.readBytes() }
     } finally {
     c.disconnect()
     }
     }
     private class FileNotFound(val code: Int) : IOException("HTTP $code")
     private fun enc(s: String): String = URLEncoder.encode(s, "UTF-8").replace("+", "%20")
     private fun norm(s: String): List<String> {
     val t = s.lowercase()
     .replace(Regex("\\(.*?\\)"), " ")
     .replace(Regex("\\[.*?\\]"), " ")
     .replace(Regex("[^a-z0-9]+"), " ")
     .trim()
     return t.split(' ').filter { it.isNotEmpty() && it !in noise }
     }
     private fun listing(ctx: Context, sys: String): List<String> {
     val f = File(ctx.filesDir, "thumb_" + sys.replace(Regex("[^A-Za-z0-9]"), "_") + ".txt")
     if (f.exists() && System.currentTimeMillis() - f.lastModified() < 30L * 24 * 3600 * 1000) {
     return f.readLines()
     }
     val html = String(get(BASE + enc(sys) + "/Named_Boxarts/"), Charsets.UTF_8)
     val names = ArrayList<String>()
     for (m in Regex("href=\"([^\"]+\\.png)\"").findAll(html)) {
     val raw = m.groupValues[1]
     names.add(android.net.Uri.decode(raw))
     }
     if (names.isNotEmpty()) f.writeText(names.joinToString("\n"))
     return names
     }
     private fun best(title: String, names: List<String>): String? {
     val q = norm(title)
     if (q.isEmpty()) return null
     val qs = q.toSet()
     var bestName: String? = null
     var bestScore = 0.0
     for (n in names) {
     val base = n.removeSuffix(".png")
     val t = norm(base).toSet()
     if (t.isEmpty()) continue
     val inter = qs.intersect(t).size.toDouble()
     val union = qs.union(t).size.toDouble()
     var score = inter / union
     if (qs == t) score += 1.0
     if (base.contains("(USA") || base.contains("(Europe")) score += 0.02
     if (score > bestScore) {
     bestScore = score
     bestName = n
     }
     }
     return if (bestScore >= 0.6) bestName else null
     }
     fun fetch(ctx: Context, g: Game): String? {
     val sys = systems[Platform.fromDisplay(g.platform)] ?: return null
     val names = try {
     listing(ctx, sys)
     } catch (e: FileNotFound) {
     return null
     }
     val pick = best(g.name, names) ?: return null
     val bytes = try {
     get(BASE + enc(sys) + "/Named_Boxarts/" + enc(pick))
     } catch (e: FileNotFound) {
     return null
     }
     val dir = File(ctx.filesDir, "covers")
     dir.mkdirs()
     val out = File(dir, "box_${g.id}.png")
     out.writeBytes(bytes)
     return out.absolutePath
     }
     }
