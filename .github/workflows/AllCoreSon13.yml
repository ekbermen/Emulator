     if (u != null) {
     try {
     val opt = BitmapFactory.Options()
     opt.inSampleSize = 4
     val bmp = ctx.contentResolver.openInputStream(u)?.use { BitmapFactory.decodeStream(it, null, opt) }
     if (bmp != null) {
     val d = File(ctx.filesDir, "avatars")
