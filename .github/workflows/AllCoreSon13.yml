     package com.allcore.emulator.emulator
     import android.content.ContentValues
     import android.content.Context
     import android.graphics.Bitmap
     import android.graphics.Rect
     import android.media.MediaCodec
     import android.media.MediaCodecInfo
     import android.media.MediaFormat
     import android.media.MediaMuxer
     import android.os.Build
     import android.os.ParcelFileDescriptor
     import android.provider.MediaStore
     import android.view.Surface
     import java.io.File
     class Recorder(private val ctx: Context, width: Int, height: Int, bitrate: Int) {
     private val w = (width / 16) * 16
     private val h = (height / 16) * 16
     private val codec: MediaCodec
     private val surface: Surface
     private var muxer: MediaMuxer? = null
     private var pfd: ParcelFileDescriptor? = null
     private var uri: android.net.Uri? = null
     private var track = -1
     private var base = -1L
     private var drain: Thread? = null
     @Volatile private var running = true
     private val dst = Rect(0, 0, w, h)
     val label: String
     init {
     val name = "AllCore_" + System.currentTimeMillis() + ".mp4"
     label = name
     val fmt = MediaFormat.createVideoFormat("video/avc", w, h)
     fmt.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
     fmt.setInteger(MediaFormat.KEY_BIT_RATE, bitrate)
     fmt.setInteger(MediaFormat.KEY_FRAME_RATE, 30)
     fmt.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
     codec = MediaCodec.createEncoderByType("video/avc")
     codec.configure(fmt, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
     surface = codec.createInputSurface()
     codec.start()
     if (Build.VERSION.SDK_INT >= 29) {
     val v = ContentValues()
     v.put(MediaStore.Video.Media.DISPLAY_NAME, name)
     v.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
     v.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/AllCore")
     v.put(MediaStore.Video.Media.IS_PENDING, 1)
     uri = ctx.contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v)
     pfd = ctx.contentResolver.openFileDescriptor(uri!!, "w")
     muxer = MediaMuxer(pfd!!.fileDescriptor, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
     } else {
     val dir = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "Movies")
     dir.mkdirs()
     muxer = MediaMuxer(File(dir, name).absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
     }
     drain = Thread { drainLoop() }.also { it.start() }
     }
     fun push(bmp: Bitmap) {
     if (!running) return
     try {
     val c = surface.lockHardwareCanvas()
     c.drawBitmap(bmp, null, dst, null)
     surface.unlockCanvasAndPost(c)
     } catch (e: Throwable) {
     }
     }
     private fun drainLoop() {
     val info = MediaCodec.BufferInfo()
     try {
     while (true) {
     val i = codec.dequeueOutputBuffer(info, 10_000)
     if (i == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
     track = muxer!!.addTrack(codec.outputFormat)
     muxer!!.start()
     } else if (i >= 0) {
     val buf = codec.getOutputBuffer(i)
     if (buf != null && info.size > 0 && track >= 0 && (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0) {
     if (base < 0) base = info.presentationTimeUs
     info.presentationTimeUs -= base
     buf.position(info.offset)
     buf.limit(info.offset + info.size)
     muxer!!.writeSampleData(track, buf, info)
     }
     codec.releaseOutputBuffer(i, false)
     if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
     } else if (i == MediaCodec.INFO_TRY_AGAIN_LATER && !running) {
     }
     }
     } catch (e: Throwable) {
     }
     }
     fun stop() {
     running = false
     try {
     codec.signalEndOfInputStream()
     } catch (e: Throwable) {
     }
     try {
     drain?.join(3000)
     } catch (e: Throwable) {
     }
     try {
     muxer?.stop()
     } catch (e: Throwable) {
     }
     try {
     muxer?.release()
     codec.stop()
     codec.release()
     surface.release()
     } catch (e: Throwable) {
     }
     try {
     pfd?.close()
     val u = uri
     if (u != null && Build.VERSION.SDK_INT >= 29) {
     val v = ContentValues()
     v.put(MediaStore.Video.Media.IS_PENDING, 0)
     ctx.contentResolver.update(u, v, null, null)
     }
     } catch (e: Throwable) {
     }
     }
     }
