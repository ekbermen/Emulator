     }
     }.start()
     return
     }
     val v = gl ?: return
     try {
     val w = minOf(if (low) 640 else 960, v.width)
     val hh = maxOf(16, v.height * w / maxOf(1, v.width))
     recorder = Recorder(this, w, hh, if (low) 2_500_000 else 4_000_000)
     rec?.visibility = View.VISIBLE
