     @Composable
     fun CollectionsScreen(games: List<Game>, onOpen: (Game) -> Unit) {
     val ctx = LocalContext.current
     var tick by remember { mutableIntStateOf(0) }
     val cols = remember(tick, games) { Extra.cols(ctx) }
     var newName by remember { mutableStateOf("") }
     val total = remember(games) { games.sumOf { Extra.playMs(ctx, it.id) } }
     val top = remember(games) { games.filter { Extra.playMs(ctx, it.id) > 0L }.sortedByDescending { Extra.playMs(ctx, it.id) }.take(5) }
     val recent = remember(games) { games.filter { Extra.lastPlayed(ctx, it.id) > 0L }.sortedByDescending { Extra.lastPlayed(ctx, it.id) }.take(5) }
     val favs = remember(games) { games.filter { it.favorite } }
     LazyColumn(
     Modifier.fillMaxSize(),
     contentPadding = PaddingValues(horizontal = 40.dp, vertical = 12.dp),
     verticalArrangement = Arrangement.spacedBy(12.dp)
     ) {
     item {
     Text("Koleksiyon ve Istatistik", color = AC.Text, fontSize = 28.sp, fontWeight = FontWeight.Black)
     Text("Toplam oynama: " + Extra.fmt(total) + "  |  " + games.size + " oyun", color = AC.Muted, fontSize = 13.sp)
     }
     item {
     Row(horizontalArrangement = Arrangement.spacedBy(10.dp), verticalAlignment = Alignment.CenterVertically) {
     OutlinedTextField(
     value = newName,
     onValueChange = { newName = it.take(24) },
     label = { Text("Yeni koleksiyon (orn. Cocukluk oyunlari)") },
     singleLine = true,
     modifier = Modifier.weight(1f)
     )
     AcButton("Olustur", null, BtnKind.Primary, compact = true) {
     if (newName.isNotBlank()) {
     Extra.addCol(ctx, newName)
     newName = ""
     tick++
     }
     }
     }
     }
     item { StatCard("En cok oynanan", top, onOpen, { Extra.fmt(Extra.playMs(ctx, it.id)) }, null) }
     item {
     StatCard("Son oynanan", recent, onOpen, {
     java.text.SimpleDateFormat("dd.MM HH:mm", java.util.Locale.getDefault()).format(java.util.Date(Extra.lastPlayed(ctx, it.id)))
     }, null)
     }
     item { StatCard("Favoriler", favs, onOpen, { it.platform }, null) }
     for ((name, ids) in cols) {
     item {
     val list = games.filter { ids.contains(it.id) }
     StatCard(name, list, onOpen, { it.platform }) {
     Extra.delCol(ctx, name)
     tick++
     }
     }
     }
     }
     }
     @Composable
     private fun StatCard(title: String, list: List<Game>, onOpen: (Game) -> Unit, sub: (Game) -> String, onDelete: (() -> Unit)?) {
     Column(Modifier.fillMaxWidth().glass(RoundedCornerShape(20.dp)).padding(16.dp)) {
     Row(verticalAlignment = Alignment.CenterVertically) {
     Text(title, color = AC.Cyan, fontSize = 15.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
     if (onDelete != null) AcButton("Sil", null, BtnKind.Danger, compact = true) { onDelete() }
     }
     if (list.isEmpty()) Text("Bos", color = AC.Muted, fontSize = 12.sp)
     for (g in list) {
     Row(Modifier.fillMaxWidth().clickable { onOpen(g) }.padding(vertical = 6.dp), verticalAlignment = Alignment.CenterVertically) {
     Text(g.name, color = AC.Text, fontSize = 14.sp, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
     Text(sub(g), color = AC.Muted, fontSize = 12.sp)
     }
     }
     }
     }
     @Composable
     fun RenameDialog(initial: String, onCancel: () -> Unit, onDone: (String) -> Unit) {
     var t by remember { mutableStateOf(initial) }
