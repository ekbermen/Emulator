     if (p != null) {
     list = ProfileStore.all(ctx)
     adding = false
     }
     }) { Text("Olustur", color = AC.Cyan, fontWeight = FontWeight.Bold) }
     },
     dismissButton = {
     if (list.isNotEmpty()) TextButton(onClick = { adding = false }) { Text("Vazgec", color = AC.Text) }
     }
     )
     }
     del?.let { p ->
     AlertDialog(
     onDismissRequest = { del = null },
     containerColor = AC.Bg1,
     title = { Text(p.name + " silinsin mi?", color = AC.Text, fontWeight = FontWeight.Bold) },
     text = { Text("Kullanicinin oyun listesi silinir. Oyun dosyalari silinmez.", color = AC.Muted) },
     confirmButton = {
