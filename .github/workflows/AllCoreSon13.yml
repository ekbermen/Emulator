     @Composable
     fun LogoMark(logoSize: Dp, modifier: Modifier = Modifier) {
     val inf = rememberInfiniteTransition(label = "logo")
     val rot by inf.animateFloat(
     0f, 360f,
     infiniteRepeatable(tween(9000, easing = LinearEasing)),
     label = "rot"
     )
     val rot2 by inf.animateFloat(
     360f, 0f,
     infiniteRepeatable(tween(13000, easing = LinearEasing)),
     label = "rot2"
     )
     val pulse by inf.animateFloat(
     0.96f, 1.04f,
     infiniteRepeatable(tween(1600, easing = FastOutSlowInEasing), RepeatMode.Reverse),
     label = "pulse"
     )
     val glow by inf.animateFloat(
     0.25f, 0.55f,
     infiniteRepeatable(tween(2200, easing = FastOutSlowInEasing), RepeatMode.Reverse),
     label = "glow"
     )
     Canvas(modifier.size(logoSize)) {
     val c = center
     val r = this.size.minDimension / 2f
     drawCircle(
     Brush.radialGradient(
     listOf(AC.Violet.copy(alpha = glow), AC.Cyan.copy(alpha = glow * 0.35f), Color.Transparent),
     center = c, radius = r
     ),
     radius = r, center = c
     )
     rotate(rot, c) {
     for (i in 0 until 12) {
     val major = i % 3 == 0
     rotate(i * 30f, c) {
     drawLine(
     AC.Cyan.copy(alpha = if (major) 0.9f else 0.35f),
     Offset(c.x, c.y - r * 0.95f),
     Offset(c.x, c.y - r * (if (major) 0.82f else 0.88f)),
     strokeWidth = r * 0.03f,
     cap = StrokeCap.Round
     )
     }
     }
     }
     rotate(rot2, c) {
     drawArc(
     brush = Brush.sweepGradient(
     listOf(Color.Transparent, AC.Violet, AC.Blue, Color.Transparent),
     center = c
     ),
     startAngle = 0f,
     sweepAngle = 250f,
     useCenter = false,
     topLeft = Offset(c.x - r * 0.74f, c.y - r * 0.74f),
     size = Size(r * 1.48f, r * 1.48f),
     style = Stroke(width = r * 0.05f, cap = StrokeCap.Round)
     )
     drawCircle(AC.Cyan, r * 0.05f, Offset(c.x + r * 0.74f, c.y))
     }
     val hex = hexPath(c.x, c.y, r * 0.58f * pulse)
     drawPath(
     hex,
     Brush.linearGradient(
     listOf(AC.Blue, AC.Violet),
     start = Offset.Zero,
     end = Offset(this.size.width, this.size.height)
     )
     )
     drawPath(hexPath(c.x, c.y, r * 0.5f * pulse), Color(0xFF070B16))
     drawPath(hex, Color.White.copy(alpha = 0.85f), style = Stroke(width = r * 0.025f))
     val w = r * 0.30f
     val top = Offset(c.x, c.y - r * 0.30f)
     val bl = Offset(c.x - w, c.y + r * 0.26f)
     val br = Offset(c.x + w, c.y + r * 0.26f)
     val ab = Brush.linearGradient(listOf(AC.Cyan, Color.White), start = bl, end = br)
     drawLine(ab, bl, top, strokeWidth = r * 0.1f, cap = StrokeCap.Round)
     drawLine(ab, top, br, strokeWidth = r * 0.1f, cap = StrokeCap.Round)
     drawLine(
     AC.Cyan,
     Offset(c.x - w * 0.45f, c.y + r * 0.1f),
     Offset(c.x + w * 0.45f, c.y + r * 0.1f),
     strokeWidth = r * 0.07f,
     cap = StrokeCap.Round
     )
     }
     }
     @Composable
     fun SplashLetter(ch: Char, i: Int) {
     val a = remember { Animatable(0f) }
     LaunchedEffect(Unit) {
     delay(500L + i * 110L)
     a.animateTo(1f, spring(dampingRatio = 0.6f, stiffness = 200f))
     }
     Text(
     ch.toString(),
     color = if (i < 3) Color.White else AC.Cyan,
     fontSize = 52.sp,
     fontWeight = FontWeight.Black,
     letterSpacing = 6.sp,
     modifier = Modifier.graphicsLayer {
     alpha = a.value.coerceIn(0f, 1f)
     translationY = (1f - a.value) * 60f
     scaleX = 0.6f + 0.4f * a.value
     scaleY = 0.6f + 0.4f * a.value
     }
     )
     }
     @Composable
     fun SplashScreen(onDone: () -> Unit) {
     val prog = remember { Animatable(0f) }
     val sub = remember { Animatable(0f) }
     val inf = rememberInfiniteTransition(label = "splash")
     val ring by inf.animateFloat(
     0f, 1f,
     infiniteRepeatable(tween(2600, easing = LinearEasing)),
     label = "ring"
     )
     LaunchedEffect(Unit) {
     Sfx.boot()
     launch { prog.animateTo(1f, tween(3000, easing = FastOutSlowInEasing)) }
     launch {
     delay(1500)
     sub.animateTo(1f, tween(700))
     }
     delay(3500)
     onDone()
     }
     Box(
     Modifier
     .fillMaxSize()
     .background(Brush.radialGradient(listOf(Color(0xFF0D1B3D), AC.Bg0))),
     contentAlignment = Alignment.Center
     ) {
     Canvas(Modifier.fillMaxSize()) {
     for (i in 0 until 3) {
     val ph = (ring + i / 3f) % 1f
     drawCircle(
     AC.Cyan.copy(alpha = (1f - ph) * 0.35f),
     radius = size.height * (0.15f + ph * 0.75f),
     center = center,
     style = Stroke(width = 2f)
     )
     }
     }
     Column(horizontalAlignment = Alignment.CenterHorizontally) {
     LogoMark(88.dp)
     Spacer(Modifier.height(6.dp))
