     private fun fixPs2Image() {
     try {
     val src = File(gamePath)
     if (!src.exists()) return
     val ln = src.name.lowercase()
     if (!(ln.endsWith(".bin") || ln.endsWith(".img"))) return
     val len = src.length()
     var skip = -1
     java.io.RandomAccessFile(src, "r").use { r ->
     fun hasCd(off: Long): Boolean {
     if (off + 5 > len) return false
     r.seek(off)
     val b = ByteArray(5)
     r.readFully(b)
     return String(b, Charsets.ISO_8859_1) == "CD001"
     }
     if (hasCd(16L * 2048 + 1)) return
     if (hasCd(16L * 2352 + 24 + 1)) skip = 24 else if (hasCd(16L * 2352 + 16 + 1)) skip = 16
     }
     if (skip < 0) {
     Dbg.log(this, "PS2 imaj: standart ISO degil, 2352 de degil (boyut=" + len + ")")
     return
     }
     val sectors = len / 2352
     val dir = File(base(), "ps2conv")
     dir.mkdirs()
     val out = File(dir, src.nameWithoutExtension.replace(Regex("[^A-Za-z0-9._-]"), "_") + ".iso")
     if (!out.exists() || out.length() != sectors * 2048) {
     if (dir.usableSpace < sectors * 2048 + 50_000_000L) {
     ui.post { say("Yer yok: disk goruntusu donusturulemedi") }
     return
     }
     ui.post { say("Disk goruntusu PS2 icin donusturuluyor...") }
     val tmp = File(dir, out.name + ".tmp")
     java.io.RandomAccessFile(src, "r").use { r ->
     tmp.outputStream().buffered(1 shl 20).use { o ->
     val buf = ByteArray(2352)
     var i = 0L
     while (i < sectors) {
     r.readFully(buf)
     o.write(buf, skip, 2048)
     i++
     }
     }
     }
     out.delete()
     tmp.renameTo(out)
     }
     Dbg.log(this, "PS2 imaj 2352 bayt/sektor idi, ISO'ya cevrildi: " + out.name + " (veri ofseti " + skip + ")")
     gamePath = out.absolutePath
     } catch (t: Throwable) {
     Dbg.log(this, "PS2 imaj donusturulemedi: " + (t.message ?: ""))
     }
     }
