     object PlatformDetector {
     private val gcRegex = Regex("(^|[^a-z])gc([^a-z]|$)")
     private fun hint(n: String): Platform? = when {
     n.contains("sega cd") || n.contains("segacd") || n.contains("mega cd") || n.contains("mega-cd") -> Platform.SEGACD
     n.contains("saturn") -> Platform.SATURN
     n.contains("dreamcast") -> Platform.DC
     n.contains("pc engine cd") || n.contains("turbografx-cd") || n.contains("tgcd") -> Platform.PCECD
     n.contains("neogeo") || n.contains("neo geo") -> Platform.NEOGEO
     n.contains("3do") -> Platform.TDO
     n.contains("mame") || n.contains("arcade") -> Platform.ARCADE
     n.contains("msdos") || n.contains("ms-dos") || n.contains("dosbox") -> Platform.DOS
     n.contains("scummvm") -> Platform.SCUMMVM
     n.contains("pcfx") || n.contains("pc-fx") -> Platform.PCFX
     n.contains("megaduck") || n.contains("mega duck") -> Platform.MEGADUCK
     n.contains("c64") || n.contains("commodore 64") -> Platform.C64
     n.contains("spectrum") -> Platform.ZX
     n.contains("amstrad") -> Platform.CPC
     n.contains("atari st") -> Platform.ATARIST
     else -> null
     }
     fun detect(fileName: String): Platform {
     val lower = fileName.lowercase()
     val ext = lower.substringAfterLast('.', "")
     if (lower.endsWith(".p8.png")) return Platform.PICO8
     if (ext == "iso" || ext == "bin" || ext == "cue" || ext == "chd" || ext == "zip") {
     val h = hint(lower)
     if (h != null) return h
     }
     return when (ext) {
     "md", "gen", "smd" -> Platform.GENESIS
     "sms" -> Platform.SMS
     "gg" -> Platform.GG
     "sg" -> Platform.SG1000
     "32x" -> Platform.S32X
     "gdi", "cdi" -> Platform.DC
     "pce" -> Platform.PCE
     "a26" -> Platform.A2600
     "a78" -> Platform.A7800
     "j64", "jag" -> Platform.JAGUAR
     "lnx" -> Platform.LYNX
     "vb", "vboy" -> Platform.VB
     "min" -> Platform.PKMINI
     "ngp", "ngc" -> Platform.NGPC
     "ws", "wsc" -> Platform.WSWAN
     "mx1", "mx2" -> Platform.MSX
     "adf", "ipf" -> Platform.AMIGA
     "dosz", "exe", "com", "bat" -> Platform.DOS
     "scummvm", "svm" -> Platform.SCUMMVM
     "d64", "t64", "prg", "crt", "x64", "g64", "d71", "d81" -> Platform.C64
     "tzx", "tap", "z80", "szx", "trd", "scl", "sna" -> Platform.ZX
     "dsk", "cdt", "cpr" -> Platform.CPC
     "a52" -> Platform.A5200
     "st", "stx", "msa" -> Platform.ATARIST
     "int" -> Platform.INTV
     "vec" -> Platform.VECTREX
     "o2" -> Platform.O2
     "mgw" -> Platform.GW
     "md1", "md2" -> Platform.MEGADUCK
     "p8" -> Platform.PICO8
     "pbp", "cue", "chd" -> Platform.PS1
     "cso" -> Platform.PSP
     "nes" -> Platform.NES
     "sfc", "smc" -> Platform.SNES
     "gb" -> Platform.GB
     "gbc" -> Platform.GBC
     "gba" -> Platform.GBA
     "n64", "z64", "v64" -> Platform.N64
     "nds" -> Platform.NDS
     "3ds", "cci", "cxi", "3dsx" -> Platform.N3DS
     "wux", "wud", "wua", "rpx" -> Platform.WIIU
     "vpk" -> Platform.VITA
     "gcm", "gcz" -> Platform.GAMECUBE
     "wbfs", "rvz" -> Platform.WII
     "pkg" -> Platform.PS3
     "iso", "bin" -> when {
     lower.contains("ps2") -> Platform.PS2
     lower.contains("ps3") -> Platform.PS3
     lower.contains("gamecube") || gcRegex.containsMatchIn(lower) -> Platform.GAMECUBE
     lower.contains("wii") -> Platform.WII
     else -> Platform.PS1
     }
     else -> Platform.UNKNOWN
     }
     }
     }
