     val stroke = when (kind) {
     BtnKind.Primary -> Color(0x55FFFFFF)
     BtnKind.Glass -> AC.GlassStroke
     BtnKind.Danger -> AC.Danger.copy(alpha = 0.6f)
     }
     Box(
     modifier
     .bounceClick(enabled = enabled, onClick = onClick)
     .graphicsLayer { alpha = if (enabled) 1f else 0.4f }
     .clip(shape)
     .drawBehind {
     when (kind) {
     BtnKind.Primary -> drawRect(
     Brush.linearGradient(
     listOf(AC.Blue, AC.Cyan, AC.Violet, AC.Blue),
     start = Offset(shift, 0f),
     end = Offset(shift + 600f, 160f),
     tileMode = TileMode.Mirror
     )
     )
     BtnKind.Glass -> drawRect(Color(0x22FFFFFF))
     BtnKind.Danger -> drawRect(Color(0x22FF5C6C))
     }
     }
     .border(1.dp, stroke, shape),
     contentAlignment = Alignment.Center
     ) {
     Row(
     Modifier.padding(
