     package com.allcore.emulator.emulator
     import android.content.Context
     import org.json.JSONArray
     import org.json.JSONObject
     object Cheats {
     class Cheat(var name: String, var code: String, var on: Boolean)
     private fun sp(c: Context) = c.applicationContext.getSharedPreferences("allcore_cheats", Context.MODE_PRIVATE)
     fun load(c: Context, gameId: Long): MutableList<Cheat> {
     val out = ArrayList<Cheat>()
     try {
     val a = JSONArray(sp(c).getString("g$gameId", "[]"))
     for (i in 0 until a.length()) {
     val o = a.getJSONObject(i)
     out.add(Cheat(o.getString("n"), o.getString("c"), o.optBoolean("e", false)))
     }
     } catch (e: Exception) {
     }
     return out
     }
     fun save(c: Context, gameId: Long, l: List<Cheat>) {
     val a = JSONArray()
     for (x in l) a.put(JSONObject().put("n", x.name).put("c", x.code).put("e", x.on))
     sp(c).edit().putString("g$gameId", a.toString()).apply()
     }
     fun parseCht(text: String): List<Cheat> {
     val descs = HashMap<Int, String>()
     val codes = HashMap<Int, String>()
     val re = Regex("^\\s*cheat(\\d+)_(desc|code)\\s*=\\s*\"?([^\"]*)\"?\\s*$")
     for (line in text.lines()) {
     val m = re.find(line) ?: continue
     val i = m.groupValues[1].toInt()
     val v = m.groupValues[3].trim()
     if (m.groupValues[2] == "desc") descs[i] = v else codes[i] = v
     }
     val out = ArrayList<Cheat>()
     for (i in codes.keys.sorted()) {
     val code = codes[i] ?: continue
     if (code.isBlank()) continue
     out.add(Cheat(descs[i] ?: ("Hile " + (i + 1)), code, false))
     }
     return out
     }
     fun apply(view: Any?, list: List<Cheat>): Boolean {
     if (view == null) return false
     try {
     val set = find(view.javaClass, "setCheat", 3)
     if (set != null) {
     find(view.javaClass, "resetCheat", 0)?.invoke(view)
     for ((i, x) in list.withIndex()) set.invoke(view, i, x.on, x.code)
     return true
     }
     val cls = Class.forName("com.swordfish.libretrodroid.LibretroDroid")
     val s2 = find(cls, "setCheat", 3) ?: return false
     find(cls, "resetCheat", 0)?.invoke(null)
     for ((i, x) in list.withIndex()) s2.invoke(null, i, x.on, x.code)
     return true
     } catch (e: Throwable) {
     return false
     }
     }
     private fun find(c: Class<*>, name: String, n: Int) =
     c.methods.firstOrNull { it.name == name && it.parameterTypes.size == n }
     }
