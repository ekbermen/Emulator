     @Composable
     fun PrefChoice(title: String, options: List<String>, key: String, def: Int) {
     val ctx = LocalContext.current
     var v by remember { mutableIntStateOf(Prefs.getInt(ctx, key, def)) }
     ChoiceRow(title, options, v) {
     v = it
     Prefs.setInt(ctx, key, it)
     }
     }
     @Composable
     fun PrefToggle(title: String, key: String, def: Boolean) {
     val ctx = LocalContext.current
     var v by remember { mutableStateOf(Prefs.getInt(ctx, key, if (def) 1 else 0) == 1) }
     SettingToggle(title, "", v) {
     v = it
     Prefs.setInt(ctx, key, if (it) 1 else 0)
     }
     }
