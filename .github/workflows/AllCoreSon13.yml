     private fun showGameSettings() {
     val c = this
     val swap = GameSettings.swap(c, gameId)
     val swapTxt = if (swap < 0) "Genel ayar" else if (swap == 1) "Ters (A/B yer degisir)" else "Normal"
     val items = arrayOf(
     "Filtre: " + GameSettings.FILTERS[GameSettings.filter(c, gameId)],
     "Performans: " + GameSettings.PERF[GameSettings.perf(c, gameId)],
     "Tus duzeni: " + GameSettings.LAYOUTS[GameSettings.layout(c, gameId)],
     "Onay tusu (A/B): " + swapTxt,
     "Tuslari elle duzenle",
     "Bu oyunun ayarlarini sifirla"
     )
     AlertDialog.Builder(this)
     .setTitle(gameName + " - oyun ayarlari")
     .setItems(items) { _, i ->
     when (i) {
     0 -> pickOne("Filtre", GameSettings.FILTERS, GameSettings.filter(c, gameId)) { n ->
     GameSettings.setFilter(c, gameId, n)
     shaderOff = false
     gl?.let { Tuning.setShader(it, n) }
     say("Filtre uygulandi (gorunmezse oyunu yeniden ac)")
     }
     1 -> pickOne("Performans", GameSettings.PERF, GameSettings.perf(c, gameId)) { n ->
     GameSettings.setPerf(c, gameId, n)
     applyPerfLive()
     }
     2 -> pickOne("Tus duzeni", GameSettings.LAYOUTS, GameSettings.layout(c, gameId)) { n ->
     GameSettings.setLayout(c, gameId, n)
     padPrefs().edit().remove(padKey()).apply()
     loadPad()
     }
     3 -> pickOne("Onay tusu (A/B)", arrayOf("Genel ayar", "Normal", "Ters (A/B yer degisir)"), swap + 1) { n ->
     GameSettings.setSwap(c, gameId, n - 1)
     pad?.swapAB = GameSettings.swapFor(c, gameId)
     pad?.invalidate()
     }
     4 -> setEditing(true)
     else -> {
     GameSettings.reset(c, gameId)
     padPrefs().edit().remove(padKey()).apply()
     shaderOff = false
     gl?.let { Tuning.setShader(it, 0) }
     pad?.swapAB = GameSettings.swapFor(c, gameId)
     loadPad()
     applyPerfLive()
     }
     }
     }
     .setNegativeButton("Kapat", null)
     .setOnDismissListener { hideBars() }
     .show()
     }
