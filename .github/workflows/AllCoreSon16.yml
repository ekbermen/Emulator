     } catch (e: Throwable) {
     }
     }.start()
     }
     private val capRun = object : Runnable {
     override fun run() {
     val v = gl
     val h = capH
     if (v == null || h == null) return
     val tv = TvHub.running && TvHub.viewerCount() > 0
     val cast = Caster.wantsFrames()
     val tr = LiveTranslate.due()
     if ((tv || cast || tr) && v.width > 0 && v.height > 0 && v.holder.surface.isValid) {
     val big = tr || cast
     val w = minOf(if (big) (if (low) 640 else if (tr) 1280 else 960) else (if (low) 480 else 640), v.width)
     val hh = maxOf(1, v.height * w / v.width)
     var bmp = capBmp
     if (bmp == null || bmp.width != w || bmp.height != hh) {
     bmp = Bitmap.createBitmap(w, hh, Bitmap.Config.ARGB_8888)
     capBmp = bmp
     }
     val target = bmp!!
     try {
     PixelCopy.request(v, target, { res ->
     if (res == PixelCopy.SUCCESS) {
     try {
     if (tv) {
     val bos = ByteArrayOutputStream(40 * 1024)
     target.compress(Bitmap.CompressFormat.JPEG, if (low) 50 else 60, bos)
     TvHub.pushFrame(bos.toByteArray())
     }
     if (cast) Caster.push(target)
     if (tr) LiveTranslate.feed(this@GameActivity, target)
     } catch (e: Throwable) {
     }
     }
     h.postDelayed(this, if (cast) (if (low) 50L else 33L) else if (low) 90L else 45L)
     }, h)
     } catch (e: Throwable) {
     h.postDelayed(this, 300)
     }
     } else {
     h.postDelayed(this, 250)
     }
     }
     }
     private var tiltOn = false
     private var tiltMax = 35f
     private var tiltInv = false
     private var tiltGate = 0
     private var tiltX = 0f
     private var tiltZero = Float.NaN
     private var tiltFirst = true
     private var tgx = 0f
     private var tgy = 0f
     private var padSX = 0f
     private var padSY = 0f
     private var gateDown = false
     private var dpL = false
     private var dpR = false
     private var tiltBtn: TextView? = null
     private fun tiltGateCode(): Int = when (tiltGate) {
     1 -> KeyEvent.KEYCODE_BUTTON_L2
     2 -> KeyEvent.KEYCODE_BUTTON_R2
     3 -> KeyEvent.KEYCODE_BUTTON_L1
     4 -> KeyEvent.KEYCODE_BUTTON_R1
     else -> -1
     }
     private fun analogPlat(): Boolean = platform == Platform.PS1 || platform == Platform.PSP || platform == Platform.N64 || platform == Platform.DC || platform == Platform.SATURN || platform == Platform.N3DS || platform == Platform.NDS || platform == Platform.GAMECUBE || platform == Platform.WII || platform == Platform.NAOMI || platform == Platform.ATOMISWAVE || platform == Platform.JAGUAR
     private fun pushLeft() {
     val v = gl ?: return
     val act = tiltOn && (tiltGate == 0 || gateDown)
     if (analogPlat()) {
     v.sendMotionEvent(GLRetroView.MOTION_SOURCE_ANALOG_LEFT, if (act) tiltX else padSX, padSY, 0)
     } else {
     val l = act && tiltX < -0.35f
     val r = act && tiltX > 0.35f
     if (l != dpL) {
     dpL = l
     v.sendKeyEvent(if (l) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_LEFT, 0)
     }
     if (r != dpR) {
     dpR = r
     v.sendKeyEvent(if (r) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, KeyEvent.KEYCODE_DPAD_RIGHT, 0)
     }
     }
     }
     private val tiltListener = object : android.hardware.SensorEventListener {
     override fun onSensorChanged(e: android.hardware.SensorEvent) {
     val ax = e.values[0]
     val ay = e.values[1]
     @Suppress("DEPRECATION")
     val rot = windowManager.defaultDisplay.rotation
     var sx = ax
     var sy = ay
     when (rot) {
     1 -> {
     sx = -ay
     sy = ax
     }
     2 -> {
     sx = -ax
     sy = -ay
     }
     3 -> {
     sx = ay
     sy = -ax
     }
     }
     if (tiltFirst) {
     tgx = sx
     tgy = sy
     tiltFirst = false
     }
     tgx += 0.25f * (sx - tgx)
     tgy += 0.25f * (sy - tgy)
     val phi = Math.toDegrees(Math.atan2(tgx.toDouble(), tgy.toDouble())).toFloat()
     if (tiltZero.isNaN()) tiltZero = phi
     var d = phi - tiltZero
     while (d > 180f) d -= 360f
     while (d < -180f) d += 360f
     var v = -d / tiltMax
     if (tiltInv) v = -v
     val dz = 0.07f
     var o = if (Math.abs(v) < dz) 0f else (v - Math.signum(v) * dz) / (1f - dz)
     if (o > 1f) o = 1f
     if (o < -1f) o = -1f
     if (Math.abs(o - tiltX) > 0.01f) {
     tiltX = o
     pushLeft()
     }
     }
     override fun onAccuracyChanged(s: android.hardware.Sensor?, a: Int) {
     }
     }
     private fun setTilt(on: Boolean) {
     if (on == tiltOn) return
     val sm = getSystemService(SENSOR_SERVICE) as android.hardware.SensorManager
     if (on) {
     val sen = sm.getDefaultSensor(android.hardware.Sensor.TYPE_ACCELEROMETER)
     if (sen == null) {
     say("Bu telefonda ivme sensoru yok")
     return
     }
     tiltMax = com.allcore.emulator.util.Prefs.getInt(this, "tilt_max", 35).toFloat()
     tiltInv = com.allcore.emulator.util.Prefs.getInt(this, "tilt_inv", 0) == 1
     tiltGate = com.allcore.emulator.util.Prefs.getInt(this, "tilt_gate", 0)
     tiltOn = true
     tiltZero = Float.NaN
     tiltFirst = true
     tiltX = 0f
     sm.registerListener(tiltListener, sen, android.hardware.SensorManager.SENSOR_DELAY_GAME)
     say("Egim direksiyonu acik. Telefonu rahat tutus acinda tut, oradan merkezlenir")
     } else {
     tiltOn = false
     sm.unregisterListener(tiltListener)
     tiltX = 0f
     pushLeft()
     say("Egim direksiyonu kapali")
     }
     tiltBtn?.alpha = if (tiltOn) 1f else 0.45f
     }
