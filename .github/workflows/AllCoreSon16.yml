     private fun mergeDir(src: File, dst: File, overwrite: Boolean) {
     dst.mkdirs()
     for (f in src.walkTopDown().toList()) {
     if (f == src) continue
     val o = File(dst, f.relativeTo(src).path)
     if (f.isDirectory) {
     o.mkdirs()
     } else {
     if (o.exists() && !overwrite) continue
     o.parentFile?.mkdirs()
     if (!f.renameTo(o)) {
     f.copyTo(o, true)
     f.delete()
     }
     }
     }
     }
     private fun installPspPack(tmp: File, parent: File) {
     val dest = pspBase(parent) ?: return
     val done = ArrayList<String>()
     try {
     val roots = tmp.walkTopDown().maxDepth(4).filter { it.isDirectory && it.name.equals("PSP", true) }.toList()
     for (r in roots) {
     for (c in r.listFiles() ?: emptyArray()) {
     if (!c.isDirectory) continue
     val tn = PSP_DATA[c.name.lowercase()] ?: continue
     mergeDir(c, File(dest, tn), tn != "SAVEDATA")
     c.deleteRecursively()
     if (tn !in done) done.add(tn)
