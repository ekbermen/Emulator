     cat << 'EOF' > app/src/main/java/com/allcore/emulator/emulator/Dbg.kt
     package com.allcore.emulator.emulator
     import android.app.ActivityManager
     import android.content.Context
     import android.os.Build
     import com.allcore.emulator.util.Platform
     import java.io.File
     import java.text.SimpleDateFormat
     import java.util.Date
     import java.util.Locale
     object Dbg {
     private val fmt = SimpleDateFormat("HH:mm:ss.SSS", Locale.US)
     private fun primary(ctx: Context): File = File(ctx.getExternalFilesDir(null) ?: ctx.filesDir, "allcore_log.txt")
     private fun mirror(): File = File(android.os.Environment.getExternalStorageDirectory(), "AllCore/allcore_log.txt")
     @Synchronized
     fun log(ctx: Context, msg: String) {
     val line = fmt.format(Date()) + " " + msg + "\n"
     try {
     android.util.Log.i("AllCore", msg)
     } catch (e: Throwable) {
     }
     try {
     val f = primary(ctx)
     if (f.exists() && f.length() > 200000L) f.writeText("")
     f.appendText(line)
     } catch (e: Throwable) {
     }
     try {
     val m = mirror()
     m.parentFile?.mkdirs()
     if (m.exists() && m.length() > 200000L) m.writeText("")
     m.appendText(line)
     } catch (e: Throwable) {
     }
     }
     fun tail(ctx: Context, n: Int): String {
     return try {
     primary(ctx).readLines().takeLast(n).joinToString("\n")
     } catch (e: Throwable) {
     "log yok"
     }
     }
     fun errName(s: String): String {
     val u = s.uppercase()
     return when {
     u == "0" || u.contains("LIBRARY") -> "CEKIRDEK YUKLENEMEDI"
     u == "1" || u.contains("GAME") -> "OYUN YUKLENEMEDI"
     u == "2" || u.contains("GL") -> "GL UYUMSUZ (cekirdek bu cihazin ekran surucusuyle calismiyor)"
     u == "3" || u.contains("SERIAL") -> "KAYIT DURUMU HATASI"
     else -> "GENEL HATA ($s)"
     }
     }
     private fun reasonName(r: Int): String = when (r) {
     1 -> "EXIT_SELF"
     2 -> "SIGNALED"
     3 -> "LOW_MEMORY"
     4 -> "CRASH (Java)"
     5 -> "CRASH_NATIVE (cekirdek cokmesi)"
     6 -> "ANR"
     7 -> "INITIALIZATION_FAILURE"
     9 -> "EXCESSIVE_RESOURCE_USAGE"
     10 -> "USER_REQUESTED"
     else -> "KOD $r"
     }
     private var sampleSeen = 0
     fun coreLogcat(ctx: Context, tag: String) {
     try {
     val pr = ProcessBuilder("logcat", "-d", "-b", "main,system,crash", "--pid=" + android.os.Process.myPid(), "-t", "2500").redirectErrorStream(true).start()
     val lines = pr.inputStream.bufferedReader().readLines()
     pr.waitFor()
     val noise = listOf(" AllCore : ", "Choreographer", "hwui", "RenderThread", "InsetsController", "ViewRootImpl", "SurfaceView", "BLASTBufferQueue", "AudioTrack", "OpenGLRenderer", "Compose", "ProfileInstaller", "InputMethod", "ImeTracker", "ActivityThread", "VRI[")
     val keep = lines.filter { l -> noise.none { n -> l.contains(n) } }
     log(ctx, "CEKIRDEK LOGU " + tag + ": " + lines.size + " satir, " + keep.size + " ilgili")
     val pd = lines.filter { it.contains("PlayDbg") }
     log(ctx, "PLAYDBG satir=" + pd.size)
     for (l in pd.takeLast(60)) log(ctx, "  PD: " + l.substringAfter("PlayDbg").take(200))
     for (l in keep.takeLast(12)) log(ctx, "  CL: " + l.take(200))
     } catch (e: Throwable) {
     log(ctx, "CEKIRDEK LOGU okunamadi: " + e.message)
     }
     }
     fun procInfo(ctx: Context, tag: String) {
     try {
     val sb = StringBuilder("PROC " + tag)
     try {
     java.io.File("/proc/self/io").readLines().filter { it.startsWith("rchar") || it.startsWith("read_bytes") || it.startsWith("syscr") }.forEach { sb.append(" | " + it.replace(" ", "")) }
     } catch (e: Throwable) {
     }
     try {
     sb.append(" | maps=" + java.io.File("/proc/self/maps").readLines().size)
     } catch (e: Throwable) {
     }
     try {
     val fds = java.io.File("/proc/self/fd").listFiles()
     if (fds != null) {
     sb.append(" | fdler=" + fds.size)
     for (fd in fds) {
     val tgt = try { android.system.Os.readlink(fd.absolutePath) } catch (e: Throwable) { "" }
     if (tgt.startsWith("/storage") && !tgt.contains("/Android/data/")) {
     val pos = try { java.io.File("/proc/self/fdinfo/" + fd.name).readLines().firstOrNull { it.startsWith("pos") } } catch (e: Throwable) { null }
     sb.append(" | fd" + fd.name + "=" + tgt.substringAfterLast('/') + " " + (pos ?: "").replace("\t", " "))
     }
     }
     }
     } catch (e: Throwable) {
     }
     try {
     val fr = StringBuilder()
     for (i in 0 until 8) {
     val v = try { java.io.File("/sys/devices/system/cpu/cpu" + i + "/cpufreq/scaling_cur_freq").readText().trim() } catch (e: Throwable) { "?" }
     fr.append(v).append(" ")
     }
     sb.append(" | cpuKHz=" + fr.toString().trim())
     } catch (e: Throwable) {
     }
     log(ctx, sb.toString())
     } catch (e: Throwable) {
     }
     }
     fun brief(ctx: Context, tag: String, gotFrame: Boolean, frames: Int) {
     try {
     val sb = StringBuilder("DURUM " + tag + " kare=" + frames + " ilkKare=" + gotFrame)
     val tids = java.io.File("/proc/self/task").listFiles()
     if (tids != null) {
     for (t in tids) {
     val comm = try { java.io.File(t, "comm").readText().trim() } catch (e: Throwable) { "?" }
     if (comm.startsWith("PS2VM") || comm.startsWith("DefaultDispatch") || comm.startsWith("GLThread") || comm.startsWith("llcore")) {
     val stat = try { java.io.File(t, "stat").readText() } catch (e: Throwable) { "" }
     val after = stat.substringAfterLast(")").trim().split(" ")
     sb.append(" | " + comm + ":" + (after.getOrNull(0) ?: "?") + " ut=" + (after.getOrNull(11) ?: "?") + " cpu=" + (after.getOrNull(36) ?: "?"))
     }
     }
     }
     try {
     java.io.File("/proc/meminfo").readLines().firstOrNull { it.startsWith("MemAvailable") }?.let { sb.append(" | " + it.replace("  ", " ")) }
     } catch (e: Throwable) {
     }
     log(ctx, sb.toString())
     procInfo(ctx, tag)
     try {
     val sf = java.io.File(ctx.cacheDir, "sample.txt")
     if (sf.exists()) {
     val all = sf.readLines()
     if (all.size < sampleSeen) sampleSeen = 0
     all.drop(sampleSeen).takeLast(260).forEach { log(ctx, "  " + it.take(200)) }
     sampleSeen = all.size
     }
     } catch (e: Throwable) {
     }
     } catch (e: Throwable) {
     }
     }
     fun threadDump(ctx: Context, tag: String) {
     try {
     log(ctx, "=== THREAD DOKUMU " + tag)
     for (f in arrayOf("/proc/meminfo", "/proc/self/status")) {
     try {
     java.io.File(f).readLines().filter { it.startsWith("MemTotal") || it.startsWith("MemAvailable") || it.startsWith("VmRSS") || it.startsWith("Threads") }.forEach { log(ctx, "  " + it.replace("  ", " ")) }
     } catch (e: Throwable) {
     }
     }
     val tids = java.io.File("/proc/self/task").listFiles()
     if (tids != null) {
     var cnt = 0
     for (t in tids.sortedBy { it.name.toIntOrNull() ?: 0 }) {
     if (cnt >= 70) break
     val comm = try { java.io.File(t, "comm").readText().trim() } catch (e: Throwable) { "?" }
     val stat = try { java.io.File(t, "stat").readText() } catch (e: Throwable) { "" }
     val after = stat.substringAfterLast(")").trim().split(" ")
     val st = after.getOrNull(0) ?: "?"
     val ut = after.getOrNull(11) ?: "?"
     val sy = after.getOrNull(12) ?: "?"
     val wc = try { java.io.File(t, "wchan").readText().trim() } catch (e: Throwable) { "" }
     val busy = (ut.toLongOrNull() ?: 0L) + (sy.toLongOrNull() ?: 0L) >= 20L || st == "R" || comm.contains("PS2") || comm.contains("GLThread")
     if (busy) log(ctx, "  THR " + t.name + " " + comm + " durum=" + st + " utime=" + ut + " stime=" + sy + " wchan=" + wc)
     cnt++
     }
     }
     for ((th, trace) in Thread.getAllStackTraces()) {
     if (th.name == "main" || th.name.contains("GL") || th.name.contains("Retro") || th.name.contains("PS2")) {
     log(ctx, "  JAVA " + th.name + " durum=" + th.state)
     for (fr in trace.take(14)) log(ctx, "    at " + fr.toString().take(160))
     }
     }
     } catch (e: Throwable) {
     log(ctx, "thread dokumu hatasi: " + e.message)
     }
     }
     private fun dumpLogcat(ctx: Context) {
     try {
     val pr = ProcessBuilder("logcat", "-d", "-b", "main,crash", "-t", "3000").redirectErrorStream(true).start()
     val lines = pr.inputStream.bufferedReader().readLines()
     pr.waitFor()
     val keys = listOf("AllCoreCrash", "libsigchain", "Fatal signal", "signal 11", "SIGSEGV", "SIGABRT", "Abort message", "libplay", "play_libretro", "Play!", "PS2", "GLRetro", "libretro", "libGLES_mali", "EGL", "tombstone", "backtrace")
     val keep = lines.filter { l -> !l.contains(" AllCore : ") && (l.contains(" F ") || keys.any { k -> l.contains(k) }) }
     log(ctx, "LOGCAT: " + lines.size + " satir okundu, " + keep.size + " ilgili")
     for (l in keep.takeLast(120)) log(ctx, "  LOGCAT: " + l.take(300))
     } catch (e: Throwable) {
     log(ctx, "LOGCAT okunamadi: " + e.message)
     }
     }
     fun exitInfo(ctx: Context) {
     if (Build.VERSION.SDK_INT < 30) return
     try {
     val sp = ctx.getSharedPreferences("allcore_dbg", Context.MODE_PRIVATE)
     val last = sp.getLong("exit_ts", 0L)
     val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
     val list = am.getHistoricalProcessExitReasons(ctx.packageName, 0, 4)
     var newest = last
     var dumped = false
     for (i in list.reversed()) {
     if (i.timestamp <= last) continue
     log(ctx, "ONCEKI KAPANMA: " + reasonName(i.reason) + " | durum/sinyal=" + i.status + " | " + (i.description ?: ""))
     if (!dumped && (i.reason == android.app.ApplicationExitInfo.REASON_CRASH_NATIVE || i.reason == android.app.ApplicationExitInfo.REASON_SIGNALED)) {
     dumped = true
     dumpLogcat(ctx)
     }
     if (i.reason == android.app.ApplicationExitInfo.REASON_ANR) {
     try {
     val ins = i.traceInputStream
     if (ins != null) {
     val buf = ArrayList<String>()
     var shown = 0
     fun flush() {
     if (buf.isNotEmpty() && shown < 100) {
     val head = buf[0]
     val keep = head.startsWith("\"main\"") || head.contains("PS2VM") || buf.any { it.contains("libplay") }
     if (keep) {
     for (b in buf.take(18)) {
     log(ctx, "  ANR: " + b.take(200))
     shown++
     }
     }
     }
     buf.clear()
     }
     ins.bufferedReader().forEachLine { ln ->
     if (ln.startsWith("\"")) flush()
     buf.add(ln)
     }
     flush()
     }
     } catch (e: Throwable) {
     log(ctx, "ANR trace okunamadi: " + e.message)
     }
     }
     if (i.timestamp > newest) newest = i.timestamp
     }
     sp.edit().putLong("exit_ts", newest).apply()
     } catch (e: Throwable) {
     }
     }
     }
     object Diag {
     private fun head(f: File, n: Int): ByteArray {
     val b = ByteArray(n)
     val r = try {
     f.inputStream().use { com.allcore.emulator.util.Sniff.readHead(it, b) }
     } catch (e: Throwable) {
     0
     }
     return b.copyOf(r)
     }
     private fun same(b: ByteArray, off: Int, s: String): Boolean {
     if (off + s.length > b.size) return false
     for (i in s.indices) if (b[off + i].toInt() != s[i].code) return false
     return true
     }
     private fun zipCount(f: File): Int {
     val z = try {
     java.util.zip.ZipFile(f)
     } catch (e: IllegalArgumentException) {
     java.util.zip.ZipFile(f, Charsets.ISO_8859_1)
     }
     return z.use { it.size() }
     }
     fun hardProblem(f: File, platform: Platform): String? {
     if (!f.exists()) return "Dosya yok (silinmis veya tasinmis)."
     if (!f.isFile) return "Bu bir dosya degil."
     if (!f.canRead()) return "Dosya okunamiyor (izin yok)."
     if (f.length() <= 0L) return "Dosya bos (0 bayt). Kopyalama veya indirme yarim kalmis."
     val ext = f.extension.lowercase()
     if (ext == "zip") {
     try {
     if (zipCount(f) == 0) return "ZIP bos, icinde dosya yok."
     } catch (e: Throwable) {
     return "ZIP bozuk veya yarim inmis (" + (e.message ?: "okunamadi") + ")."
     }
     val keep = com.allcore.emulator.util.FileHelper.keepZipPlatforms
     if (platform !in keep && platform != Platform.VITA) return "ZIP icinden oyun cikarilamadi: icinde desteklenen oyun dosyasi yok veya ZIP bozuk."
     }
     if (ext == "cue") {
     val txt = try {
     f.readText(Charsets.ISO_8859_1).take(100000)
     } catch (e: Throwable) {
     ""
     }
     val re = Regex("^\\s*FILE\\s+(?:\"([^\"]+)\"|(\\S+))", RegexOption.IGNORE_CASE)
     val dir = f.parentFile
     val sibs = dir?.listFiles()?.map { it.name.lowercase() }?.toSet() ?: emptySet()
     for (line in txt.lines()) {
     val m = re.find(line) ?: continue
     val n = (m.groups[1]?.value ?: m.groups[2]?.value ?: "").replace('\\', '/')
     val direct = dir != null && File(dir, n).isFile
     if (!direct && n.substringAfterLast('/').lowercase() !in sibs) return "CUE dosyasinin istedigi parca yok: " + n.substringAfterLast('/')
     }
     }
     return null
     }
     fun fileProblem(f: File, platform: Platform): String? {
     val h = hardProblem(f, platform)
     if (h != null) return h
     val b = head(f, 16)
     if (b.size < 4) return "Dosya cok kisa, bozuk."
     when (f.extension.lowercase()) {
     "nes" -> if (!same(b, 0, "NES\u001A")) return "NES basligi yok: dosya bozuk veya uzantisi yanlis."
     "chd" -> if (!same(b, 0, "MComprHD")) return "CHD basligi gecersiz: dosya bozuk veya yarim inmis."
     "cso" -> if (!same(b, 0, "CISO") && !same(b, 0, "ZISO")) return "CSO basligi gecersiz: dosya bozuk."
     "pbp" -> if (!same(b, 1, "PBP")) return "PBP basligi gecersiz: dosya bozuk."
     "rvz" -> if (!same(b, 0, "RVZ")) return "RVZ basligi gecersiz: dosya bozuk."
     "wbfs" -> if (!same(b, 0, "WBFS")) return "WBFS basligi gecersiz: dosya bozuk."
     "sfc", "smc" -> {
     val r = f.length() % 1024L
     if (r != 0L && r != 512L) return "SNES dosya boyutu gecersiz: dosya kesilmis olabilir."
     }
     }
     return null
     }
     fun verdict(f: File, platform: Platform, err: String): String {
     val p = fileProblem(f, platform)
     if (p != null) return "DOSYA BOZUK / EKSIK\n\n" + p + "\n\nOyunu yeniden indirip ekleyin."
     val hint = when (platform) {
     Platform.ARCADE, Platform.NEOGEO -> "ROM seti bu cekirdegin surumune uymuyor veya BIOS (ornek neogeo.zip) eksik olabilir. BIOS dosyasini AllCore/system klasorune koy."
     Platform.PS1, Platform.SATURN, Platform.SEGACD, Platform.PCECD, Platform.PCFX, Platform.TDO, Platform.DC -> "Bu sistem BIOS dosyasi ister; BIOS eksik veya yanlis surum olabilir. BIOS dosyalarini telefondaki AllCore/system klasorune koy (Tum dosya erisimi izni acik olmali), oyunu tekrar ac."
     Platform.PSP, Platform.GAMECUBE, Platform.WII -> "Sifreli veya desteklenmeyen bir kopya olabilir (CSO/RVZ/ISO bicimini kontrol edin)."
     else -> "Bu oyun secili cekirdekle uyumsuz olabilir."
     }
     return "OYUN DOSYASI SAGLAM GORUNUYOR\n\nSorun dosyada degil, oyunda/cekirdekte: " + hint + "\n\nHata: " + err
     }
     }
     EOF
     cat << 'EOF' > app/src/main/java/com/allcore/emulator/emulator/AutoFix.kt
     package com.allcore.emulator.emulator
     import android.content.Context
     import com.allcore.emulator.util.DiscAnalyzer
     import com.allcore.emulator.util.FileHelper
     import com.allcore.emulator.util.Platform
     import com.allcore.emulator.util.PlatformDetector
     import java.io.File
     object AutoFix {
     class Result(val file: File, val platform: Platform, val notes: List<String>)
     fun repair(ctx: Context, file0: File, plat0: Platform): Result {
     val notes = ArrayList<String>()
     var file = file0
     var plat = plat0
     if (!file.exists()) {
     val found = findNearby(ctx, file)
     if (found == null) return Result(file, plat, notes)
     file = found
     notes.add("dosya yeniden bulundu")
     }
     val ext = file.extension.lowercase()
     val lname = file.name.lowercase()
     val isTar = ext == "tar" || ext == "tgz" || lname.endsWith(".tar.gz")
     if ((ext == "zip" || ext == "rar" || ext == "7z" || isTar) && plat !in FileHelper.keepZipPlatforms && plat != Platform.VITA) {
     val r = try {
     FileHelper.resolveGameFile(file, file.parentFile)
     } catch (e: Throwable) {
     file
     }
     if (r.absolutePath != file.absolutePath && r.exists()) {
     file = r
     notes.add("arsiv acildi")
     val d = PlatformDetector.detect(file.name)
     if (d != Platform.UNKNOWN) plat = d
     }
     }
     if (file.extension.lowercase() == "cue") fixCue(file, notes)
     return Result(file, plat, notes)
     }
     private fun findNearby(ctx: Context, f: File): File? {
     return try {
     val roots = ArrayList<File>()
     f.parentFile?.let { if (it.isDirectory) roots.add(it) }
     roots.add(FileHelper.gamesDir(ctx))
     val base = f.nameWithoutExtension.lowercase()
     for (r in roots) {
     val all = r.walkTopDown().maxDepth(4).filter { it.isFile }.toList()
     val same = all.firstOrNull { it.name.equals(f.name, true) }
     if (same != null) return same
     val alt = all.firstOrNull { it.nameWithoutExtension.lowercase() == base && PlatformDetector.detect(it.name) != Platform.UNKNOWN }
     if (alt != null) return alt
     }
     null
     } catch (e: Throwable) {
     null
     }
     }
     private fun fixCue(f: File, notes: MutableList<String>) {
     try {
     val dir = f.parentFile ?: return
     val all = dir.walkTopDown().maxDepth(4).filter { it.isFile && it != f }.toList()
     val re = Regex("^(\\s*FILE\\s+)(?:\"([^\"]+)\"|(\\S+))(.*)$", RegexOption.IGNORE_CASE)
     val lines = f.readText(Charsets.ISO_8859_1).lines()
     val fileLines = lines.count { re.find(it) != null }
     val out = ArrayList<String>()
     var changed = false
     var missing: String? = null
     for (line in lines) {
     val m = re.find(line)
     if (m == null) {
     out.add(line)
     continue
     }
     val ref = (m.groups[2]?.value ?: m.groups[3]?.value ?: "").replace('\\', '/')
     if (File(dir, ref).isFile) {
     out.add(line)
     continue
     }
     val base = ref.substringAfterLast('/')
     var hit = all.firstOrNull { it.name.equals(base, true) }
     if (hit == null && fileLines == 1) {
     hit = all.firstOrNull { val x = it.extension.lowercase(); x == "bin" || x == "img" || x == "iso" || x == "raw" }
     }
     if (hit == null) {
     if (missing == null) missing = base
     out.add(line)
     continue
     }
     val rel = hit.relativeTo(dir).path.replace(File.separatorChar, '/')
     out.add(m.groupValues[1] + "\"" + rel + "\"" + m.groupValues[4])
     changed = true
     }
     if (changed) {
     f.writeText(out.joinToString("\n"), Charsets.ISO_8859_1)
     notes.add("CUE yolu duzeltildi")
     }
     if (missing != null) notes.add("CUE parcasi yok: " + missing)
     } catch (e: Throwable) {
     }
     }
     fun nextPlatform(ctx: Context, file: File, cur: Platform, tried: String): Platform? {
     val t = tried.split(",").filter { it.isNotEmpty() }.toSet()
     if (t.size >= 6) return null
     val ext = file.extension.lowercase()
     val cand = ArrayList<Platform>()
     if (ext == "bin" || ext == "iso" || ext == "cue" || ext == "img" || ext == "chd") {
     val r = try {
     DiscAnalyzer.refine(file, Platform.PS1)
     } catch (e: Throwable) {
     Platform.PS1
     }
     cand.add(r)
     }
     when (ext) {
     "bin", "img" -> cand.addAll(listOf(Platform.GENESIS, Platform.A2600, Platform.A7800, Platform.SMS, Platform.PS1, Platform.SATURN, Platform.SEGACD, Platform.PCECD, Platform.PICO, Platform.S32X, Platform.TDO, Platform.PCFX))
     "iso" -> cand.addAll(listOf(Platform.PS1, Platform.PSP, Platform.SATURN, Platform.SEGACD, Platform.PCECD, Platform.TDO, Platform.GAMECUBE, Platform.WII, Platform.DC, Platform.PCFX))
     "cue", "chd" -> cand.addAll(listOf(Platform.PS1, Platform.SATURN, Platform.SEGACD, Platform.PCECD, Platform.PCFX, Platform.TDO, Platform.NEOGEOCD, Platform.DC, Platform.CD32, Platform.AMIGA))
     else -> {
     }
     }
     return cand.firstOrNull { it != cur && it.display !in t && it != Platform.PS2 && it != Platform.UNKNOWN && Cores.available(ctx, it) }
     }
     }
