     cat << 'EOF' > app/src/main/java/com/allcore/emulator/MainActivity.kt
     package com.allcore.emulator
     import com.allcore.emulator.emulator.MusicService
     import android.os.Build
     import android.os.Bundle
     import android.view.WindowManager
     import androidx.activity.ComponentActivity
     import androidx.activity.compose.setContent
     import androidx.activity.viewModels
     import androidx.core.view.WindowCompat
     import androidx.core.view.WindowInsetsCompat
     import androidx.core.view.WindowInsetsControllerCompat
     import com.allcore.emulator.data.GameViewModel
     import com.allcore.emulator.ui.AllCoreApp
     import com.allcore.emulator.ui.MonitorHost
     import com.allcore.emulator.emulator.TvHub
     import android.view.KeyEvent
     import com.allcore.emulator.ui.AllCoreTheme
     import com.allcore.emulator.util.AmbientMusic
     import com.allcore.emulator.util.Gfx
     import com.allcore.emulator.util.L
     import com.allcore.emulator.util.Prefs
     import com.allcore.emulator.util.Sfx
     class MainActivity : ComponentActivity() {
     private val vm: GameViewModel by viewModels()
     private val menuSink = object : TvHub.Sink {
     override fun key(port: Int, code: Int, down: Boolean) {
     val kc = when (code) {
     KeyEvent.KEYCODE_BUTTON_B -> KeyEvent.KEYCODE_DPAD_CENTER
     KeyEvent.KEYCODE_BUTTON_A -> KeyEvent.KEYCODE_BACK
     KeyEvent.KEYCODE_BUTTON_START -> KeyEvent.KEYCODE_ENTER
     KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT -> code
     else -> return
     }
     runOnUiThread { dispatchKeyEvent(KeyEvent(if (down) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP, kc)) }
     }
     override fun stick(port: Int, x: Float, y: Float) {}
     }
     override fun onCreate(savedInstanceState: Bundle?) {
     super.onCreate(savedInstanceState)
     WindowCompat.setDecorFitsSystemWindows(window, false)
     if (Build.VERSION.SDK_INT >= 28) {
     val lp = window.attributes
     lp.layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= 30) {
     WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
     } else {
     WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
     }
     window.attributes = lp
     }
     hideSystemUi()
     Sfx.enabled = Prefs.sfx(this)
     Sfx.init()
     L.lang = Prefs.getInt(this, "lang", 0)
     L.init(applicationContext)
     Gfx.load(this)
     com.allcore.emulator.emulator.Dbg.exitInfo(this)
     val fpsIdx = Prefs.getInt(this, "fps", -1)
     if (fpsIdx >= 0) Gfx.applyFps(this, fpsIdx)
     AmbientMusic.volume = Prefs.musicVolume(this)
     com.allcore.emulator.util.FileHelper.passwordPrompt = { n, w -> promptPassword(n, w) }
     setContent {
     AllCoreTheme {
     AllCoreApp(vm)
     MonitorHost()
     }
     }
     }
     private fun promptPassword(name: String, wrong: Boolean): String? {
     if (isFinishing || isDestroyed) return null
     if (android.os.Looper.myLooper() == android.os.Looper.getMainLooper()) return null
     val latch = java.util.concurrent.CountDownLatch(1)
     val res = java.util.concurrent.atomic.AtomicReference<String?>(null)
     runOnUiThread {
     try {
     val et = android.widget.EditText(this)
     et.inputType = android.text.InputType.TYPE_CLASS_TEXT or android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD
     et.hint = "Sifre"
     android.app.AlertDialog.Builder(this)
     .setTitle(if (wrong) "Sifre yanlis, tekrar dene" else "Sifreli arsiv")
     .setMessage(name)
     .setView(et)
     .setCancelable(false)
     .setPositiveButton("Ac") { _, _ ->
     res.set(et.text.toString())
     latch.countDown()
     }
     .setNegativeButton("Vazgec") { _, _ -> latch.countDown() }
     .show()
     } catch (t: Throwable) {
     latch.countDown()
     }
     }
     try {
     latch.await(10, java.util.concurrent.TimeUnit.MINUTES)
     } catch (t: Throwable) {
     }
     val r = res.get()
     return if (r == null || r.isEmpty()) null else r
     }
     override fun onResume() {
     super.onResume()
     hideSystemUi()
     if (Prefs.music(this) && !MusicService.playing) AmbientMusic.start()
     TvHub.sink = menuSink
     }
     override fun onPause() {
     super.onPause()
     AmbientMusic.pause()
     }
     override fun onWindowFocusChanged(hasFocus: Boolean) {
     super.onWindowFocusChanged(hasFocus)
     if (hasFocus) hideSystemUi()
     }
     private fun hideSystemUi() {
     val c = WindowInsetsControllerCompat(window, window.decorView)
     c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
     c.hide(WindowInsetsCompat.Type.systemBars())
     }
     }
