     package com.allcore.emulator.emulator
     import android.content.Context
     import android.graphics.Bitmap
     import com.google.android.gms.tasks.Tasks
     import com.google.mlkit.common.model.DownloadConditions
     import com.google.mlkit.nl.languageid.LanguageIdentification
     import com.google.mlkit.nl.languageid.LanguageIdentificationOptions
     import com.google.mlkit.nl.translate.TranslateLanguage
     import com.google.mlkit.nl.translate.Translation
     import com.google.mlkit.nl.translate.TranslatorOptions
     import java.io.File
     import java.net.HttpURLConnection
     import java.net.URL
     import java.util.concurrent.atomic.AtomicBoolean
     object LiveTranslate {
     @Volatile var mode = 0
     @Volatile var region = 0
     val regionNames = arrayOf("Alt serit (altyazi)", "Tum ekran", "Ust yari", "Orta serit")
     private var pendingText = ""
     private val recog by lazy { com.google.mlkit.vision.text.TextRecognition.getClient(com.google.mlkit.vision.text.latin.TextRecognizerOptions.DEFAULT_OPTIONS) }
     private fun cropRegion(src: Bitmap): Bitmap {
     val h = src.height
     val w = src.width
     val r = when (region) {
     0 -> Pair(h * 62 / 100, h)
     2 -> Pair(0, h / 2)
     3 -> Pair(h * 30 / 100, h * 70 / 100)
     else -> Pair(0, h)
     }
     if (r.first == 0 && r.second == h) return src
     return Bitmap.createBitmap(src, 0, r.first, w, r.second - r.first)
     }
     @Volatile var onText: ((String) -> Unit)? = null
     private val busy = AtomicBoolean(false)
     private var last = ""
     private var lastMode = 0
     private var lastRun = 0L
     private val cache = HashMap<String, com.google.mlkit.nl.translate.Translator>()
     private val idClient by lazy {
     LanguageIdentification.getClient(LanguageIdentificationOptions.Builder().setConfidenceThreshold(0.7f).build())
     }
     val names = arrayOf("Kapali", "Dili algila > Turkce", "Dili algila > Ingilizce", "Dili algila > Rusca")
     fun due(): Boolean = mode != 0 && !busy.get() && System.currentTimeMillis() - lastRun > 2500
     fun feed(ctx: Context, bmp: Bitmap) {
     if (!busy.compareAndSet(false, true)) return
     lastRun = System.currentTimeMillis()
     val copy = bmp.copy(Bitmap.Config.ARGB_8888, false)
     Thread {
     try {
     work(ctx.applicationContext, copy)
     } catch (e: Throwable) {
     onText?.invoke("Ceviri hatasi: internet gerekebilir")
     } finally {
     copy.recycle()
     busy.set(false)
     }
     }.start()
     }
     fun release() {
     last = ""
     pendingText = ""
     }
     private fun good(s: String): Boolean {
     var letters = 0
     var other = 0
     for (ch in s) {
     if (ch.isLetter()) letters++ else if (!ch.isWhitespace() && !ch.isDigit() && ".,!?'-:;()\"".indexOf(ch) < 0) other++
     }
     if (letters < 3) return false
     return other * 3 <= letters
     }
     private fun similar(a: String, b: String): Boolean {
     if (a.isEmpty() || b.isEmpty()) return false
     val x = a.lowercase().split(' ').filter { it.isNotEmpty() }.toSet()
     val y = b.lowercase().split(' ').filter { it.isNotEmpty() }.toSet()
     if (x.isEmpty() || y.isEmpty()) return false
     val inter = x.count { y.contains(it) }
     return inter.toDouble() / (x.size + y.size - inter) >= 0.8
     }
     private fun work(ctx: Context, bmp: Bitmap) {
     val m = mode
     if (m == 0) return
     if (m != lastMode) {
     lastMode = m
     last = ""
     pendingText = ""
     }
     val dst = when (m) {
     1 -> TranslateLanguage.TURKISH
     2 -> TranslateLanguage.ENGLISH
     else -> TranslateLanguage.RUSSIAN
     }
     val part = cropRegion(bmp)
     val res = try {
     Tasks.await(recog.process(com.google.mlkit.vision.common.InputImage.fromBitmap(part, 0)))
     } finally {
     if (part !== bmp) part.recycle()
     }
     val lines = ArrayList<String>()
     for (blk in res.textBlocks) {
     for (ln in blk.lines) {
     val t = ln.text.trim()
     if (t.length >= 3 && good(t)) lines.add(t)
     }
     }
     val text = lines.joinToString(" ").replace(Regex("\\s+"), " ").trim()
     if (text.length < 4) {
     pendingText = ""
     return
     }
     if (similar(text, last)) return
     if (!similar(text, pendingText)) {
     pendingText = text
     return
     }
     last = text
     pendingText = ""
     val code = Tasks.await(idClient.identifyLanguage(text))
     val src = TranslateLanguage.fromLanguageTag(code) ?: return
     if (src == dst) return
     val key = "$src>$dst"
     val tr = cache.getOrPut(key) {
     Translation.getClient(TranslatorOptions.Builder().setSourceLanguage(src).setTargetLanguage(dst).build())
     }
     Tasks.await(tr.downloadModelIfNeeded(DownloadConditions.Builder().build()))
     onText?.invoke(Tasks.await(tr.translate(text)))
     }
     }
