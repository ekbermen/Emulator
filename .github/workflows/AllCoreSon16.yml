     fun sfx(c: Context): Boolean = sp(c).getBoolean("sfx", true)
     fun setSfx(c: Context, v: Boolean) = sp(c).edit().putBoolean("sfx", v).apply()
     fun musicVolume(c: Context): Float = sp(c).getFloat("music_volume", 0.5f)
     fun setMusicVolume(c: Context, v: Float) = sp(c).edit().putFloat("music_volume", v).apply()
     }
     object Gfx {
     var quality by mutableIntStateOf(2)
     var anim by mutableStateOf(true)
