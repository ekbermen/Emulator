     private fun gameRank(name: String): Int {
     val base = File(name).name
     if (name.startsWith("__MACOSX") || base.startsWith("._")) return -1
     if (PlatformDetector.detect(base) == Platform.UNKNOWN) return -1
     return when (base.substringAfterLast('.', "").lowercase()) {
     "cue", "gdi" -> 1
     "cdi" -> 2
     "chd" -> 3
     "iso", "pbp", "cso", "gcm", "gcz", "wbfs", "rvz", "wux", "wud" -> 4
     "exe", "com", "bat", "dosz", "scummvm", "svm" -> -1
     "bin", "img" -> 6
     else -> 5
     }
     }
     private fun pickPrimary(names: List<String>): String? {
     var best: String? = null
     var br = 99
     for (n in names.sortedBy { it.lowercase() }) {
     val r = gameRank(n)
     if (r in 1 until br) {
     best = n
     br = r
     }
     }
     return best
     }
     private fun needsSiblings(name: String, all: List<String>): Boolean {
     val e = name.substringAfterLast('.', "").lowercase()
     if (e == "cue" || e == "gdi") return true
     if (e == "pbp") {
     val d = name.substringBeforeLast('/', "")
     val pre = if (d.isEmpty()) "" else "$d/"
     val other = all.count { it != name && it.startsWith(pre) && gameRank(it) < 0 && !it.startsWith("__MACOSX") && !File(it).name.startsWith(".") }
     return other >= 2
     }
     return false
     }
     fun uniqueDir(parent: File, name: String): File {
     var d = File(parent, name)
