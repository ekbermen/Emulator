     }
     } catch (t: Throwable) {
     }
     if (done.isNotEmpty()) lastNote = "PSP verileri kuruldu: " + done.joinToString(", ")
     }
     private fun zu16(b: ByteArray, o: Int): Int = (b[o].toInt() and 0xFF) or ((b[o + 1].toInt() and 0xFF) shl 8)
     private fun zu32(b: ByteArray, o: Int): Long = zu16(b, o).toLong() or (zu16(b, o + 2).toLong() shl 16)
     private fun cdEncrypted(file: File): Boolean? {
     return try {
     java.io.RandomAccessFile(file, "r").use { r ->
     val len = r.length()
     val tail = minOf(len, 1048576L + 22L).toInt()
     if (tail < 22) return@use null
     val buf = ByteArray(tail)
     r.seek(len - tail)
     r.readFully(buf)
     var eocd = -1
     var i = tail - 22
     while (i >= 0) {
     if (buf[i] == 0x50.toByte() && buf[i + 1] == 0x4B.toByte() && buf[i + 2] == 0x05.toByte() && buf[i + 3] == 0x06.toByte()) {
     eocd = i
     break
     }
     i--
     }
     if (eocd < 0) return@use null
     var cdSize = zu32(buf, eocd + 12)
     var cdOff = zu32(buf, eocd + 16)
     if (cdOff == 0xFFFFFFFFL || cdSize == 0xFFFFFFFFL) {
     val z = eocd - 20
     if (z < 0 || zu32(buf, z) != 0x07064b50L) return@use null
     val zoff = zu32(buf, z + 8) or (zu32(buf, z + 12) shl 32)
     val hb = ByteArray(56)
     r.seek(zoff)
     r.readFully(hb)
     if (zu32(hb, 0) != 0x06064b50L) return@use null
     cdSize = zu32(hb, 40) or (zu32(hb, 44) shl 32)
     cdOff = zu32(hb, 48) or (zu32(hb, 52) shl 32)
     }
     if (cdSize <= 0L || cdSize > 64L * 1024L * 1024L) return@use null
     val cd = ByteArray(cdSize.toInt())
     r.seek(cdOff)
     r.readFully(cd)
     var p = 0
     var enc = false
     while (p + 46 <= cd.size && zu32(cd, p) == 0x02014b50L) {
     if ((zu16(cd, p + 8) and 1) != 0 || zu16(cd, p + 10) == 99) {
     enc = true
     break
     }
     p += 46 + zu16(cd, p + 28) + zu16(cd, p + 30) + zu16(cd, p + 32)
     }
     enc
     }
     } catch (t: Throwable) {
     null
     }
     }
     private fun zipEncrypted(file: File): Boolean {
     val c = cdEncrypted(file)
