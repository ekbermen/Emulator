     private fun applySize() {
     val v = gl ?: return
     val sw = root.width
     val sh = root.height
     if (sw <= 0 || sh <= 0) return
     val pct = GameSettings.sizePct(this, gameId)
     val lp = FrameLayout.LayoutParams(-1, -1, Gravity.CENTER)
     if (pct > 0) {
     val nat = GameSettings.nativeSize(platform)
     val ms = minOf(sw.toFloat() / nat.first, sh.toFloat() / nat.second)
     val sc = minOf(pct / 100f, ms)
     lp.width = maxOf(1, (nat.first * sc).toInt())
     lp.height = maxOf(1, (nat.second * sc).toInt())
     }
     try {
     v.javaClass.getMethod("setViewport", android.graphics.RectF::class.java).invoke(v, android.graphics.RectF(0f, 0f, 1f, 1f))
     } catch (t: Throwable) {
     }
     v.scaleX = 1f
     v.scaleY = 1f
     v.layoutParams = lp
     v.requestLayout()
     }
