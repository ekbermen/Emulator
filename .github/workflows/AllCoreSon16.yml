     LazyColumn(Modifier.weight(1f)) {
     items(items) { f ->
     val on = sel.contains(f)
     Text(
     (if (f.isDirectory) "[ ] " else "") + f.name,
     Modifier.fillMaxWidth().clickable {
     if (f.isDirectory) {
     dir = f
     } else if (!multi) {
     onDone(listOf(f))
     } else if (on) {
     sel.remove(f)
     } else {
     sel.add(f)
     }
     }.padding(vertical = 10.dp),
     color = if (on) AC.Cyan else AC.Text,
     fontSize = 15.sp
     )
     }
     }
     Row {
     TextButton(onClick = onCancel) { Text("Iptal", color = AC.Muted) }
     TextButton(onClick = { onDone(if (folderMode) listOf(dir) else sel.toList()) }, enabled = folderMode || sel.isNotEmpty()) {
     Text(if (folderMode) "Bu klasoru sec" else "Ekle (" + sel.size + ")", color = AC.Cyan)
     }
     }
     }
     }
