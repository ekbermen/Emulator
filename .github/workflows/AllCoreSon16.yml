     val bw = w * 0.34f
     val bx = (w - bw) / 2f
     val by = h * 0.86f
     p.shader = null
     p.color = Color.argb(70, 255, 255, 255)
     c.drawRoundRect(bx, by, bx + bw, by + 6f, 3f, 3f, p)
     val seg = bw * 0.28f
     val pos = ((t * 0.9f) % 1.4f) / 1.4f
     val sx = bx + (bw + seg) * pos - seg
     p.color = if (style == 1) Color.rgb(15, 56, 15) else Color.WHITE
     val l = maxOf(bx, sx)
     val r = minOf(bx + bw, sx + seg)
