     Tuning.setBool(v, "setAudioEnabled", snd)
     }
     private val govTick = object : Runnable {
     override fun run() {
     val f = gFrames
     gFrames = 0
     try {
     if (started && !menuOpen && ff == 1 && !choreo && resumeAt > 0L && !isFinishing) {
     gWin++
     if (f > gMaxWin) gMaxWin = f
     if (gWin >= 20) {
     gPeak = gMaxWin
     gMaxWin = 0
     gWin = 0
     }
     if (gPeak >= 20 && f < gPeak * 3 / 4) gBad++ else gBad = 0
     var hot = false
     if (Build.VERSION.SDK_INT >= 29) {
     val pm = getSystemService(POWER_SERVICE) as android.os.PowerManager
     hot = pm.currentThermalStatus >= android.os.PowerManager.THERMAL_STATUS_SEVERE
     }
     if (gBad >= 5 || hot) {
     gBad = 0
     govDown()
     }
     }
     } catch (e: Throwable) {
     }
     ui.postDelayed(this, 1000L)
     }
     }
     private fun govDown() {
     val v = gl ?: return
     gPeak = 0
     gMaxWin = 0
     gWin = 0
     gStage++
     if (gStage == 1 && tuneLevel > 0) {
     tuneLevel = 0
     Tuning.updateLive(v, Tuning.options(platform, 0))
     return
     }
     if (gStage <= 2 && !shaderOff && GameSettings.filter(this, gameId) != 0) {
     shaderOff = true
     Tuning.setShader(v, 0)
     return
     }
     low = true
     }
