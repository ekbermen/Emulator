     if (fx != null) {
     fx
     } else {
     lastIssue = "Arsiv acilamadi (" + ext + "): " + (if (ext == "zip" && lastDetail.isNotEmpty()) lastDetail else e.javaClass.simpleName + " " + (e.message ?: ""))
     file
