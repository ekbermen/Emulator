name: Build AllCore APK
on:
 push:
  branches: [main]
 workflow_dispatch:
  inputs:
   dolphin:
    description: 'Dolphin cekirdegini tekrar derle (true yaz)'
    default: 'false'
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-java@v4
    with:
     distribution: temurin
     java-version: '17'
  - name: Install Gradle 8.5
    run: |
     ok=0
     for i in 1 2 3 4 5; do
      for u in https://services.gradle.org/distributions/gradle-8.5-bin.zip https://downloads.gradle.org/distributions/gradle-8.5-bin.zip; do
       if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/gradle.zip "$u" && unzip -tq /tmp/gradle.zip > /dev/null; then ok=1; break; fi
       echo "indirme basarisiz: $u (deneme $i)"
      done
      [ "$ok" = "1" ] && break
      sleep 20
     done
     [ "$ok" = "1" ] || { echo "Gradle 8.5 indirilemedi"; exit 1; }
     sudo unzip -q -o /tmp/gradle.zip -d /opt
     echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"
     /opt/gradle-8.5/bin/gradle --version
  - name: Create AllCore project files
    run: |
     mkdir -p app/src/main/{java/com/allcore/emulator/{data,emulator,ui,util},res/{drawable,values,xml},assets}
     cat << 'EOF' > settings.gradle.kts
     pluginManagement {
     repositories {
     google()
     mavenCentral()
     gradlePluginPortal()
     }
     }
     dependencyResolutionManagement {
     repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
     repositories {
     google()
     mavenCentral()
     maven("https://jitpack.io")
     }
     }
     rootProject.name = "AllCore"
     include(":app")
     EOF
     cat << 'EOF' > build.gradle.kts
     plugins {
     id("com.android.application") version "8.2.2" apply false
     id("org.jetbrains.kotlin.android") version "1.9.22" apply false
     id("com.google.devtools.ksp") version "1.9.22-1.0.17" apply false
     }
     EOF
     cat << 'EOF' > gradle.properties
     org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
     android.useAndroidX=true
     android.nonTransitiveRClass=true
     kotlin.code.style=official
     kotlin.compiler.execution.strategy=in-process
     EOF
     cat << 'EOF' > app/build.gradle.kts
     plugins {
     id("com.android.application")
     id("org.jetbrains.kotlin.android")
     id("com.google.devtools.ksp")
     }
     android {
     namespace = "com.allcore.emulator"
     compileSdk = 34
     defaultConfig {
     applicationId = "com.allcore.emulator"
     minSdk = 26
     targetSdk = 34
     versionCode = 22
     versionName = "2.21-son12"
     ndk { abiFilters += "arm64-v8a" }
     }
     buildTypes {
     release {
     isMinifyEnabled = false
     }
     }
     compileOptions {
     sourceCompatibility = JavaVersion.VERSION_17
     targetCompatibility = JavaVersion.VERSION_17
     }
     kotlinOptions {
     jvmTarget = "17"
     }
     buildFeatures {
     compose = true
     }
     composeOptions {
     kotlinCompilerExtensionVersion = "1.5.10"
     }
     packaging {
     jniLibs { useLegacyPackaging = true }
     resources {
     excludes += "/META-INF/{AL2.0,LGPL2.1}"
     }
     }
     }
     dependencies {
     implementation("androidx.core:core-ktx:1.12.0")
     implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
     implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
