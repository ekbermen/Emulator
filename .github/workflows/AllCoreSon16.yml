     object ControllerSettings {
     private val targets = listOf(
     "A" to KeyEvent.KEYCODE_BUTTON_A, "B" to KeyEvent.KEYCODE_BUTTON_B,
     "X" to KeyEvent.KEYCODE_BUTTON_X, "Y" to KeyEvent.KEYCODE_BUTTON_Y,
     "L1" to KeyEvent.KEYCODE_BUTTON_L1, "R1" to KeyEvent.KEYCODE_BUTTON_R1,
     "L2" to KeyEvent.KEYCODE_BUTTON_L2, "R2" to KeyEvent.KEYCODE_BUTTON_R2,
     "L3" to KeyEvent.KEYCODE_BUTTON_THUMBL, "R3" to KeyEvent.KEYCODE_BUTTON_THUMBR,
     "START" to KeyEvent.KEYCODE_BUTTON_START, "SELECT" to KeyEvent.KEYCODE_BUTTON_SELECT
     )
     private fun pads(): String {
     val out = ArrayList<String>()
     for (id in InputDevice.getDeviceIds()) {
     val d = InputDevice.getDevice(id) ?: continue
     val s = d.sources
     val isPad = (s and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
     (s and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
     if (isPad && !d.isVirtual) out.add(d.name)
     }
     return out.joinToString(", ")
     }
     fun show(ctx: Context) {
     val p = pads()
     val items = ArrayList<String>()
     for (t in targets) items.add(t.first + " tusunu ata")
     items.add("Hepsini sifirla")
     android.app.AlertDialog.Builder(ctx)
     .setTitle(if (p.isEmpty()) "Bagli kol yok (Bluetooth/USB kol tak)" else "Bagli: " + p)
     .setItems(items.toTypedArray()) { _, i ->
     if (i == targets.size) {
     Extra.clearMap(ctx)
     toast(ctx, "Tuslar sifirlandi")
     } else {
     capture(ctx, targets[i])
     }
     }
     .setNegativeButton("Kapat", null)
     .show()
     }
     private fun capture(ctx: Context, t: Pair<String, Int>) {
     val d = android.app.AlertDialog.Builder(ctx)
     .setTitle(t.first + " icin kolda bir tusa bas")
     .setMessage("Basilan kol tusu oyunda " + t.first + " olarak calisir.")
     .setNegativeButton("Iptal", null)
     .create()
     d.setOnKeyListener { dlg, code, ev ->
     if (ev.action == KeyEvent.ACTION_DOWN && code != KeyEvent.KEYCODE_BACK &&
     (ev.source and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD
     ) {
     Extra.setMap(ctx, code, t.second)
     toast(ctx, KeyEvent.keyCodeToString(code).removePrefix("KEYCODE_") + " -> " + t.first)
     dlg.dismiss()
     true
     } else {
     false
     }
     }
     d.show()
     }
     }

