     p.shader = RadialGradient(w / 2f, h * 0.42f, h * 0.65f, Color.argb((120 * pulse).toInt(), Color.red(accent), Color.green(accent), Color.blue(accent)), Color.TRANSPARENT, Shader.TileMode.CLAMP)
