     <div class="b" id="l2" data-bit="9">L2</div><div class="b" id="l1" data-bit="8">L1</div>
     <div class="b" id="r2" data-bit="11">R2</div><div class="b" id="r1" data-bit="10">R1</div>
     <div class="b" id="up" data-bit="0">&#9650;</div><div class="b" id="dn" data-bit="1">&#9660;</div>
     <div class="b" id="lf" data-bit="2">&#9664;</div><div class="b" id="rt" data-bit="3">&#9654;</div>
     <div class="b r" id="fy" data-bit="7" style="color:#4ADE80">&#9651;</div>
     <div class="b r" id="fb" data-bit="5" style="color:#FF5C6C">&#9675;</div>
     <div class="b r" id="fa" data-bit="4" style="color:#5AA9FF">&#10005;</div>
     <div class="b r" id="fx" data-bit="6" style="color:#E879F9">&#9633;</div>
     <div class="b" id="sel" data-bit="13">SELECT</div><div class="b" id="sta" data-bit="12">START</div>
     <div id="stick" class="b" style="border-radius:50%"><div id="knob"></div></div>
     <script>
     (function(){
     var ws,mask=0,lx=0,ly=0,sent='',stickId=null,i;
     var st=document.getElementById('st'),stickEl=document.getElementById('stick'),knob=document.getElementById('knob');
     var els=document.querySelectorAll('[data-bit]');
     document.getElementById('shell').addEventListener('touchstart',function(e){e.preventDefault();},false);
     function say(t){st.innerHTML=t;}
     function connect(){
     ws=new WebSocket('ws://'+location.host+'/ws');
     ws.onopen=function(){ws.send('hello:Telefon');};
     ws.onmessage=function(e){
     var m=e.data;
     if(m.indexOf('id:')===0){say('Oyuncu '+(parseInt(m.substr(3),10)+1)+' hazir');}
     else if(m==='full'){say('Oda dolu (en fazla 4 kisi)');}
     };
     ws.onclose=function(){say('Baglanti koptu, yeniden deniyor...');setTimeout(connect,1500);};
     }
     function send(){
     var s='s:'+mask+':'+lx.toFixed(2)+':'+ly.toFixed(2);
     if(s!==sent&&ws&&ws.readyState===1){ws.send(s);sent=s;}
     }
     function bitOf(el){
     while(el&&el.getAttribute){var b=el.getAttribute('data-bit');if(b!==null)return parseInt(b,10);el=el.parentNode;}
     return -1;
     }
     function upd(e){
     e.preventDefault();
     var m=0,ts=e.touches,found=false,r=stickEl.getBoundingClientRect(),R=r.width/2,cx=r.left+R,cy=r.top+R,t,b,dx,dy,len;
     for(i=0;i<ts.length;i++){
     t=ts[i];
     if(stickId===null&&Math.sqrt(Math.pow(t.clientX-cx,2)+Math.pow(t.clientY-cy,2))<R*1.25){stickId=t.identifier;}
     if(t.identifier===stickId){
     dx=(t.clientX-cx)/R;dy=(t.clientY-cy)/R;len=Math.sqrt(dx*dx+dy*dy);
     if(len>1){dx/=len;dy/=len;}
     lx=dx;ly=dy;found=true;
     knob.style.webkitTransform=knob.style.transform='translate('+(dx*R*0.45)+'px,'+(dy*R*0.45)+'px)';
     continue;
     }
     b=bitOf(document.elementFromPoint(t.clientX,t.clientY));
     if(b>=0)m|=(1<<b);
     }
     if(!found){stickId=null;lx=0;ly=0;knob.style.webkitTransform=knob.style.transform='translate(0,0)';}
     if(m!==mask&&navigator.vibrate&&(m&~mask))navigator.vibrate(8);
     mask=m;
     for(i=0;i<els.length;i++){
     if(mask&(1<<parseInt(els[i].getAttribute('data-bit'),10)))els[i].classList.add('on');else els[i].classList.remove('on');
     }
     send();
     }
     document.addEventListener('touchstart',upd,false);
     document.addEventListener('touchmove',upd,false);
     document.addEventListener('touchend',upd,false);
     document.addEventListener('touchcancel',upd,false);
     document.getElementById('fs').onclick=function(){var d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);};
     connect();
     })();
     </script></body></html>
