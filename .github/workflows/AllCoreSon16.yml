     package com.allcore.emulator.util
     import android.content.Context
     import android.net.Uri
     import androidx.documentfile.provider.DocumentFile
     import java.io.File
     class Imported(val file: File, val platform: Platform, val name: String, val coverPath: String?)
     class ScanItem(val main: DocumentFile, val extras: List<DocumentFile>)
     object GameImport {
     private fun cryptic(n: String): Boolean = n.length < 6 || Regex("^[A-Za-z]{3,5}[-_]?[0-9]{3,6}([._-].*)?$").matches(n) || Regex("^(game|disc|disk|rom|data|main|track).*", RegexOption.IGNORE_CASE).matches(n)
     fun discInfo(f: File): DiscInfo? {
     val e = f.extension.lowercase()
     return if (e == "pbp") DiscAnalyzer.pbpInfo(f) else if (e == "iso") DiscAnalyzer.analyzeFile(f) else null
     }
     fun nameFor(f: File, title: String?): String {
     if (!title.isNullOrBlank()) return title
     val zt = FileHelper.embeddedTitle.remove(f.absolutePath)
     if (zt != null && cryptic(f.nameWithoutExtension)) {
     val c = FileHelper.cleanName(zt)
     if (c.isNotEmpty()) return c
     }
     return FileHelper.displayName(f.name)
     }
     fun takeCover(ctx: Context, f: File): String? {
     val b = FileHelper.embeddedCover.remove(f.absolutePath) ?: return null
     return try {
     val dir = File(ctx.filesDir, "covers")
     dir.mkdirs()
     val cf = File(dir, "z" + System.nanoTime() + ".png")
     cf.writeBytes(b)
     cf.absolutePath
     } catch (e: Exception) {
     null
     }
     }
     fun identify(ctx: Context, f: File, hint: Platform): Imported? {
     var plat = hint
     if (plat == Platform.UNKNOWN) plat = PlatformDetector.detect(f.name)
     if (plat == Platform.UNKNOWN) return null
