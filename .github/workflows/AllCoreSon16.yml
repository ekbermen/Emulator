     private fun isPspPack(names: List<String>): Boolean {
     for (n in names) {
     val seg = n.split('/')
     val i = seg.indexOfFirst { it.equals("PSP", true) }
     if (i < 0 || i + 2 >= seg.size) continue
     if (PSP_DATA.containsKey(seg[i + 1].lowercase())) return true
