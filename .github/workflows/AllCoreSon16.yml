     package com.allcore.emulator.util
     import android.content.Context
     import java.io.File
     import java.io.InputStream
     import java.io.OutputStream
     import java.util.zip.ZipEntry
     import java.util.zip.ZipInputStream
     import java.util.zip.ZipOutputStream
     object Backup {
     private fun add(z: ZipOutputStream, f: File, name: String): Int {
     if (!f.exists()) return 0
     if (f.isDirectory) {
     var n = 0
     f.listFiles()?.forEach { n += add(z, it, name + "/" + it.name) }
     return n
     }
     z.putNextEntry(ZipEntry(name))
     f.inputStream().use { it.copyTo(z) }
     z.closeEntry()
     return 1
     }
     fun create(ctx: Context, out: OutputStream): String {
     var n = 0
     ZipOutputStream(out).use { z ->
     n += add(z, File(ctx.filesDir, "states"), "files/states")
     val ext = ctx.getExternalFilesDir(null)
     if (ext != null) n += add(z, File(ext, "saves"), "ext/saves")
     File(ctx.filesDir, "covers").listFiles()?.forEach {
     if (it.name.startsWith("box_custom_")) n += add(z, it, "files/covers/" + it.name)
     }
     val data = File(ctx.applicationInfo.dataDir)
     File(data, "shared_prefs").listFiles()?.forEach {
     if (it.name != "allcore_dbg.xml") n += add(z, it, "prefs/" + it.name)
     }
     File(data, "databases").listFiles()?.forEach {
     if (it.name.startsWith("allcore.db")) n += add(z, it, "db/" + it.name)
     }
     }
     return "Yedek hazir (" + n + " dosya)"
     }
     fun restore(ctx: Context, ins: InputStream): String {
     val data = File(ctx.applicationInfo.dataDir)
     val ext = ctx.getExternalFilesDir(null)
     var n = 0
     var dbCleared = false
     ZipInputStream(ins).use { z ->
     var e: ZipEntry? = z.nextEntry
     while (e != null) {
     val name = e.name
     var base: File? = null
     var dest: File? = null
     if (name.startsWith("files/")) {
     base = ctx.filesDir
     dest = File(base, name.removePrefix("files/"))
     } else if (name.startsWith("ext/") && ext != null) {
     base = ext
     dest = File(base, name.removePrefix("ext/"))
     } else if (name.startsWith("prefs/")) {
     base = File(data, "shared_prefs")
     dest = File(base, name.removePrefix("prefs/"))
     } else if (name.startsWith("db/")) {
     base = File(data, "databases")
     dest = File(base, name.removePrefix("db/"))
     if (!dbCleared) {
     dbCleared = true
     base.listFiles()?.forEach { if (it.name.startsWith("allcore.db")) it.delete() }
     }
     }
     if (dest != null && base != null && !e.isDirectory && dest.canonicalPath.startsWith(base.canonicalPath + File.separator)) {
     dest.parentFile?.mkdirs()
     dest.outputStream().use { o -> z.copyTo(o) }
     n++
     }
     z.closeEntry()
     e = z.nextEntry
     }
     }
     return if (n > 0) "Yedek yuklendi (" + n + " dosya). Uygulama kapaniyor, tekrar ac" else "Bu dosyada yedek bulunamadi"
     }
     }
