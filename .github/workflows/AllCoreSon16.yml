     private fun saveSram(wait: Boolean) {
     val v = gl ?: return
     if (!sramReady) return
     if (!sramBusy.compareAndSet(false, true)) return
     val t = Thread {
     try {
     val bytes = v.serializeSRAM()
     if (bytes.isNotEmpty()) {
     val h = bytes.contentHashCode()
     if (h != sramHash) {
     val f = sramFile()
     if (!sramBacked && f.exists()) {
     try {
     f.copyTo(File(f.parentFile, f.name + ".bak"), true)
     } catch (e: Throwable) {
     }
     }
     sramBacked = true
     val tmp = File(f.parentFile, f.name + ".tmp")
     tmp.writeBytes(bytes)
     if (!tmp.renameTo(f)) {
     f.delete()
     tmp.renameTo(f)
     }
     sramHash = h
     }
     }
     } catch (e: Throwable) {
     } finally {
     sramBusy.set(false)
     }
     }
     t.start()
     if (wait) try {
     t.join(700)
     } catch (e: Exception) {
     }
     }
     private val sramRun = object : Runnable {
     override fun run() {
     saveSram(false)
     ui.postDelayed(this, 10_000L)
     }
     }
     private fun saveState(slot: String, toast: Boolean, wait: Boolean) {
     val v = gl ?: return
     if (!started) {
     if (toast) say("Oyun henuz hazir degil")
     return
     }
     if (!saving.compareAndSet(false, true)) return
     val t = Thread {
     try {
     val bytes = v.serializeState()
     if (bytes.isNotEmpty()) {
     val dir = File(filesDir, "states")
     dir.mkdirs()
     val tmp = File(dir, "${profile}_${gameId}_$slot.tmp")
     tmp.writeBytes(bytes)
     val f = stateFile(slot)
     if (!tmp.renameTo(f)) {
     f.delete()
     tmp.renameTo(f)
     }
     if (toast) ui.post { say("Kaydedildi") }
     }
     } catch (e: Throwable) {
     } finally {
     saving.set(false)
     }
     }
     t.start()
     if (wait) try {
     t.join(900)
     } catch (e: Exception) {
     }
     }
     private fun loadState(slot: String, quiet: Boolean) {
