     c = c.cause
     }
     return false
     }
     private fun resolveEncryptedZip(file: File, outDir: File?, label: String?): File {
     val parent = outDir ?: file.parentFile ?: return file
     val shown = label ?: file.name
     val key = shown + ":" + file.length()
     var pw: String? = pwCache[key]
     var wrong = false
     var tries = 0
     while (tries < 4) {
     val usePw: String = pw ?: (askPassword(shown, wrong) ?: run {
     lastIssue = "ZIP sifreli, sifre girilmedi"
     return file
     })
     val tmp = uniqueDir(parent, ".zp_" + file.nameWithoutExtension)
     tmp.mkdirs()
     try {
     val zf = net.lingala.zip4j.ZipFile(file, usePw.toCharArray())
     zf.isRunInThread = true
     val pm = zf.progressMonitor
     zf.extractAll(tmp.absolutePath)
     while (pm.state != net.lingala.zip4j.progress.ProgressMonitor.State.READY) {
     extractCb?.invoke(pm.percentDone / 100f)
     Thread.sleep(150L)
     }
     if (pm.result == net.lingala.zip4j.progress.ProgressMonitor.Result.ERROR) throw (pm.exception ?: IllegalStateException("zip hata"))
     pwCache[key] = usePw
     val r = finishExtracted(tmp, parent, file, outDir, label)
     if (r == file && lastIssue == null) lastIssue = "Sifre dogru ama ZIP icinde taninan oyun dosyasi yok"
     return r
     } catch (t: Throwable) {
     tmp.deleteRecursively()
     val z = generateSequence(t) { it.cause }.filterIsInstance<net.lingala.zip4j.exception.ZipException>().firstOrNull()
     val bad = z != null && (z.type == net.lingala.zip4j.exception.ZipException.Type.WRONG_PASSWORD || z.type == net.lingala.zip4j.exception.ZipException.Type.CHECKSUM_MISMATCH)
     if (bad) {
     wrong = true
     pw = null
     pwCache.remove(key)
     tries++
     continue
     }
     lastIssue = "Sifreli ZIP acilamadi: " + t.javaClass.simpleName + " " + (t.message ?: "")
     return file
     }
     }
     lastIssue = "Sifre 4 kez yanlis girildi"
     return file
     }
     private fun findZipStart(file: File): Long {
     try {
     java.io.RandomAccessFile(file, "r").use { r ->
     val buf = ByteArray(65536)
     var pos = 0L
     val limit = minOf(r.length(), 64L * 1024 * 1024)
     while (pos < limit) {
     r.seek(pos)
     val n = r.read(buf)
     if (n < 4) break
     for (i in 0 until n - 3) {
     if (buf[i] == 0x50.toByte() && buf[i + 1] == 0x4B.toByte() && buf[i + 2] == 0x03.toByte() && buf[i + 3] == 0x04.toByte()) return pos + i
     }
     pos += (n - 3).toLong()
     }
     }
     } catch (t: Throwable) {
     }
     return -1L
     }
     @Volatile var lastDetail: String = ""
     private fun errStr(x: Throwable): String = x.javaClass.simpleName + " " + (x.message ?: "")
     private fun recoverZip(file: File, outDir: File?, label: String?, first: Throwable?): File? {
     val errs = ArrayList<String>()
     if (first != null) errs.add("java: " + errStr(first))
     val parent = outDir ?: file.parentFile ?: return null
     var res: File? = null
     try {
     val tmp = uniqueDir(parent, ".cc_" + file.nameWithoutExtension)
     tmp.mkdirs()
     var cnt = 0
     try {
     val zf = org.apache.commons.compress.archivers.zip.ZipFile(file)
     try {
     val root = tmp.canonicalPath
     val en = zf.entries
     while (en.hasMoreElements()) {
     val e = en.nextElement()
     if (e.isDirectory) continue
     val n = e.name.replace('\\', '/')
     if (junk(n)) continue
     val out = File(tmp, n)
     if (!out.canonicalPath.startsWith(root + File.separator)) continue
     if (!zf.canReadEntryData(e)) {
     if (errs.size < 6) errs.add("cc: okunamayan yontem=" + e.method + " sifreli=" + e.generalPurposeBit.usesEncryption() + " (" + File(n).name + ")")
     continue
     }
     out.parentFile?.mkdirs()
     try {
     zf.getInputStream(e).use { ins -> FileOutputStream(out).use { o -> pump(ins, o, e.size) } }
     cnt++
     } catch (x: Throwable) {
     out.delete()
     if (errs.size < 6) errs.add("cc: " + File(n).name + ": " + errStr(x))
     }
     }
     } finally {
     zf.close()
     }
     } catch (x: Throwable) {
     errs.add("cc: " + errStr(x))
     }
     if (cnt > 0) {
     val r = finishExtracted(tmp, parent, file, outDir ?: parent, label)
     if (r != file) res = r
     } else {
     tmp.deleteRecursively()
     }
     } catch (x: Throwable) {
     errs.add("cc2: " + errStr(x))
     }
     if (res != null) {
     lastNote = "ZIP alternatif yontemle acildi" + (lastNote?.let { " | " + it } ?: "")
     return res
     }
     try {
     val tmp = uniqueDir(parent, ".z4_" + file.nameWithoutExtension)
     tmp.mkdirs()
     try {
     net.lingala.zip4j.ZipFile(file).extractAll(tmp.absolutePath)
     val r = finishExtracted(tmp, parent, file, outDir ?: parent, label)
     if (r != file) {
     lastNote = "ZIP alternatif yontemle acildi" + (lastNote?.let { " | " + it } ?: "")
     return r
     }
     errs.add("zip4j: icinde oyun dosyasi bulunamadi")
     } catch (x: Throwable) {
     tmp.deleteRecursively()
     errs.add("zip4j: " + errStr(x))
     }
     } catch (x: Throwable) {
     errs.add("z4: " + errStr(x))
     }
     val fx = autoFixZip(file, outDir)
     if (fx != null) return fx
     errs.add("sirali okuma: hicbir dosya kurtarilamadi")
     lastDetail = errs.joinToString(" | ")
     return null
     }
     private fun autoFixZip(file: File, outDir: File?): File? {
     val parent = outDir ?: file.parentFile ?: return null
     val start = findZipStart(file)
     if (start < 0L) return null
     val tmp = uniqueDir(parent, ".fix_" + file.nameWithoutExtension)
     tmp.mkdirs()
     var got = 0
     var cut = false
     try {
     java.io.FileInputStream(file).use { fis ->
     fis.channel.position(start)
     val z = java.util.zip.ZipInputStream(java.io.BufferedInputStream(fis, 262144), Charsets.ISO_8859_1)
     val root = tmp.canonicalPath
     val buf = ByteArray(262144)
     var e: java.util.zip.ZipEntry? = try { z.nextEntry } catch (x: Throwable) { null }
     while (e != null) {
     val n = e.name.replace('\\', '/')
     if (!e.isDirectory && !junk(n)) {
     val out = File(tmp, n)
     if (out.canonicalPath.startsWith(root + File.separator)) {
     out.parentFile?.mkdirs()
     var ok = true
     try {
     FileOutputStream(out).use { o ->
     while (true) {
     val r = z.read(buf)
     if (r < 0) break
     o.write(buf, 0, r)
     }
     }
     } catch (x: Throwable) {
     ok = false
     }
     if (ok) {
     got++
     } else {
     cut = true
     if (out.length() == 0L || pickPrimary(listOf(n)) == null) out.delete()
     }
     }
     }
     e = try { z.nextEntry } catch (x: Throwable) { null }
     }
     }
     } catch (t: Throwable) {
     }
     if (!tmp.walkTopDown().any { it.isFile }) {
     tmp.deleteRecursively()
     return null
     }
     val r = finishExtracted(tmp, parent, file, outDir ?: parent)
     if (r == file) return null
     val pn = lastNote
     lastNote = "ZIP bozuktu, otomatik onarildi (" + got + " dosya kurtarildi" + (if (cut) ", son dosya eksik indirilmis olabilir" else "") + ")" + (if (pn != null) " | " + pn else "")
     return r
     }
     val embeddedCover = ConcurrentHashMap<String, ByteArray>()
     val embeddedTitle = ConcurrentHashMap<String, String>()
     private fun openZip(file: File): java.util.zip.ZipFile {
     try {
     return java.util.zip.ZipFile(file)
     } catch (e: IllegalArgumentException) {
     return java.util.zip.ZipFile(file, Charsets.ISO_8859_1)
     }
     }
     private fun pickCover(zf: java.util.zip.ZipFile, byName: Map<String, java.util.zip.ZipEntry>): ByteArray? {
     var best: String? = null
     var bs = 0
     var count = 0
     for ((n, e) in byName) {
     val x = n.substringAfterLast('.', "").lowercase()
     if (x != "png" && x != "jpg" && x != "jpeg" && x != "webp") continue
     if (n.startsWith("__MACOSX") || e.size < 2048L || e.size > 3000000L) continue
     count++
     val b = n.substringAfterLast('/').lowercase()
     var s = 1
     if (b.contains("cover") || b.contains("boxart") || b.contains("box") || b.contains("poster")) s = 4
     else if (b.contains("logo") || b.contains("icon") || b.contains("folder") || b.contains("thumb") || b.startsWith("front")) s = 3
     else if (b.startsWith("pic")) s = 2
     if (s > bs) {
     bs = s
     best = n
     }
     }
     val k = best ?: return null
     if (bs < 2 && count != 1) return null
     return try {
     zf.getInputStream(byName.getValue(k)).use { it.readBytes() }
     } catch (t: Throwable) {
     null
     }
     }
     private fun remember(out: File, zipName: String, cover: ByteArray?) {
     if (cover != null) embeddedCover[out.absolutePath] = cover
     embeddedTitle[out.absolutePath] = zipName
     }
     @Volatile var extractCb: ((Float) -> Unit)? = null
     private fun junk(n: String): Boolean {
     val l = n.lowercase()
     return l.startsWith("__macosx") || l.contains("/__macosx/") || l.startsWith(".svn/") || l.contains("/.svn/") || l.contains("/.git/") || l.endsWith(".ds_store") || l.endsWith("thumbs.db") || l.endsWith("desktop.ini")
     }
     private fun pump(ins: java.io.InputStream, o: java.io.OutputStream, total: Long) {
     val buf = ByteArray(262144)
     var d = 0L
     var last = -1
     while (true) {
     val n = ins.read(buf)
     if (n < 0) break
     o.write(buf, 0, n)
     d += n
     if (total > 0L) {
     val p = (d * 100L / total).toInt()
     if (p != last) {
     last = p
     extractCb?.invoke(p / 100f)
     }
     }
     }
     }
     private fun extractAll(file: File, byName: Map<String, java.util.zip.ZipEntry>, dir: File) {
     val root = dir.canonicalPath
     val q = java.util.concurrent.ConcurrentLinkedQueue<Triple<String, String, Long>>()
     var total = 0L
     for ((n, e) in byName) {
     val out = File(dir, n)
     if (!out.canonicalPath.startsWith(root + File.separator)) continue
     out.parentFile?.mkdirs()
     val sz = maxOf(e.size, 1L)
     q.add(Triple(n, e.name, sz))
     total += sz
     }
     val all = total
     val done = java.util.concurrent.atomic.AtomicLong(0L)
     val last = java.util.concurrent.atomic.AtomicInteger(-1)
     val err = java.util.concurrent.atomic.AtomicReference<Throwable?>(null)
     val workers = minOf(4, maxOf(1, Runtime.getRuntime().availableProcessors() / 2))
     val ts = ArrayList<Thread>()
     for (w in 0 until workers) {
     val t = Thread {
     var z: java.util.zip.ZipFile? = null
     try {
     z = openZip(file)
     val buf = ByteArray(262144)
     while (err.get() == null) {
     val j = q.poll() ?: break
     val e = z.getEntry(j.second) ?: continue
     z.getInputStream(e).use { ins ->
     FileOutputStream(File(dir, j.first)).use { o ->
     while (true) {
     val n = ins.read(buf)
     if (n < 0) break
     o.write(buf, 0, n)
     val p = (done.addAndGet(n.toLong()) * 100L / all).toInt().coerceIn(0, 100)
     if (p > last.get()) {
     last.set(p)
     extractCb?.invoke(p / 100f)
     }
     }
     }
     }
     }
     } catch (ex2: Throwable) {
     err.compareAndSet(null, ex2)
     } finally {
     try {
     z?.close()
     } catch (x: Throwable) {
     }
     }
     }
     ts.add(t)
     t.start()
     }
     for (t in ts) t.join()
     val ex = err.get()
     if (ex != null) throw ex
     }
     private fun zipViaFd(ctx: Context, uri: Uri, name: String, games: File): File? {
     if (!name.endsWith(".zip", true)) return null
     if (PlatformDetector.detect(name) in keepZipPlatforms) return null
     return try {
     ctx.contentResolver.openFileDescriptor(uri, "r")?.use { pfd ->
     val f = File("/proc/self/fd/" + pfd.fd)
     if (!f.canRead() || f.length() <= 0L) return@use null
     lastIssue = null
     val r = resolveZip(f, games, name.substringBeforeLast('.'))
     if (r == f) null else r
     }
     } catch (t: Throwable) {
     null
     }
     }
     private fun fixCue(f: File, dir: File) {
