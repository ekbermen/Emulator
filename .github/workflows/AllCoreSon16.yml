     package com.allcore.emulator.util
     import android.content.Context
     import org.json.JSONArray
     import org.json.JSONObject
     object Extra {
     private fun sp(c: Context) = c.applicationContext.getSharedPreferences("allcore_extra", Context.MODE_PRIVATE)
     fun addPlay(c: Context, id: Long, ms: Long) {
     if (id <= 0L || ms < 3000L) return
     sp(c).edit()
     .putLong("pt_$id", playMs(c, id) + ms)
     .putLong("lp_$id", System.currentTimeMillis())
     .putInt("pc_$id", launches(c, id) + 1)
     .apply()
     }
     fun playMs(c: Context, id: Long): Long = sp(c).getLong("pt_$id", 0L)
     fun lastPlayed(c: Context, id: Long): Long = sp(c).getLong("lp_$id", 0L)
     fun launches(c: Context, id: Long): Int = sp(c).getInt("pc_$id", 0)
     fun fmt(ms: Long): String {
     val m = ms / 60000L
     return if (m >= 60L) "${m / 60L} sa ${m % 60L} dk" else "$m dk"
     }
     fun cols(c: Context): LinkedHashMap<String, MutableSet<Long>> {
     val out = LinkedHashMap<String, MutableSet<Long>>()
     try {
     val o = JSONObject(sp(c).getString("cols", "{}") ?: "{}")
     val ks = o.keys()
     while (ks.hasNext()) {
     val k = ks.next()
     val a = o.getJSONArray(k)
     val s = LinkedHashSet<Long>()
     for (i in 0 until a.length()) s.add(a.getLong(i))
     out[k] = s
     }
     } catch (e: Exception) {
     }
     return out
     }
     private fun saveCols(c: Context, m: Map<String, Set<Long>>) {
     val o = JSONObject()
     for ((k, v) in m) {
     val a = JSONArray()
     for (x in v) a.put(x)
     o.put(k, a)
     }
     sp(c).edit().putString("cols", o.toString()).apply()
     }
     fun toggle(c: Context, name: String, id: Long) {
     val m = cols(c)
     val s = m.getOrPut(name) { LinkedHashSet() }
     if (!s.add(id)) s.remove(id)
     saveCols(c, m)
     }
     fun mapKey(c: Context, code: Int): Int = sp(c).getInt("km_$code", code)
     fun setMap(c: Context, phys: Int, target: Int) = sp(c).edit().putInt("km_$phys", target).apply()
     fun clearMap(c: Context) {
     val e = sp(c).edit()
     for (k in sp(c).all.keys) if (k.startsWith("km_")) e.remove(k)
     e.apply()
     }
     fun tracks(c: Context): MutableList<Pair<String, String>> {
     val out = ArrayList<Pair<String, String>>()
     try {
     val a = JSONArray(sp(c).getString("tracks", "[]") ?: "[]")
     for (i in 0 until a.length()) {
     val o = a.getJSONObject(i)
     out.add(Pair(o.getString("u"), o.getString("n")))
     }
     } catch (e: Exception) {
     }
     return out
     }
     fun setTracks(c: Context, l: List<Pair<String, String>>) {
     val a = JSONArray()
     for (p in l) a.put(JSONObject().put("u", p.first).put("n", p.second))
     sp(c).edit().putString("tracks", a.toString()).apply()
     }
     fun shuffle(c: Context): Boolean = sp(c).getBoolean("shuffle", false)
     fun musicVol(c: Context): Float = sp(c).getFloat("mvol", 0.6f)
     fun fpsShow(c: Context): Boolean = sp(c).getBoolean("fps_show", false)
     fun setFpsShow(c: Context, v: Boolean) = sp(c).edit().putBoolean("fps_show", v).apply()
     }
