     @Composable
     fun GameSettingsDialog(
     game: Game,
     onClose: () -> Unit,
     onRename: () -> Unit,
     onCover: () -> Unit,
     onShare: () -> Unit,
     onDelete: () -> Unit,
     onFav: () -> Unit,
     onPlatform: (String) -> Unit
     ) {
     val ctx = LocalContext.current
     val gs = com.allcore.emulator.emulator.GameSettings
     val id = game.id
     var tick by remember { mutableStateOf(0) }
     var choice by remember { mutableStateOf(0) }
     var noteDlg by remember { mutableStateOf(false) }
     var note by remember { mutableStateOf(gs.note(ctx, id)) }
     val plats = remember { com.allcore.emulator.util.Platform.values().filter { com.allcore.emulator.emulator.Cores.supported(it) }.sortedBy { it.title } }
     var sizeTxt by remember { mutableStateOf("") }
     val ffs = listOf("Genel ayar", "Kapali", "Sadece x2", "Hep acik")
     val tk = tick
     if (tk < -1) return
     androidx.compose.ui.window.Dialog(onDismissRequest = onClose) {
     Column(
     Modifier
     .fillMaxWidth()
     .heightIn(max = 460.dp)
     .glass(androidx.compose.foundation.shape.RoundedCornerShape(22.dp))
     .verticalScroll(rememberScrollState())
     .padding(18.dp)
     ) {
     Text(game.name, color = AC.Cyan, fontSize = 16.sp, fontWeight = FontWeight.Bold, maxLines = 1)
     Spacer(Modifier.height(4.dp))
     SRow(if (game.favorite) "Favoriden cikar" else "Favoriye ekle", "") {
     onFav()
     onClose()
     }
     SRow("Isim degistir", "") { onRename() }
     SRow("Kapak degistir", "") { onCover() }
     SRow("Kodla gonder", "karsi cihaza") { onShare() }
     SRow("Ekran boyutu", if (gs.sizePct(ctx, id) <= 0) "Otomatik" else "%" + gs.sizePct(ctx, id)) {
     sizeTxt = if (gs.sizePct(ctx, id) > 0) gs.sizePct(ctx, id).toString() else ""
     choice = 1
     }
     SRow("Grafik filtresi", gs.FILTERS[gs.filter(ctx, id)]) { choice = 2 }
     SRow("Oto performans modu", if (gs.perf(ctx, id) == 0) "Acik" else "Kapali") {
     gs.setPerf(ctx, id, if (gs.perf(ctx, id) == 0) 2 else 0)
     tick++
     }
     SRow("Performans seviyesi", gs.PERF[gs.perf(ctx, id)]) { choice = 3 }
     SRow("Buton ozellestirme", "oyunda duzenle") {
     onClose()
     GameLauncher.play(ctx, game, true)
     }
     SRow("Tus duzeni", gs.LAYOUTS[gs.layout(ctx, id)]) { choice = 4 }
     SRow("A/B tuslarini degistir", arrayOf("Genel ayar", "Kapali", "Acik")[gs.swap(ctx, id) + 1]) { choice = 5 }
     SRow("Hizlandirma sesi", ffs[gs.ffAudioRaw(ctx, id) + 1]) { choice = 6 }
     SRow("Ceviri bolgesi", com.allcore.emulator.emulator.LiveTranslate.regionNames[gs.trRegion(ctx, id)]) { choice = 7 }
     SRow("Egim direksiyonuyla ac", if (gs.tiltStart(ctx, id)) "Acik" else "Kapali") { choice = 8 }
     SRow("Bu oyunda ses", if (gs.mute(ctx, id)) "Kapali" else "Acik") { choice = 9 }
     SRow("Sistemi degistir", game.platform) { choice = 10 }
     SRow("Oyun notu", if (note.isEmpty()) "" else note.take(16)) { noteDlg = true }
     SRow("Bu oyunun ayarlarini sifirla", "") {
     gs.reset(ctx, id)
     tick++
     com.allcore.emulator.util.toast(ctx, "Oyun ayarlari sifirlandi")
     }
     SRow("Kutuphaneden sil", "") { onDelete() }
     }
     }
     when (choice) {
     1 -> {
     val pl = plats.firstOrNull { it.display == game.platform } ?: com.allcore.emulator.util.Platform.UNKNOWN
     val mx = gs.screenMaxPct(ctx, pl)
     AlertDialog(
     onDismissRequest = { choice = 0 },
     containerColor = AC.Bg1,
     title = { Text("Ekran boyutu", color = AC.Text, fontWeight = FontWeight.Bold) },
     text = {
     Column {
     Text("Orijinal konsol boyutuna gore yuzde yaz (ornek 200). Ekrana sigan en fazla %" + mx + ". Bos birakirsan otomatik (ekrana sigdir).", color = AC.Text, fontSize = 13.sp)
     Spacer(Modifier.height(8.dp))
     androidx.compose.material3.OutlinedTextField(
     value = sizeTxt,
     onValueChange = { sizeTxt = it.filter { ch -> ch.isDigit() }.take(4) },
     singleLine = true,
     keyboardOptions = androidx.compose.foundation.text.KeyboardOptions(keyboardType = androidx.compose.ui.text.input.KeyboardType.Number)
     )
     }
     },
     confirmButton = {
     TextButton(onClick = {
     gs.setSizePct(ctx, id, sizeTxt.toIntOrNull() ?: 0)
     choice = 0
     tick++
     }) { Text("Kaydet", color = AC.Cyan, fontWeight = FontWeight.Bold) }
     },
     dismissButton = { TextButton(onClick = { choice = 0 }) { Text("Vazgec", color = AC.Text) } }
     )
     }
     2 -> ChoiceDialog("Grafik filtresi", gs.FILTERS.toList(), gs.filter(ctx, id), { gs.setFilter(ctx, id, it); tick++ }, { choice = 0 })
     3 -> ChoiceDialog("Performans seviyesi", gs.PERF.toList(), gs.perf(ctx, id), { gs.setPerf(ctx, id, it); tick++ }, { choice = 0 })
     4 -> ChoiceDialog("Tus duzeni", gs.LAYOUTS.toList(), gs.layout(ctx, id), { gs.setLayout(ctx, id, it); tick++ }, { choice = 0 })
     5 -> ChoiceDialog("A/B tuslarini degistir", listOf("Genel ayar", "Kapali", "Acik"), gs.swap(ctx, id) + 1, { gs.setSwap(ctx, id, it - 1); tick++ }, { choice = 0 })
     6 -> ChoiceDialog("Hizlandirma sesi", ffs, gs.ffAudioRaw(ctx, id) + 1, { gs.setFfAudio(ctx, id, it - 1); tick++ }, { choice = 0 })
     7 -> ChoiceDialog("Ceviri bolgesi", com.allcore.emulator.emulator.LiveTranslate.regionNames.toList(), gs.trRegion(ctx, id), { gs.setTrRegion(ctx, id, it); tick++ }, { choice = 0 })
     8 -> ChoiceDialog("Egim direksiyonuyla ac", listOf("Kapali", "Acik"), if (gs.tiltStart(ctx, id)) 1 else 0, { gs.setTiltStart(ctx, id, it == 1); tick++ }, { choice = 0 })
     9 -> ChoiceDialog("Bu oyunda ses", listOf("Acik", "Kapali"), if (gs.mute(ctx, id)) 1 else 0, { gs.setMute(ctx, id, it == 1); tick++ }, { choice = 0 })
     10 -> ChoiceDialog("Sistemi degistir", plats.map { it.title }, plats.indexOfFirst { it.display == game.platform }, { onPlatform(plats[it].display); onClose() }, { choice = 0 })
     }
     if (noteDlg) {
     AlertDialog(
     onDismissRequest = { noteDlg = false },
     containerColor = AC.Bg1,
     title = { Text("Oyun notu", color = AC.Text, fontWeight = FontWeight.Bold) },
     text = { androidx.compose.material3.OutlinedTextField(value = note, onValueChange = { note = it.take(300) }) },
     confirmButton = {
     TextButton(onClick = {
     gs.setNote(ctx, id, note)
     noteDlg = false
     tick++
     }) { Text("Kaydet", color = AC.Cyan, fontWeight = FontWeight.Bold) }
     },
     dismissButton = { TextButton(onClick = { noteDlg = false }) { Text("Vazgec", color = AC.Text) } }
     )
     }
     }
     @Composable
     fun GameInfoCard(game: Game) {
     val ctx = LocalContext.current
     val lang = when (com.allcore.emulator.util.L.lang) {
     1 -> "en"
     2 -> "de"
     else -> "tr"
     }
     var info by remember(game.id, game.name) { mutableStateOf<com.allcore.emulator.util.GameInfoData?>(com.allcore.emulator.util.GameMeta.cached(ctx, game.name, game.platform)) }
     var state by remember(game.id, game.name) { mutableStateOf(0) }
     var tryTick by remember(game.id, game.name) { mutableStateOf(0) }
     LaunchedEffect(game.id, game.name, tryTick) {
     if (info == null) {
     state = 1
     val r = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
     try {
     com.allcore.emulator.util.GameMeta.fetch(ctx, game.name, game.platform, lang)
     } catch (e: Exception) {
     null
     }
     }
     if (r != null) info = r
     state = if (r != null) 0 else 2
     }
     }
     Column(Modifier.fillMaxWidth()) {
     val i = info
     if (i != null) {
     InfoRow("Cikis yili", if (i.year.isEmpty()) "-" else i.year)
     InfoRow("Tur", if (i.genre.isEmpty()) "-" else i.genre)
     InfoRow("Gelistirici", if (i.developer.isEmpty()) "-" else i.developer)
     if (i.desc.isNotEmpty()) {
     Spacer(Modifier.height(6.dp))
     Text(i.desc, color = AC.Muted, fontSize = 12.sp, lineHeight = 17.sp)
     }
     } else if (state == 1) {
     Text("Oyun bilgisi araniyor...", color = AC.Muted, fontSize = 12.sp)
     } else if (state == 2) {
     Text("Oyun bilgisi bulunamadi (internet gerekir)", color = AC.Muted, fontSize = 12.sp)
     Spacer(Modifier.height(6.dp))
     AcButton("Tekrar dene", null, BtnKind.Glass, compact = true) { tryTick++ }
     }
     }
     }
