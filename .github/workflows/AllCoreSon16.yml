     private fun push() {
     var m = 0
     for (i in keys.indices) if (pressed.contains(keys[i])) m = m or (1 shl i)
     if (client.connected) client.sendState(m, lx, ly)
     val combo = pressed.contains(KeyEvent.KEYCODE_BUTTON_L1) && pressed.contains(KeyEvent.KEYCODE_BUTTON_R2) && pressed.contains(KeyEvent.KEYCODE_BUTTON_B)
     if (combo && !comboOn) {
     comboOn = true
     ui.postDelayed(comboRun, 1200L)
     } else if (!combo && comboOn) {
     comboOn = false
     ui.removeCallbacks(comboRun)
     }
     }
     private fun parseTarget(raw: String): Pair<String, Int>? {
     var u = raw.trim()
     if (u.isEmpty()) return null
     if (u.startsWith("http://", true) || u.startsWith("https://", true)) {
     u = u.substringAfter("://").substringBefore('/')
     }
     val up = u.uppercase()
     if (up.startsWith("MON") && up.length == 10) {
     val n = up.substring(3).toLongOrNull(36) ?: return null
     val ip = "" + ((n shr 24) and 255L) + "." + ((n shr 16) and 255L) + "." + ((n shr 8) and 255L) + "." + (n and 255L)
     return Pair(ip, TvHub.PORT)
     }
     val m = Regex("(\\d{1,3}(?:\\.\\d{1,3}){3})(?::(\\d+))?").matchEntire(u) ?: return null
     val port = m.groupValues[2].toIntOrNull() ?: TvHub.PORT
     return Pair(m.groupValues[1], port)
     }
     private fun connectTo(raw: String) {
     val t = parseTarget(raw)
     if (t == null) {
     setStatus("Gecersiz kod. Kodu ya da IP adresini kontrol et")
     return
     }
     setStatus("Baglaniyor: " + t.first + " ...")
     val nm = (Build.MODEL ?: "Telefon").replace(":", "").take(14)
     Thread {
     val err = client.connect(t.first, t.second, nm)
     ui.post {
     if (err.isEmpty()) onConnected(raw) else setStatus(err)
     }
     }.start()
     }
     private fun onConnected(raw: String) {
     retries = 0
     lastTarget = raw
     getSharedPreferences("allcore_pad", MODE_PRIVATE).edit().putString("gp_last", raw).apply()
     panel.visibility = View.GONE
     pad.visibility = View.VISIBLE
     menuBtn.visibility = View.VISIBLE
     badge.text = "Oyuncu " + (client.slot + 1)
     badge.visibility = View.VISIBLE
     ui.removeCallbacks(beat)
     ui.postDelayed(beat, 4000L)
     hideBars()
     }
     private fun onLost() {
     if (isFinishing) return
     pressed.clear()
     lx = 0f
     ly = 0f
     pad.visibility = View.GONE
     menuBtn.visibility = View.GONE
     panel.visibility = View.VISIBLE
     if (retries < 3 && lastTarget.isNotEmpty()) {
     retries++
     setStatus("Baglanti koptu, yeniden deneniyor (" + retries + ")...")
     val tg = lastTarget
     ui.postDelayed({ connectTo(tg) }, 1500L)
     } else {
     setStatus("Baglanti koptu")
     }
     }
     private fun disconnect() {
     lastTarget = ""
     pressed.clear()
     lx = 0f
     ly = 0f
     val c = client
     Thread { c.close() }.start()
     pad.visibility = View.GONE
     menuBtn.visibility = View.GONE
     panel.visibility = View.VISIBLE
     setStatus("Baglanti kesildi")
     }
     private fun scanQr() {
     try {
     val opt = GmsBarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_QR_CODE).build()
     GmsBarcodeScanning.getClient(this, opt).startScan()
     .addOnSuccessListener { b ->
     val raw = b.rawValue ?: ""
     input.setText(raw)
     connectTo(raw)
     }
     .addOnFailureListener { setStatus("QR tarayici acilamadi, kodu elle gir") }
     } catch (e: Throwable) {
     setStatus("QR tarayici kullanilamiyor, kodu elle gir")
     }
     }
     private fun lanBase(): String? {
     try {
     for (ni in Collections.list(NetworkInterface.getNetworkInterfaces())) {
     if (!ni.isUp || ni.isLoopback) continue
     for (a in Collections.list(ni.inetAddresses)) {
     if (a is Inet4Address && a.isSiteLocalAddress) {
     val h = a.hostAddress ?: continue
     return h.substringBeforeLast('.') + "."
     }
     }
     }
     } catch (e: Exception) {
     }
     return null
     }
     private fun infoOf(ip: String): String {
     try {
     val c = URL("http://" + ip + ":" + TvHub.PORT + "/info").openConnection() as HttpURLConnection
     c.connectTimeout = 800
     c.readTimeout = 800
     val t = c.inputStream.use { String(it.readBytes(), Charsets.UTF_8) }
     c.disconnect()
     val g = JSONObject(t).optString("game")
     return if (g.isEmpty()) "AllCore" else g
     } catch (e: Exception) {
     return "AllCore"
     }
     }
     private fun scanLan() {
     setStatus("Agda araniyor...")
     found.removeAllViews()
     Thread {
     val base = lanBase()
     if (base == null) {
     ui.post { setStatus("Wi-Fi veya hotspot baglantisi bulunamadi") }
     return@Thread
     }
     val hits = Collections.synchronizedList(ArrayList<String>())
     val ex = Executors.newFixedThreadPool(48)
     for (i in 1..254) {
     val ip = base + i
     ex.execute {
     try {
     val sk = Socket()
     sk.connect(InetSocketAddress(ip, TvHub.PORT), 400)
     sk.close()
     hits.add(ip)
     } catch (e: Exception) {
     }
     }
     }
     ex.shutdown()
     try {
     ex.awaitTermination(20, TimeUnit.SECONDS)
     } catch (e: Exception) {
     }
     val rows = ArrayList<Pair<String, String>>()
     for (ip in ArrayList(hits)) rows.add(Pair(ip, infoOf(ip)))
     ui.post {
     found.removeAllViews()
     if (rows.isEmpty()) {
     setStatus("Cihaz bulunamadi. Karsi cihazda Monitor modu ya da sunucu acik mi?")
     } else {
     setStatus(rows.size.toString() + " cihaz bulundu, birine dokun")
     for (r in rows) {
     val lp = LinearLayout.LayoutParams(-1, -2)
     lp.topMargin = dp(6)
     found.addView(btn(r.first + "  -  " + r.second, true) { connectTo(r.first) }, lp)
     }
     }
     }
     }.start()
     }
     override fun onResume() {
     super.onResume()
     hideBars()
     }
     override fun onWindowFocusChanged(hasFocus: Boolean) {
     super.onWindowFocusChanged(hasFocus)
     if (hasFocus) hideBars()
     }
     override fun onBackPressed() {
     if (pad.editing) {
     setEdit(false)
     return
     }
     if (client.connected) showMenu() else finish()
     }
     override fun onDestroy() {
     ui.removeCallbacksAndMessages(null)
     client.onClose = null
     val c = client
     Thread { c.shutdown() }.start()
     super.onDestroy()
     }
     }
