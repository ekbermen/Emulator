     cat << 'EOF' > app/src/main/java/com/allcore/emulator/emulator/GameLauncher.kt
     package com.allcore.emulator.emulator
     import android.content.Context
     import android.content.Intent
     import com.allcore.emulator.data.AppDatabase
     import com.allcore.emulator.data.Game
     import com.allcore.emulator.util.DiscAnalyzer
     import com.allcore.emulator.util.Platform
     import com.allcore.emulator.util.toast
     import java.io.File
     object GameLauncher {

     fun play(context: Context, game: Game, editPad: Boolean = false) {
     var platform = Platform.fromDisplay(game.platform)
     if (platform == Platform.APP) {
     val li = context.packageManager.getLaunchIntentForPackage(game.filePath)
     if (li != null) context.startActivity(li) else toast(context, "Uygulama bulunamadi")
     return
     }
     var g = game
     var file = File(game.filePath)
     try {
     val rr = AutoFix.repair(context, file, platform)
     if (rr.notes.isNotEmpty()) toast(context, "Otomatik onarim: " + rr.notes.joinToString(", "))
     if (rr.file.absolutePath != file.absolutePath || rr.platform != platform) {
     file = rr.file
     platform = rr.platform
     g = game.copy(filePath = file.absolutePath, platform = platform.display)
     val app0 = context.applicationContext
     val g0 = g
     Thread {
     try {
     kotlinx.coroutines.runBlocking { AppDatabase.get(app0).gameDao().update(g0) }
     } catch (e: Throwable) {
     }
     }.start()
     }
     } catch (e: Throwable) {
     }
     if (!file.exists()) {
     toast(context, "Oyun dosyasi bulunamadi. Kutuphaneden silip yeniden ekle.")
     return
     }
     val bad = Diag.hardProblem(file, platform)
     if (bad != null) {
     toast(context, "DOSYA BOZUK: " + bad)
     return
     }
     var shown = platform.display
     try {
     val fixed = DiscAnalyzer.refine(file, platform)
     if (fixed != platform) {
     toast(context, "Platform duzeltildi: " + platform.display + " -> " + fixed.display)
     platform = fixed
     shown = fixed.display
     val app = context.applicationContext
     Thread {
     try {
     kotlinx.coroutines.runBlocking { AppDatabase.get(app).gameDao().update(g.copy(platform = fixed.display)) }
     } catch (e: Throwable) {
     }
     }.start()
     }
     } catch (e: Throwable) {
     }
     if (platform == Platform.PS2) {
     toast(context, "PS2 destegi kaldirildi")
     return
     }
     if (!Cores.available(context, platform)) {
     if (platform == Platform.GAMECUBE || platform == Platform.WII) {
     val dl = context.packageManager.getLaunchIntentForPackage("org.dolphinemu.dolphinemu")
     if (dl != null) {
     toast(context, "Dahili Dolphin cekirdegi yok. Dolphin uygulamasi aciliyor, oyunu oradan ac")
     dl.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
     context.startActivity(dl)
     return
     }
     }
     toast(context, "Bu sistem icin core yok: " + platform.display + ". Bu surumde mevcut degil.")
     return
     }

     val intent = Intent(context, GameActivity::class.java)
     intent.putExtra("id", game.id)
     intent.putExtra("name", game.name)
     intent.putExtra("path", file.absolutePath)
     intent.putExtra("platform", shown)
     intent.putExtra("edit", editPad)
     context.startActivity(intent)
     }
     }
