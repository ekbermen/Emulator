     val isTar = ext == "tar" || ext == "tgz" || lname.endsWith(".tar.gz")
     if (ext != "zip" && ext != "rar" && ext != "7z" && !isTar) return file
     if (PlatformDetector.detect(file.name) in keepZipPlatforms) return file
