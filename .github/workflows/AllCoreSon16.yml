     Tuning.setBool(d, "setPreferLowLatencyAudio", level == 2)
     }
     private fun setFast(m: Int) {
     if (m != ff) ui.post { say(m.toString() + "X") }
     ff = m
     val v = gl ?: return
     Tuning.setInt(v, "setFrameSpeed", m)
     val fm = GameSettings.ffAudio(this, gameId)
