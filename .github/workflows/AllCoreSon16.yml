     package com.allcore.emulator.emulator
     import android.app.Notification
     import android.app.NotificationChannel
     import android.app.NotificationManager
     import android.app.Service
     import android.content.Context
     import android.content.Intent
     import android.content.pm.ServiceInfo
     import android.media.AudioAttributes
     import android.media.MediaPlayer
     import android.net.Uri
     import android.os.Build
     import android.os.IBinder
     import com.allcore.emulator.util.Extra
     import kotlin.random.Random
     class MusicService : Service() {
     companion object {
     @Volatile var playing = false
     @Volatile var title = ""
     @Volatile var index = -1
     @Volatile var volume = 0.6f
     @Volatile var mp: MediaPlayer? = null
     fun cmd(ctx: Context, action: String, idx: Int = -1) {
     val i = Intent(ctx, MusicService::class.java)
     i.action = action
     i.putExtra("idx", idx)
     try {
     if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(i) else ctx.startService(i)
     } catch (e: Exception) {
     }
     }
     }
     private var list: List<Pair<String, String>> = emptyList()
     private var cur = 0
     override fun onBind(i: Intent?): IBinder? = null
     override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
     startFg()
     list = Extra.tracks(this)
     volume = Extra.musicVol(this)
     val act = i?.action
     val idx = i?.getIntExtra("idx", -1) ?: -1
     when (act) {
     "play" -> if (idx >= 0) playAt(idx, 0) else if (mp != null && !playing) resume() else playAt(cur, 0)
     "toggle" -> if (playing) pause() else if (mp != null) resume() else playAt(cur, 0)
     "next" -> next()
     "prev" -> playAt(if (cur - 1 < 0) list.size - 1 else cur - 1, 0)
     else -> stopAll()
     }
     return START_NOT_STICKY
     }
     private fun startFg() {
     val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
     if (Build.VERSION.SDK_INT >= 26) {
     nm.createNotificationChannel(NotificationChannel("allcore_music", "AllCore Muzik", NotificationManager.IMPORTANCE_LOW))
     }
     val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "allcore_music") else Notification.Builder(this)
     b.setSmallIcon(android.R.drawable.ic_media_play)
     b.setContentTitle("AllCore muzik")
     b.setContentText(if (title.isEmpty()) "Hazir" else title)
     b.setOngoing(true)
     val n = b.build()
     if (Build.VERSION.SDK_INT >= 29) startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK) else startForeground(7, n)
     }
     private fun playAt(i0: Int, tries: Int) {
     if (list.isEmpty()) {
     stopAll()
     return
     }
     val i = ((i0 % list.size) + list.size) % list.size
     cur = i
     index = i
     release()
     try {
     val m = MediaPlayer()
     m.setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
     m.setDataSource(this, Uri.parse(list[i].first))
     m.setVolume(volume, volume)
     m.setOnCompletionListener { next() }
     m.prepare()
     m.start()
     mp = m
     playing = true
     title = list[i].second
     startFg()
     } catch (e: Exception) {
     release()
     if (tries < list.size) playAt(i + 1, tries + 1) else stopAll()
     }
     }
     private fun next() {
     if (list.isEmpty()) return
     playAt(if (Extra.shuffle(this)) Random.nextInt(list.size) else cur + 1, 0)
     }
     private fun pause() {
     try {
     mp?.pause()
     } catch (e: Exception) {
     }
     playing = false
     }
     private fun resume() {
     try {
     mp?.start()
     playing = true
     } catch (e: Exception) {
     }
     }
     private fun release() {
     try {
     mp?.release()
     } catch (e: Exception) {
     }
     mp = null
     playing = false
     }
     private fun stopAll() {
     release()
     title = ""
     index = -1
     stopForeground(true)
     stopSelf()
     }
     override fun onDestroy() {
     release()
     super.onDestroy()
     }
     }
