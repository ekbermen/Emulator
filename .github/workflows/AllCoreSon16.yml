     package com.allcore.emulator.util
     import java.io.File
     import java.io.InputStream
     import java.io.InputStreamReader
     import java.net.HttpURLConnection
     import java.net.Inet4Address
     import java.net.InetSocketAddress
     import java.net.NetworkInterface
     import java.net.ServerSocket
     import java.net.Socket
     import java.net.URL
     import java.util.Collections
     import java.util.concurrent.Executors
     import java.util.concurrent.TimeUnit
     import java.util.concurrent.atomic.AtomicBoolean
     import java.util.concurrent.atomic.AtomicLong
     object FileShare {
     const val PORT = 8766
     @Volatile var code = ""
     @Volatile var status = ""
     private var server: ServerSocket? = null
     private var fileName = ""
     private var fileSize = 0L
     private var opener: ((Long) -> InputStream)? = null
     private var hash = ""
     private var allowedIp = ""
     private var expires = 0L
     private val sent = AtomicLong(0)
     private val pool = Executors.newCachedThreadPool()
     private const val ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789#@%&*?"
     private fun hashOf(c: String): String {
     val d = java.security.MessageDigest.getInstance("SHA-256").digest(c.toByteArray())
     val sb = StringBuilder()
     for (i in 0 until 8) sb.append(String.format("%02x", d[i]))
     return sb.toString()
     }
     private fun newCode(user: String): String {
     val rnd = java.security.SecureRandom()
     var u = user.filter { it.isLetterOrDigit() }.take(12)
     if (u.isEmpty()) u = "AllCore"
     val sb = StringBuilder(u)
     sb.append('-')
     for (i in 0 until 10) sb.append(ALPHA[rnd.nextInt(ALPHA.length)])
     return sb.toString()
     }
     fun startFile(file: File, user: String): String {
     if (!file.isFile) return ""
     return start(file.name, file.length(), { pos ->
     val fi = java.io.FileInputStream(file)
     fi.channel.position(pos)
     fi
     }, user)
     }
     @Synchronized
     fun start(name: String, size: Long, op: (Long) -> InputStream, user: String): String {
     stop()
     val ss = ServerSocket()
     try {
     ss.reuseAddress = true
     ss.bind(InetSocketAddress(PORT))
     } catch (e: Exception) {
     status = "Paylasim portu acilamadi"
     try {
     ss.close()
     } catch (x: Exception) {
     }
     return ""
     }
     val c = newCode(user)
     code = c
     hash = hashOf(c)
     fileName = name
     fileSize = size
     opener = op
     allowedIp = ""
     expires = System.currentTimeMillis() + 15L * 60L * 1000L
     sent.set(0)
     status = "Kod bekleniyor"
     server = ss
     val t = Thread {
     try {
     while (!ss.isClosed) {
     val s = ss.accept()
     pool.execute { handle(s) }
     }
     } catch (e: Exception) {
     }
     }
     t.isDaemon = true
     t.start()
     return c
     }
     @Synchronized
     fun stop() {
     try {
     server?.close()
     } catch (e: Exception) {
     }
     server = null
     code = ""
     opener = null
     allowedIp = ""
     status = ""
     }
     private fun readLine(i: InputStream): String? {
     val sb = StringBuilder()
     while (true) {
     val c = i.read()
     if (c < 0) return if (sb.isEmpty()) null else sb.toString()
     if (c == '\n'.code) break
     if (c != '\r'.code) sb.append(c.toChar())
     if (sb.length > 4096) return null
     }
     return sb.toString()
     }
     private fun reply(out: java.io.OutputStream, st: String, body: String) {
     val b = body.toByteArray()
     out.write(("HTTP/1.1 " + st + "\r\nContent-Type: application/json\r\nContent-Length: " + b.size + "\r\nConnection: close\r\n\r\n").toByteArray())
     out.write(b)
     out.flush()
     }
     private fun handle(s: Socket) {
     try {
     s.soTimeout = 30000
     val ins = java.io.BufferedInputStream(s.getInputStream())
     val out = s.getOutputStream()
     val line = readLine(ins) ?: return
     val parts = line.split(" ")
     if (parts.size < 2) return
     val target = parts[1]
     val path = target.substringBefore('?')
     val q = target.substringAfter('?', "")
     var hh = ""
     for (kv in q.split('&')) if (kv.startsWith("h=")) hh = kv.substring(2)
     var range = ""
     while (true) {
     val l = readLine(ins) ?: break
     if (l.isEmpty()) break
     if (l.lowercase().startsWith("range:")) range = l.substring(6).trim()
     }
     val ip = s.inetAddress.hostAddress ?: ""
     val op = opener
     if (op == null || hh != hash || System.currentTimeMillis() > expires) {
     reply(out, "404 Not Found", "{}")
     return
     }
     if (allowedIp.isEmpty()) allowedIp = ip
     if (ip != allowedIp) {
     reply(out, "403 Forbidden", "{}")
     return
     }
     if (path == "/hello") {
     reply(out, "200 OK", org.json.JSONObject().put("n", fileName).put("s", fileSize).toString())
     return
     }
     if (path != "/file") {
     reply(out, "404 Not Found", "{}")
     return
     }
     val total = fileSize
     var a = 0L
     var b = total - 1
     val m = Regex("bytes=(\\d*)-(\\d*)").find(range)
     if (m != null) {
     val x = m.groupValues[1]
     val y = m.groupValues[2]
     if (x.isNotEmpty()) a = x.toLong()
     if (y.isNotEmpty()) b = minOf(b, y.toLong())
     }
     if (a > b) {
     reply(out, "416 Range Not Satisfiable", "{}")
     return
     }
     val len = b - a + 1
     out.write(("HTTP/1.1 206 Partial Content\r\nContent-Type: application/octet-stream\r\nContent-Length: " + len + "\r\nContent-Range: bytes " + a + "-" + b + "/" + total + "\r\nConnection: close\r\n\r\n").toByteArray())
     op(a).use { src ->
     val buf = ByteArray(65536)
     var left = len
     while (left > 0) {
     val n = src.read(buf, 0, minOf(buf.size.toLong(), left).toInt())
     if (n < 0) break
     out.write(buf, 0, n)
     left -= n
     status = "Gonderiliyor: " + (sent.addAndGet(n.toLong()) / 1048576L) + " / " + (total / 1048576L) + " MB"
     }
     }
     out.flush()
     } catch (e: Exception) {
     } finally {
     try {
     s.close()
     } catch (x: Exception) {
     }
     }
     }
     private fun lanBase(): String? {
     try {
     for (ni in Collections.list(NetworkInterface.getNetworkInterfaces())) {
     if (!ni.isUp || ni.isLoopback) continue
     for (a in Collections.list(ni.inetAddresses)) {
     if (a is Inet4Address && a.isSiteLocalAddress) {
     val h = a.hostAddress ?: continue
     return h.substringBeforeLast('.') + "."
     }
     }
     }
     } catch (e: Exception) {
     }
     return null
     }
     private fun get(url: String, range: String?): HttpURLConnection {
     val c = URL(url).openConnection() as HttpURLConnection
     c.connectTimeout = 700
     c.readTimeout = 15000
     if (range != null) c.setRequestProperty("Range", range)
     return c
     }
     fun receive(codeIn: String, destDir: File, progress: (Long, Long) -> Unit): Pair<File?, String> {
     val cd = codeIn.trim()
     if (cd.length < 8) return Pair(null, "Kod gecersiz")
     val h = hashOf(cd)
     val base = lanBase() ?: return Pair(null, "Wi-Fi baglantisi bulunamadi")
     var hostIp = ""
     var name = ""
     var size = 0L
     val found = AtomicBoolean(false)
     val ex = Executors.newFixedThreadPool(48)
     for (i in 1..254) {
     val ip = base + i
     ex.execute {
     if (!found.get()) {
     try {
     val c = get("http://" + ip + ":" + PORT + "/hello?h=" + h, null)
     if (c.responseCode == 200) {
     val txt = c.inputStream.use { String(it.readBytes(), Charsets.UTF_8) }
     val j = org.json.JSONObject(txt)
     synchronized(found) {
     if (!found.get()) {
     hostIp = ip
     name = j.optString("n")
     size = j.optLong("s")
     found.set(true)
     }
     }
     }
     c.disconnect()
     } catch (e: Exception) {
     }
     }
     }
     }
     ex.shutdown()
     try {
     ex.awaitTermination(25, TimeUnit.SECONDS)
     } catch (e: Exception) {
     }
     if (hostIp.isEmpty() || size <= 0L) return Pair(null, "Bu kodla eslesen cihaz bulunamadi (ayni Wi-Fi mi, kod dogru mu?)")
     var safe = File(name).name
     if (safe.isEmpty()) safe = "oyun.bin"
     val dest = FileHelper.uniqueFile(destDir, safe)
     val parts = if (size > 8L * 1024L * 1024L) 4 else 1
     val got = AtomicLong(0)
     val fail = AtomicBoolean(false)
     val raf = java.io.RandomAccessFile(dest, "rw")
     raf.setLength(size)
     val threads = ArrayList<Thread>()
     val chunk = (size + parts - 1) / parts
     val host = hostIp
     val total = size
     for (p in 0 until parts) {
     val a = p * chunk
     val b = minOf(total - 1, a + chunk - 1)
     if (a > b) continue
     val t = Thread {
     try {
     val c = get("http://" + host + ":" + PORT + "/file?h=" + h, "bytes=" + a + "-" + b)
     c.connectTimeout = 5000
     val ins = c.inputStream
     val buf = ByteArray(65536)
     var pos = a
     while (pos <= b) {
     val n = ins.read(buf, 0, minOf(buf.size.toLong(), b - pos + 1L).toInt())
     if (n < 0) break
     synchronized(raf) {
     raf.seek(pos)
     raf.write(buf, 0, n)
     }
     pos += n
     progress(got.addAndGet(n.toLong()), total)
     }
     ins.close()
     c.disconnect()
     if (pos <= b) fail.set(true)
     } catch (e: Exception) {
     fail.set(true)
     }
     }
     threads.add(t)
     t.start()
     }
     for (t in threads) t.join()
     raf.close()
     if (fail.get() || got.get() < total) {
     dest.delete()
     return Pair(null, "Indirme yarida kesildi")
     }
     return Pair(dest, "")
     }
     }
