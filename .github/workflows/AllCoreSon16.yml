     package com.allcore.emulator.util
     import android.content.Context
     import org.json.JSONObject
     import java.net.HttpURLConnection
     import java.net.URL
     import java.net.URLEncoder
     class GameInfoData(val year: String, val genre: String, val developer: String, val desc: String)
     object GameMeta {
     private fun sp(c: Context) = c.applicationContext.getSharedPreferences("allcore_meta", Context.MODE_PRIVATE)
     private val reParen = Regex("\\(.*?\\)|\\[.*?\\]")
     private val reSpace = Regex("\\s+")
     private fun clean(n: String): String = n.replace(reParen, " ").replace('_', ' ').replace(reSpace, " ").trim()
     private fun key(name: String, plat: String): String = "m" + (plat + "|" + clean(name).lowercase()).hashCode()
     fun cached(c: Context, name: String, plat: String): GameInfoData? {
     val raw = sp(c).getString(key(name, plat), null) ?: return null
     return try {
     val j = JSONObject(raw)
     GameInfoData(j.optString("y"), j.optString("g"), j.optString("d"), j.optString("t"))
     } catch (e: Exception) {
     null
     }
     }
     private fun enc(s: String): String = URLEncoder.encode(s, "UTF-8").replace("+", "%20")
     private fun get(url: String): String {
     val cn = URL(url).openConnection() as HttpURLConnection
     cn.connectTimeout = 12000
     cn.readTimeout = 20000
     cn.setRequestProperty("User-Agent", "AllCore/2.13 (retro emulator app)")
     try {
     if (cn.responseCode != 200) throw java.io.IOException("HTTP " + cn.responseCode)
     return cn.inputStream.use { String(it.readBytes(), Charsets.UTF_8) }
     } finally {
     cn.disconnect()
     }
     }
     private fun labels(ids: List<String>, lang: String): String {
     if (ids.isEmpty()) return ""
     val u = "https://www.wikidata.org/w/api.php?action=wbgetentities&props=labels&languages=" + lang + "|en&format=json&ids=" + ids.joinToString("|")
     val ents = JSONObject(get(u)).optJSONObject("entities") ?: return ""
     val out = ArrayList<String>()
     for (id in ids) {
     val lb = ents.optJSONObject(id)?.optJSONObject("labels") ?: continue
     val v = lb.optJSONObject(lang)?.optString("value") ?: lb.optJSONObject("en")?.optString("value") ?: continue
     if (v.isNotEmpty()) out.add(v)
     }
     return out.joinToString(", ")
     }
     private fun shortText(t: String): String {
     var s = t.trim()
     if (s.length <= 320) return s
     val cut = s.substring(0, 320)
     val dot = cut.lastIndexOf(". ")
     s = if (dot > 120) cut.substring(0, dot + 1) else cut.trimEnd() + "..."
     return s
     }
     fun fetch(c: Context, name: String, plat: String, lang: String): GameInfoData? {
     val q = clean(name)
     if (q.length < 2) return null
     val su = "https://www.wikidata.org/w/api.php?action=wbsearchentities&search=" + enc(q) + "&language=en&type=item&limit=8&format=json"
     val arr = JSONObject(get(su)).optJSONArray("search") ?: return null
     var qid = ""
     for (i in 0 until arr.length()) {
     val o = arr.getJSONObject(i)
     val d = o.optString("description").lowercase()
     if (d.contains("video game")) {
     qid = o.optString("id")
     break
     }
     }
     if (qid.isEmpty()) return null
     val ent = JSONObject(get("https://www.wikidata.org/wiki/Special:EntityData/" + qid + ".json")).optJSONObject("entities")?.optJSONObject(qid) ?: return null
     val claims = ent.optJSONObject("claims")
     var year = ""
     val pub = claims?.optJSONArray("P577")
     if (pub != null) {
     var best = 9999
     for (i in 0 until pub.length()) {
     val tm = pub.getJSONObject(i).optJSONObject("mainsnak")?.optJSONObject("datavalue")?.optJSONObject("value")?.optString("time") ?: continue
     val y = tm.trimStart('+').take(4).toIntOrNull() ?: continue
     if (y < best) best = y
     }
     if (best != 9999) year = best.toString()
     }
     fun ids(prop: String): List<String> {
     val a = claims?.optJSONArray(prop) ?: return emptyList()
     val l = ArrayList<String>()
     for (i in 0 until a.length()) {
     val id = a.getJSONObject(i).optJSONObject("mainsnak")?.optJSONObject("datavalue")?.optJSONObject("value")?.optString("id") ?: continue
     if (id.isNotEmpty() && !l.contains(id)) l.add(id)
     }
     return l.take(3)
     }
     val dev = labels(ids("P178"), lang)
     val genre = labels(ids("P136"), lang)
     var desc = ""
     val links = ent.optJSONObject("sitelinks")
     val order = listOf(lang + "wiki", "enwiki")
     for (sk in order) {
     val title = links?.optJSONObject(sk)?.optString("title") ?: continue
     val host = sk.removeSuffix("wiki")
     try {
     val sj = JSONObject(get("https://" + host + ".wikipedia.org/api/rest_v1/page/summary/" + enc(title.replace(' ', '_'))))
     val ex = sj.optString("extract")
     if (ex.isNotEmpty()) {
     desc = shortText(ex)
     break
     }
     } catch (e: Exception) {
     }
     }
     if (desc.isEmpty()) desc = ent.optJSONObject("descriptions")?.optJSONObject("en")?.optString("value") ?: ""
     if (year.isEmpty() && dev.isEmpty() && genre.isEmpty() && desc.isEmpty()) return null
     val j = JSONObject()
     j.put("y", year)
     j.put("g", genre)
     j.put("d", dev)
     j.put("t", desc)
     sp(c).edit().putString(key(name, plat), j.toString()).apply()
     return GameInfoData(year, genre, dev, desc)
     }
     }
