     failAt = System.currentTimeMillis()
     status = "Dil dosyasi indirilemedi (internet gerekir)"
     queue.clear()
     pend.clear()
     }
     pend.remove(itm[0])
     val now = System.currentTimeMillis()
     if (changed && now - lastBump > 700L) {
     lastBump = now
     changed = false
     bump()
     }
     }
     if (changed) bump()
     }
     th.isDaemon = true
     worker = th
     th.start()
     }
     }
