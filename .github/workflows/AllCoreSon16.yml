     package com.allcore.emulator.util
     object Sniff {
     private val LOGO = intArrayOf(0x24, 0xFF, 0xAE, 0x51, 0x69, 0x9A, 0xA2, 0x21)
     private fun at(b: ByteArray, n: Int, off: Int, v: IntArray): Boolean {
     if (off + v.size > n) return false
     for (i in v.indices) if ((b[off + i].toInt() and 255) != v[i]) return false
     return true
     }
     private fun str(b: ByteArray, n: Int, off: Int, s: String): Boolean {
     if (off + s.length > n) return false
     for (i in s.indices) if (b[off + i].toInt() != s[i].code) return false
     return true
     }
     fun ext(b: ByteArray, n: Int): String? {
     if (str(b, n, 0, "NES\u001A")) return "nes"
     if (at(b, n, 0xC0, LOGO)) return "nds"
     if (at(b, n, 0x04, LOGO)) return "gba"
     if (at(b, n, 0x104, intArrayOf(0xCE, 0xED, 0x66, 0x66))) return "gb"
     if (str(b, n, 0x100, "NCSD")) return "3ds"
     if (at(b, n, 0, intArrayOf(0x20, 0x20, 0, 0))) return "cia"
     if (at(b, n, 0, intArrayOf(0x80, 0x37, 0x12, 0x40))) return "z64"
     if (at(b, n, 0, intArrayOf(0x37, 0x80, 0x40, 0x12))) return "v64"
     if (at(b, n, 0, intArrayOf(0x40, 0x12, 0x37, 0x80))) return "n64"
     if (str(b, n, 0x100, "SEGA")) return "md"
     if (str(b, n, 0x7FF0, "TMR SEGA")) return "sms"
     if (str(b, n, 0x8001, "CD001")) return "iso"
     if (str(b, n, 0, "\u0000PBP")) return "pbp"
     return null
     }
     fun readHead(ins: java.io.InputStream, b: ByteArray): Int {
     var p = 0
     while (p < b.size) {
     val n = ins.read(b, p, b.size - p)
     if (n < 0) break
     p += n
     }
     return p
     }
     }
