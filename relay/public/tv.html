<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AllCore TV</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
#v{display:none;margin:0 auto;height:100%;max-width:100%}
.s{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#05070D}
#code{font-size:12vmin;letter-spacing:1.5vmin;font-weight:bold;color:#3DE0FF}
.sub{font-size:3.4vmin;color:#8C97B2;margin-top:2vmin}
.big{font-size:7vmin;font-weight:bold;color:#fff;margin-top:2vmin}
#qr{margin-top:3vmin;background:#fff;padding:1.2vmin;border-radius:1.5vmin;width:22vmin;height:22vmin}
</style></head><body>
<img id="v" alt="">
<div class="s" id="sWait"><div class="sub">ALLCORE</div><div id="code">------</div><div class="sub">Telefonda AllCore: TV QR tara (veya kodu yaz)</div><img id="qr" alt=""></div>
<div class="s" id="sIdle"><div class="sub">ALLCORE</div><div class="big">Baglandi</div><div class="sub">Telefondan bir oyun sec</div></div>
<div class="s" id="sReady"><div class="sub">ALLCORE</div><div class="big" id="gname"></div><div class="sub">Telefonda START'a bas</div></div>
<script>
(function(){
var K='allcore_room',code=localStorage.getItem(K);
if(!code){code=Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem(K,code);}
document.getElementById('code').textContent=code;
document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data='+encodeURIComponent('ALLCORE:'+code);
var v=document.getElementById('v'),S={wait:sWait,idle:sIdle,ready:sReady},st='wait',last=null,ws;
function show(n){st=n;for(var k in S)S[k].style.display=(k===n)?'flex':'none';if(n!=='play')v.style.display='none';}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/?role=tv&room='+code);
  ws.onmessage=function(e){
    if(typeof e.data==='string'){
      var m;try{m=JSON.parse(e.data);}catch(x){return;}
      if(m.t==='status'){
        if(!m.host)show('wait');
        else if(!m.game)show('idle');
        else if(!m.started){document.getElementById('gname').textContent=m.game;show('ready');}
        else{if(st!=='play'){st='play';for(var k in S)S[k].style.display='none';}}
      }
      return;
    }
    if(st!=='play')return;
    var url=URL.createObjectURL(e.data);
    v.onload=function(){if(last)URL.revokeObjectURL(last);last=url;};
    v.src=url;v.style.display='block';
  };
  ws.onclose=function(){show('wait');setTimeout(connect,1500);};
}
show('wait');connect();
document.body.onclick=function(){var d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);};
})();
</script></body></html>
