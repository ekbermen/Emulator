                  arrayOf("Indirilen dosya taninmadi:", "Downloaded file not recognized:", "Heruntergeladene Datei nicht erkannt:"),
                  arrayOf("kutuphaneye eklendi", "added to library", "zur Bibliothek hinzugefügt"),
                  arrayOf("Indirme basladi:", "Download started:", "Download gestartet:"),
                  arrayOf("Kopyalaniyor", "Copying", "Kopiere"),
                  arrayOf(" kurulu degil", " is not installed", " ist nicht installiert"),
                  arrayOf(" hazir", " ready", " bereit"),
                  arrayOf("acilamadi", "could not be opened", "konnte nicht geöffnet werden")
              )

              private val exact: Map<String, Array<String>> = d.associateBy { it[0] }

              fun t(s: String): String {
                  val lg = lang
                  if (lg == 0 || s.isEmpty()) return s
                  val key = "$lg|$s"
                  cache[key]?.let { return it }
                  var r = exact[s]?.get(lg)
                  if (r == null) {
                      var x = s
                      for (e in f) if (x.contains(e[0])) x = x.replace(e[0], e[lg])
                      r = x
                  }
                  cache[key] = r
                  return r
              }
          }
