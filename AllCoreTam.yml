          cat << 'EOF' > app/src/main/java/com/allcore/emulator/MainActivity.kt
          package com.allcore.emulator

          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import com.allcore.emulator.data.GameViewModel
          import com.allcore.emulator.ui.AllCoreApp
          import com.allcore.emulator.ui.AllCoreTheme
          import com.allcore.emulator.util.AmbientMusic
          import com.allcore.emulator.util.Gfx
          import com.allcore.emulator.util.L
          import com.allcore.emulator.util.Prefs
          import com.allcore.emulator.util.Sfx

          class MainActivity : ComponentActivity() {

              private val vm: GameViewModel by viewModels()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  if (Build.VERSION.SDK_INT >= 28) {
                      val lp = window.attributes
                      lp.layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= 30) {
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                      } else {
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                      }
                      window.attributes = lp
                  }
                  hideSystemUi()
                  Sfx.enabled = Prefs.sfx(this)
                  Sfx.init()
                  L.lang = Prefs.getInt(this, "lang", 0)
                  Gfx.load(this)
                  val fpsIdx = Prefs.getInt(this, "fps", -1)
                  if (fpsIdx >= 0) Gfx.applyFps(this, fpsIdx)
                  AmbientMusic.volume = Prefs.musicVolume(this)
                  setContent {
                      AllCoreTheme {
                          AllCoreApp(vm)
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  hideSystemUi()
                  if (Prefs.music(this)) AmbientMusic.start()
              }

              override fun onPause() {
                  super.onPause()
                  AmbientMusic.pause()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemUi()
              }

              private fun hideSystemUi() {
                  val c = WindowInsetsControllerCompat(window, window.decorView)
                  c.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  c.hide(WindowInsetsCompat.Type.systemBars())
              }
          }
