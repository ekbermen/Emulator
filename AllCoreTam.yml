          fun normalizeUrl(input: String): String {
              val t = input.trim()
              if (t.isEmpty()) return "https://www.google.com"
              if (t.startsWith("http://") || t.startsWith("https://")) return t
              if (!t.contains(' ') && t.contains('.')) return "https://$t"
              return "https://www.google.com/search?q=" + Uri.encode(t)
          }

          fun startDownload(ctx: Context, url: String, ua: String?, cd: String?, mime: String?) {
              try {
                  val dir = ctx.getExternalFilesDir("games")
                  if (dir == null) {
                      toast(ctx, "Depolama alani bulunamadi")
                      return
                  }
                  val name = URLUtil.guessFileName(url, cd, mime)
                  val file = FileHelper.uniqueFile(dir, name)
                  val req = DownloadManager.Request(Uri.parse(url))
                  req.setTitle(file.name)
                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                  req.setDestinationInExternalFilesDir(ctx, "games", file.name)
                  val cookie = CookieManager.getInstance().getCookie(url)
                  if (cookie != null) req.addRequestHeader("Cookie", cookie)
                  if (ua != null) req.addRequestHeader("User-Agent", ua)
                  val dm = ctx.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  val id = dm.enqueue(req)
                  DownloadTracker.pending[id] = file
                  toast(ctx, "Indirme basladi: " + file.name)
              } catch (e: Exception) {
                  toast(ctx, "Indirme baslatilamadi")
              }
          }

          // Indirme bitince dosyayi otomatik kutuphaneye ekler
          @Composable
          fun DownloadWatcher(vm: GameViewModel) {
              val ctx = LocalContext.current
              DisposableEffect(Unit) {
                  val app = ctx.applicationContext
                  val main = Handler(Looper.getMainLooper())
                  val r = object : BroadcastReceiver() {
                      override fun onReceive(c: Context, i: Intent) {
                          val id = i.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1L)
                          val f = DownloadTracker.pending.remove(id) ?: return
                          thread(name = "allcore-dl") {
                              var ok = false
                              try {
                                  val dm = app.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                  val cur = dm.query(DownloadManager.Query().setFilterById(id))
                                  if (cur != null) {
                                      cur.use {
                                          if (it.moveToFirst()) {
                                              val st = it.getInt(it.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                                              ok = st == DownloadManager.STATUS_SUCCESSFUL
                                          }
                                      }
                                  }
                              } catch (e: Exception) {
                              }
                              if (!ok || !f.exists()) {
                                  main.post { toast(app, "Indirme basarisiz") }
                                  return@thread
                              }
                              val res = FileHelper.resolveGameFile(f)
                              val p = PlatformDetector.detect(res.name)
                              if (p == Platform.UNKNOWN) {
                                  main.post { toast(app, "Indirilen dosya taninmadi: " + res.name) }
                                  return@thread
                              }
                              val game = Game(
                                  name = FileHelper.displayName(res.name),
                                  filePath = res.absolutePath,
                                  platform = p.display
                              )
                              vm.addGame(game) { toast(app, game.name + " kutuphaneye eklendi") }
                          }
                      }
                  }
                  ContextCompat.registerReceiver(
                      app, r,
                      IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE),
                      ContextCompat.RECEIVER_EXPORTED
                  )
                  onDispose {
                      try {
                          app.unregisterReceiver(r)
                      } catch (e: Exception) {
                      }
                  }
              }
          }

