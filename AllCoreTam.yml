          @Composable
          fun BrowserScreen(holder: BrowserHolder) {
              val focus = LocalFocusManager.current
              val shown = if (holder.url.contains("allcore.local")) "" else holder.url
              var text by remember(holder.url) { mutableStateOf(shown) }
              val secure = holder.url.startsWith("https://") || shown.isEmpty()
              val go: () -> Unit = {
                  val u = normalizeUrl(text)
                  holder.url = u
                  holder.webView?.loadUrl(u)
                  focus.clearFocus()
              }
              Column(Modifier.fillMaxSize().padding(horizontal = 32.dp)) {
                  Reveal(0) {
                      Row(
                          Modifier
                              .fillMaxWidth()
                              .glass(RoundedCornerShape(50))
                              .padding(horizontal = 8.dp, vertical = 5.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          IconPill(
                              Icons.Rounded.ArrowBackIosNew, { holder.webView?.goBack() },
                              tint = if (holder.canBack) AC.Text else AC.Muted, size = 36.dp, sound = false
                          )
                          Spacer(Modifier.width(6.dp))
                          IconPill(
                              Icons.Rounded.ArrowForwardIos, { holder.webView?.goForward() },
                              tint = if (holder.canForward) AC.Text else AC.Muted, size = 36.dp, sound = false
                          )
                          Spacer(Modifier.width(6.dp))
                          IconPill(
                              if (holder.loading) Icons.Rounded.Close else Icons.Rounded.Refresh,
                              { if (holder.loading) holder.webView?.stopLoading() else holder.webView?.reload() },
                              size = 36.dp
                          )
                          Spacer(Modifier.width(10.dp))
                          Row(
                              Modifier
                                  .weight(1f)
                                  .height(36.dp)
                                  .clip(RoundedCornerShape(50))
                                  .background(Color(0x33000000))
                                  .padding(horizontal = 14.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(
                                  if (secure) Icons.Rounded.Lock else Icons.Rounded.LockOpen,
                                  null,
                                  tint = if (secure) AC.Green else AC.Orange,
                                  modifier = Modifier.size(14.dp)
                              )
                              Spacer(Modifier.width(8.dp))
                              Box(Modifier.weight(1f)) {
                                  if (text.isEmpty()) Text("Ara veya adres yaz", color = AC.Muted, fontSize = 13.sp)
                                  BasicTextField(
                                      value = text,
                                      onValueChange = { text = it },
                                      singleLine = true,
                                      textStyle = TextStyle(color = AC.Text, fontSize = 13.sp),
                                      cursorBrush = SolidColor(AC.Cyan),
                                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Go, keyboardType = KeyboardType.Uri),
                                      keyboardActions = KeyboardActions(onGo = { go() }),
                                      modifier = Modifier.fillMaxWidth()
                                  )
                              }
                          }
                          Spacer(Modifier.width(10.dp))
                          IconPill(Icons.Rounded.Home, {
                              holder.url = ""
                              holder.webView?.loadDataWithBaseURL("https://allcore.local/", START_HTML, "text/html", "utf-8", null)
                          }, size = 36.dp)
                          Spacer(Modifier.width(6.dp))
                          IconPill(Icons.Rounded.Search, { go() }, size = 36.dp)
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  if (holder.loading) {
                      ProgressBar(holder.progress, Modifier.fillMaxWidth())
                  } else {
                      Spacer(Modifier.height(6.dp))
                  }
                  Spacer(Modifier.height(6.dp))
                  AndroidView(
                      modifier = Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .padding(bottom = 10.dp)
                          .clip(RoundedCornerShape(18.dp)),
                      factory = { c ->
                          val existing = holder.webView
                          if (existing != null) {
                              (existing.parent as? ViewGroup)?.removeView(existing)
                              existing
                          } else {
                              val wv = WebView(c)
                              wv.settings.javaScriptEnabled = true
                              wv.settings.domStorageEnabled = true
                              wv.settings.loadWithOverviewMode = true
                              wv.settings.useWideViewPort = true
                              wv.settings.setSupportZoom(true)
                              wv.settings.builtInZoomControls = true
                              wv.settings.displayZoomControls = false
                              wv.setBackgroundColor(0xFF05070D.toInt())
                              CookieManager.getInstance().setAcceptCookie(true)
                              wv.webViewClient = object : WebViewClient() {
                                  override fun onPageStarted(view: WebView?, url: String?, favicon: Bitmap?) {
                                      holder.loading = true
                                      if (url != null && url.startsWith("http")) holder.url = url
                                  }

                                  override fun onPageFinished(view: WebView?, url: String?) {
                                      holder.loading = false
                                      if (url != null && url.startsWith("http")) holder.url = url
                                      holder.canBack = view?.canGoBack() == true
                                      holder.canForward = view?.canGoForward() == true
                                  }

                                  override fun shouldOverrideUrlLoading(
                                      view: WebView?,
                                      request: WebResourceRequest?
                                  ): Boolean {
                                      val s = request?.url?.scheme
                                      return !(s == "http" || s == "https")
                                  }
                              }
                              wv.webChromeClient = object : WebChromeClient() {
                                  override fun onProgressChanged(view: WebView?, newProgress: Int) {
                                      holder.progress = newProgress / 100f
                                  }
                              }
                              wv.setDownloadListener { u, ua, cd, mime, _ ->
                                  startDownload(c, u, ua, cd, mime)
                              }
                              if (holder.url.isEmpty()) {
                                  wv.loadDataWithBaseURL("https://allcore.local/", START_HTML, "text/html", "utf-8", null)
                              } else {
                                  wv.loadUrl(holder.url)
                              }
                              holder.webView = wv
                              wv
                          }
                      }
                  )
              }
          }
