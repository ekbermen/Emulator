          package com.allcore.emulator.util

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.widget.Toast
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.IOException
          import java.util.concurrent.ConcurrentHashMap
          import java.util.zip.ZipInputStream

          fun toast(context: Context, msg: String) {
              Toast.makeText(context.applicationContext, L.t(msg), Toast.LENGTH_LONG).show()
          }

          object DownloadTracker {
              val pending = ConcurrentHashMap<Long, File>()
          }

          object FileHelper {

              fun hasAllFiles(): Boolean =
                  Build.VERSION.SDK_INT >= 30 && Environment.isExternalStorageManager()

              fun needsAllFiles(): Boolean =
                  Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()

              fun gamesDir(context: Context): File {
                  if (hasAllFiles()) {
                      val shared = File(Environment.getExternalStorageDirectory(), "AllCore/games")
                      shared.mkdirs()
                      if (shared.isDirectory && shared.canWrite()) return shared
                  }
                  val d = context.getExternalFilesDir("games") ?: File(context.filesDir, "games")
                  d.mkdirs()
                  return d
              }

              fun requestAllFiles(context: Context) {
                  if (Build.VERSION.SDK_INT < 30) return
                  try {
                      val i = Intent(
                          Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                          Uri.parse("package:" + context.packageName)
                      )
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(i)
                  } catch (e: Exception) {
                      try {
                          val i2 = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                          i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          context.startActivity(i2)
                      } catch (e2: Exception) {
                      }
                  }
              }

              fun isInGamesDir(f: File): Boolean {
                  val p = f.absolutePath
                  return p.contains("/AllCore/games/") || p.contains("/files/games/")
              }

              fun uniqueFile(dir: File, name: String): File {
                  dir.mkdirs()
                  var f = File(dir, name)
                  if (!f.exists()) return f
                  val base = name.substringBeforeLast('.', name)
                  val ext = if (name.contains('.')) "." + name.substringAfterLast('.') else ""
                  var n = 1
                  while (f.exists()) {
                      f = File(dir, "$base ($n)$ext")
                      n++
                  }
                  return f
              }

              fun displayName(fileName: String): String {
                  val base = fileName.substringBeforeLast('.', fileName)
                  return base.replace('_', ' ').trim().ifEmpty { fileName }
              }

              fun queryName(context: Context, uri: Uri): String {
                  var name: String? = null
                  try {
                      context.contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (i >= 0 && c.moveToFirst()) name = c.getString(i)
                      }
                  } catch (e: Exception) {
                  }
                  return name ?: uri.lastPathSegment?.substringAfterLast('/') ?: "oyun"
              }

              private fun querySize(context: Context, uri: Uri): Long {
                  var size = -1L
                  try {
                      context.contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val i = c.getColumnIndex(OpenableColumns.SIZE)
                          if (i >= 0 && c.moveToFirst()) size = c.getLong(i)
                      }
                  } catch (e: Exception) {
                  }
                  return size
              }

              fun copyFromUri(context: Context, uri: Uri, dest: File, onProgress: (Float) -> Unit) {
                  val total = querySize(context, uri)
                  val input = context.contentResolver.openInputStream(uri) ?: throw IOException("Dosya acilamadi")
                  input.use { ins ->
                      FileOutputStream(dest).use { out ->
                          val buf = ByteArray(256 * 1024)
                          var done = 0L
                          var last = 0L
                          while (true) {
                              val n = ins.read(buf)
                              if (n < 0) break
                              out.write(buf, 0, n)
                              done += n
                              if (total > 0 && done - last > 1_000_000L) {
                                  last = done
                                  onProgress((done.toFloat() / total.toFloat()).coerceIn(0f, 1f))
                              }
                          }
                      }
                  }
                  onProgress(1f)
              }

              // ZIP icinden ilk taninan oyun dosyasini cikarir
              fun resolveGameFile(file: File): File {
                  if (!file.extension.equals("zip", true)) return file
                  try {
                      val parent = file.parentFile ?: return file
                      ZipInputStream(FileInputStream(file).buffered()).use { zis ->
                          var entry = zis.nextEntry
                          while (entry != null) {
                              val e = entry
                              if (!e.isDirectory) {
                                  val n = File(e.name).name
                                  if (PlatformDetector.detect(n) != Platform.UNKNOWN) {
                                      val out = uniqueFile(parent, n)
                                      FileOutputStream(out).use { zis.copyTo(it) }
                                      file.delete()
                                      return out
                                  }
                              }
                              entry = zis.nextEntry
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return file
              }
          }
