          cat << 'EOF' > app/src/main/java/com/allcore/emulator/data/Game.kt
          package com.allcore.emulator.data

          import android.content.Context
          import androidx.room.Dao
          import androidx.room.Database
          import androidx.room.Delete
          import androidx.room.Entity
          import androidx.room.Insert
          import androidx.room.PrimaryKey
          import androidx.room.Query
          import androidx.room.Room
          import androidx.room.RoomDatabase
          import androidx.room.Update

          @Entity(tableName = "games")
          data class Game(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
              val filePath: String,
              val platform: String,
              val coverPath: String? = null,
              val favorite: Boolean = false,
              val addedAt: Long = System.currentTimeMillis()
          )

          @Dao
          interface GameDao {
              @Query("SELECT * FROM games ORDER BY addedAt DESC")
              suspend fun getAll(): List<Game>

              @Query("SELECT * FROM games WHERE id = :id LIMIT 1")
              suspend fun getById(id: Long): Game?

              @Insert
              suspend fun insert(game: Game): Long

              @Update
              suspend fun update(game: Game)

              @Delete
              suspend fun delete(game: Game)
          }

          @Database(entities = [Game::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun gameDao(): GameDao

              companion object {
                  @Volatile
                  private var instance: AppDatabase? = null

                  fun get(context: Context): AppDatabase {
                      return instance ?: synchronized(this) {
                          instance ?: Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "allcore.db"
                          ).build().also { instance = it }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/allcore/emulator/data/GameViewModel.kt
          package com.allcore.emulator.data

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.allcore.emulator.util.FileHelper
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class GameViewModel(app: Application) : AndroidViewModel(app) {

              private val dao = AppDatabase.get(app).gameDao()
              private val _games = MutableStateFlow<List<Game>>(emptyList())
              val games: StateFlow<List<Game>> = _games.asStateFlow()

              init {
                  refresh()
              }

              fun refresh() {
                  viewModelScope.launch(Dispatchers.IO) {
                      _games.value = dao.getAll()
                  }
              }

              fun addGame(game: Game, onDone: (Long) -> Unit = {}) {
                  viewModelScope.launch(Dispatchers.IO) {
                      val existing = dao.getAll().firstOrNull { it.filePath == game.filePath }
                      val id = existing?.id ?: dao.insert(game)
                      _games.value = dao.getAll()
                      withContext(Dispatchers.Main) { onDone(id) }
                  }
              }

              fun updateGame(game: Game) {
                  viewModelScope.launch(Dispatchers.IO) {
                      dao.update(game)
                      _games.value = dao.getAll()
                  }
              }

              fun deleteGame(game: Game) {
                  viewModelScope.launch(Dispatchers.IO) {
                      dao.delete(game)
                      try {
                          val f = File(game.filePath)
                          if (FileHelper.isInGamesDir(f)) f.delete()
                          game.coverPath?.let { File(it).delete() }
                      } catch (e: Exception) {
                      }
                      _games.value = dao.getAll()
                  }
              }

              fun clearAll() {
                  viewModelScope.launch(Dispatchers.IO) {
                      for (g in dao.getAll()) {
                          dao.delete(g)
                          try {
                              val f = File(g.filePath)
                              if (FileHelper.isInGamesDir(f)) f.delete()
                              g.coverPath?.let { File(it).delete() }
                          } catch (e: Exception) {
                          }
                      }
                      _games.value = dao.getAll()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/allcore/emulator/emulator/Bridges.kt
          package com.allcore.emulator.emulator

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.Settings
          import java.io.File

          abstract class BaseBridge(
              override val packageName: String,
              override val displayName: String,
              override val manualSelect: Boolean = false
          ) : EmulatorBridge {
              override fun isInstalled(context: Context): Boolean = checkInstalled(context)
              override fun openStore(context: Context) = launchStore(context)
              override fun openEmulator(context: Context): Boolean = launchEmulator(context)
          }

          class PPSSPPBridge : BaseBridge("org.ppsspp.ppsspp", "PPSSPP") {
              override fun launch(context: Context, gamePath: String): Boolean {
                  val i = Intent(Intent.ACTION_VIEW)
                  i.setClassName(packageName, "org.ppsspp.ppsspp.PpssppActivity")
                  i.putExtra("p", gamePath)
                  val uri = contentUriFor(context, gamePath)
                  if (uri != null) {
                      i.data = uri
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  return context.startSafe(i)
              }
          }

          class RetroArchBridge : BaseBridge("com.retroarch", "RetroArch") {
              private val cores = mapOf(
                  "nes" to "fceumm_libretro_android.so",
                  "sfc" to "snes9x_libretro_android.so",
                  "smc" to "snes9x_libretro_android.so",
                  "gb" to "gambatte_libretro_android.so",
                  "gbc" to "gambatte_libretro_android.so",
                  "gba" to "mgba_libretro_android.so",
                  "n64" to "mupen64plus_next_libretro_android.so",
                  "z64" to "mupen64plus_next_libretro_android.so",
                  "v64" to "mupen64plus_next_libretro_android.so",
                  "nds" to "melonds_libretro_android.so"
              )

              override fun launch(context: Context, gamePath: String): Boolean {
                  val core = cores[File(gamePath).extension.lowercase()] ?: return false
                  val cfg = Environment.getExternalStorageDirectory().absolutePath +
                      "/Android/data/com.retroarch/files/retroarch.cfg"
                  val i = Intent(Intent.ACTION_MAIN)
                  i.setClassName(packageName, "com.retroarch.browser.retroactivity.RetroActivityFuture")
                  i.putExtra("ROM", gamePath)
                  i.putExtra("LIBRETRO", "/data/data/com.retroarch/cores/$core")
                  i.putExtra("CONFIGFILE", cfg)
                  i.putExtra("QUITFOCUS", "")
                  return context.startSafe(i)
              }
          }

          class DuckStationBridge : BaseBridge("com.github.stenzek.duckstation", "DuckStation") {
              override fun launch(context: Context, gamePath: String): Boolean {
                  val i = Intent(Intent.ACTION_MAIN)
                  i.setClassName(packageName, "com.github.stenzek.duckstation.EmulationActivity")
                  i.putExtra("bootPath", gamePath)
                  return context.startSafe(i)
              }
          }

          class AetherSX2Bridge : BaseBridge("xyz.aethersx2.android", "AetherSX2", manualSelect = true) {
              override fun launch(context: Context, gamePath: String): Boolean = openEmulator(context)
          }

          class Armsx3Bridge : BaseBridge("com.armsx3.play", "ARMSX3 (Deneysel)", manualSelect = true) {
              override fun launch(context: Context, gamePath: String): Boolean = openEmulator(context)
          }

          class DolphinBridge : BaseBridge("org.dolphinemu.dolphinemu", "Dolphin") {
              override fun launch(context: Context, gamePath: String): Boolean {
                  val i = Intent(Intent.ACTION_VIEW)
                  i.setClassName(packageName, "org.dolphinemu.dolphinemu.ui.main.MainActivity")
                  i.putExtra("AutoStartFile", gamePath)
                  return context.startSafe(i)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/allcore/emulator/emulator/EmulatorBridge.kt
          package com.allcore.emulator.emulator

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import androidx.core.content.FileProvider
          import com.allcore.emulator.util.toast
          import java.io.File

          interface EmulatorBridge {
              val packageName: String
              val displayName: String
              val manualSelect: Boolean get() = false
              fun isInstalled(context: Context): Boolean
              fun openStore(context: Context)
              fun launch(context: Context, gamePath: String): Boolean
              fun openEmulator(context: Context): Boolean
          }

          fun EmulatorBridge.checkInstalled(context: Context): Boolean {
              return try {
                  context.packageManager.getPackageInfo(packageName, 0)
                  true
              } catch (e: Exception) {
                  false
              }
          }

          fun EmulatorBridge.launchStore(context: Context) {
              try {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=$packageName"))
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(i)
              } catch (e: Exception) {
                  try {
                      val i2 = Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse("https://play.google.com/store/apps/details?id=$packageName")
                      )
                      i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(i2)
                  } catch (e2: Exception) {
                      toast(context, "Play Store acilamadi")
                  }
              }
          }

          fun EmulatorBridge.launchEmulator(context: Context): Boolean {
              val i = context.packageManager.getLaunchIntentForPackage(packageName) ?: return false
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              return context.startSafe(i)
          }

          internal fun Context.startSafe(intent: Intent): Boolean {
              return try {
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  startActivity(intent)
                  true
              } catch (e: Exception) {
                  false
              }
          }

          internal fun contentUriFor(context: Context, path: String): Uri? {
              return try {
                  FileProvider.getUriForFile(context, context.packageName + ".fileprovider", File(path))
              } catch (e: Exception) {
                  null
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/allcore/emulator/emulator/EmulatorRegistry.kt
          package com.allcore.emulator.emulator

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import com.allcore.emulator.data.Game
          import com.allcore.emulator.util.Platform
          import com.allcore.emulator.util.toast
          import java.io.File

          object EmulatorRegistry {
              private val duck = DuckStationBridge()
              private val ppsspp = PPSSPPBridge()
              private val aether = AetherSX2Bridge()
              private val armsx3 = Armsx3Bridge()
              private val retro = RetroArchBridge()
              private val dolphin = DolphinBridge()

              private val map: Map<Platform, EmulatorBridge> = linkedMapOf<Platform, EmulatorBridge>(
                  Platform.PS1 to duck,
                  Platform.PSP to ppsspp,
                  Platform.PS2 to aether,
                  Platform.PS3 to armsx3,
                  Platform.NES to retro,
                  Platform.SNES to retro,
                  Platform.GB to retro,
                  Platform.GBC to retro,
                  Platform.GBA to retro,
                  Platform.N64 to retro,
                  Platform.NDS to retro,
                  Platform.GAMECUBE to dolphin,
                  Platform.WII to dolphin,
              )

              fun bridgeFor(platform: Platform): EmulatorBridge? = map[platform]

              fun all(): Collection<EmulatorBridge> = map.values.distinct()

              fun platformsOf(bridge: EmulatorBridge): List<Platform> =
                  map.filterValues { it === bridge }.keys.toList()
          }

          object GameLauncher {

              fun play(context: Context, game: Game) {
                  val platform = Platform.fromDisplay(game.platform)
                  val bridge = EmulatorRegistry.bridgeFor(platform)
                  if (bridge == null) {
                      toast(context, "Bu platform icin emulator bulunamadi")
                      return
                  }
                  if (!File(game.filePath).exists()) {
                      toast(context, "Oyun dosyasi bulunamadi. Kutuphaneden silip yeniden ekle.")
                      return
                  }
                  if (!bridge.isInstalled(context)) {
                      toast(context, "${bridge.displayName} kurulu degil. Play Store aciliyor...")
                      bridge.openStore(context)
                      return
                  }
                  val ok = try {
                      bridge.launch(context, game.filePath)
                  } catch (e: Exception) {
                      false
                  }
                  if (!ok) {
                      toast(context, "${bridge.displayName} dogrudan baslatilamadi, emulator aciliyor")
                      if (!bridge.openEmulator(context)) bridge.openStore(context)
                  } else if (bridge.manualSelect) {
                      try {
                          val cm = context.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("AllCore", game.filePath))
                      } catch (e: Exception) {
                      }
                      toast(context, "${bridge.displayName} acildi. Oyun yolu panoya kopyalandi, emulatorden oyunu sec.")
                  }
              }

              fun openSettings(context: Context, game: Game) {
                  val platform = Platform.fromDisplay(game.platform)
                  val bridge = EmulatorRegistry.bridgeFor(platform)
                  if (bridge == null) {
                      toast(context, "Bu platform icin emulator bulunamadi")
                      return
                  }
                  if (!bridge.isInstalled(context)) {
                      toast(context, "${bridge.displayName} kurulu degil. Play Store aciliyor...")
                      bridge.openStore(context)
                      return
                  }
                  if (!bridge.openEmulator(context)) {
                      toast(context, "${bridge.displayName} acilamadi")
                      bridge.openStore(context)
                  }
              }
          }
          EOF

