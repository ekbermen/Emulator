          package com.allcore.emulator.util

          import android.app.Activity
          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          object Prefs {
              private fun sp(c: Context) =
                  c.applicationContext.getSharedPreferences("allcore_prefs", Context.MODE_PRIVATE)

              fun getInt(c: Context, k: String, d: Int): Int = sp(c).getInt(k, d)
              fun setInt(c: Context, k: String, v: Int) = sp(c).edit().putInt(k, v).apply()

              fun music(c: Context): Boolean = sp(c).getBoolean("music", true)
              fun setMusic(c: Context, v: Boolean) = sp(c).edit().putBoolean("music", v).apply()

              fun sfx(c: Context): Boolean = sp(c).getBoolean("sfx", true)
              fun setSfx(c: Context, v: Boolean) = sp(c).edit().putBoolean("sfx", v).apply()

              fun musicVolume(c: Context): Float = sp(c).getFloat("music_volume", 0.5f)
              fun setMusicVolume(c: Context, v: Float) = sp(c).edit().putFloat("music_volume", v).apply()
          }

          object Gfx {
              var quality by mutableIntStateOf(2)
              var anim by mutableStateOf(true)

              fun load(c: Context) {
                  quality = Prefs.getInt(c, "gfx_quality", 2)
                  anim = Prefs.getInt(c, "gfx_anim", 1) == 1
              }

              fun particles(): Int = if (!anim) 0 else intArrayOf(10, 22, 36)[quality.coerceIn(0, 2)]

              fun applyFps(a: Activity, idx: Int) {
                  val hz = intArrayOf(30, 60, 90, 120)[idx.coerceIn(0, 3)]
                  val lp = a.window.attributes
                  lp.preferredRefreshRate = hz.toFloat()
                  a.window.attributes = lp
              }
          }
