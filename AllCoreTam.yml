                  arrayOf("dogrudan baslatilamadi, emulator aciliyor", "could not start directly, opening emulator", "konnte nicht direkt gestartet werden, Emulator wird geöffnet"),
                  arrayOf("acildi. Oyun yolu panoya kopyalandi, emulatorden oyunu sec.", "opened. Game path copied, pick the game in the emulator.", "geöffnet. Spielpfad kopiert, wähle das Spiel im Emulator."),
