          @Composable
          fun LogoMark(logoSize: Dp, modifier: Modifier = Modifier) {
              val inf = rememberInfiniteTransition(label = "logo")
              val rot by inf.animateFloat(
                  0f, 360f,
                  infiniteRepeatable(tween(6000, easing = LinearEasing)),
                  label = "rot"
              )
              val rot2 by inf.animateFloat(
                  360f, 0f,
                  infiniteRepeatable(tween(9000, easing = LinearEasing)),
                  label = "rot2"
              )
              val pulse by inf.animateFloat(
                  0.94f, 1.06f,
                  infiniteRepeatable(tween(1400, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "pulse"
              )
              Canvas(modifier.size(logoSize)) {
                  val c = center
                  val r = this.size.minDimension / 2f
                  drawCircle(
                      Brush.radialGradient(listOf(AC.Cyan.copy(alpha = 0.35f), Color.Transparent), center = c, radius = r),
                      radius = r, center = c
                  )
                  rotate(rot, c) {
                      drawArc(
                          brush = Brush.sweepGradient(
                              listOf(Color.Transparent, AC.Cyan, AC.Blue, Color.Transparent),
                              center = c
                          ),
                          startAngle = 0f,
                          sweepAngle = 300f,
                          useCenter = false,
                          topLeft = Offset(c.x - r * 0.92f, c.y - r * 0.92f),
                          size = Size(r * 1.84f, r * 1.84f),
                          style = Stroke(width = r * 0.07f, cap = StrokeCap.Round)
                      )
                  }
                  rotate(rot2, c) {
                      drawArc(
                          brush = Brush.sweepGradient(
                              listOf(Color.Transparent, AC.Violet, Color.Transparent),
                              center = c
                          ),
                          startAngle = 0f,
                          sweepAngle = 220f,
                          useCenter = false,
                          topLeft = Offset(c.x - r * 0.78f, c.y - r * 0.78f),
                          size = Size(r * 1.56f, r * 1.56f),
                          style = Stroke(width = r * 0.04f, cap = StrokeCap.Round)
                      )
                      drawCircle(AC.Cyan, r * 0.06f, Offset(c.x + r * 0.78f, c.y))
                  }
                  val hex = hexPath(c.x, c.y, r * 0.6f * pulse)
                  drawPath(
                      hex,
                      Brush.linearGradient(
                          listOf(AC.Blue, AC.Violet),
                          start = Offset.Zero,
                          end = Offset(this.size.width, this.size.height)
                      )
                  )
                  drawPath(hex, Color.White.copy(alpha = 0.9f), style = Stroke(width = r * 0.03f))
                  drawPath(hexPath(c.x, c.y, r * 0.36f * pulse), Color(0xFF05070D))
                  drawPath(hexPath(c.x, c.y, r * 0.2f * pulse), Brush.linearGradient(listOf(AC.Cyan, Color.White)))
              }
          }

          @Composable
          fun SplashLetter(ch: Char, i: Int) {
              val a = remember { Animatable(0f) }
              LaunchedEffect(Unit) {
                  delay(500L + i * 110L)
                  a.animateTo(1f, spring(dampingRatio = 0.6f, stiffness = 200f))
              }
              Text(
                  ch.toString(),
                  color = if (i < 3) Color.White else AC.Cyan,
                  fontSize = 52.sp,
                  fontWeight = FontWeight.Black,
                  letterSpacing = 6.sp,
                  modifier = Modifier.graphicsLayer {
                      alpha = a.value.coerceIn(0f, 1f)
                      translationY = (1f - a.value) * 60f
                      scaleX = 0.6f + 0.4f * a.value
                      scaleY = 0.6f + 0.4f * a.value
                  }
              )
          }

          @Composable
          fun SplashScreen(onDone: () -> Unit) {
              val prog = remember { Animatable(0f) }
              val sub = remember { Animatable(0f) }
              val inf = rememberInfiniteTransition(label = "splash")
              val ring by inf.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(2600, easing = LinearEasing)),
                  label = "ring"
              )
              LaunchedEffect(Unit) {
                  Sfx.boot()
                  launch { prog.animateTo(1f, tween(3000, easing = FastOutSlowInEasing)) }
                  launch {
                      delay(1500)
                      sub.animateTo(1f, tween(700))
                  }
                  delay(3500)
                  onDone()
              }
              Box(
                  Modifier
                      .fillMaxSize()
                      .background(Brush.radialGradient(listOf(Color(0xFF0D1B3D), AC.Bg0))),
                  contentAlignment = Alignment.Center
              ) {
                  Canvas(Modifier.fillMaxSize()) {
                      for (i in 0 until 3) {
                          val ph = (ring + i / 3f) % 1f
                          drawCircle(
                              AC.Cyan.copy(alpha = (1f - ph) * 0.35f),
                              radius = size.height * (0.15f + ph * 0.75f),
                              center = center,
                              style = Stroke(width = 2f)
                          )
                      }
                  }
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      LogoMark(88.dp)
                      Spacer(Modifier.height(6.dp))
                      Row { "ALLCORE".forEachIndexed { i, ch -> SplashLetter(ch, i) } }
                      Text(
                          "Tum emulatorler tek merkezde",
                          color = AC.Muted,
                          fontSize = 13.sp,
                          letterSpacing = 2.sp,
                          modifier = Modifier.graphicsLayer { alpha = sub.value }
                      )
                      Spacer(Modifier.height(16.dp))
                      ProgressBar(prog.value, Modifier.width(220.dp))
                  }
              }
          }
