          enum class BtnKind { Primary, Glass, Danger }

          @Composable
          fun AcButton(
              text: String,
              icon: ImageVector? = null,
              kind: BtnKind = BtnKind.Glass,
              enabled: Boolean = true,
              compact: Boolean = false,
              modifier: Modifier = Modifier,
              onClick: () -> Unit
          ) {
              val inf = rememberInfiniteTransition(label = "btn")
              val shift by inf.animateFloat(
                  0f, 700f,
                  infiniteRepeatable(tween(2800, easing = LinearEasing), RepeatMode.Restart),
                  label = "shift"
              )
              val shape = RoundedCornerShape(50)
              val fg = when (kind) {
                  BtnKind.Primary -> Color.White
                  BtnKind.Glass -> AC.Text
                  BtnKind.Danger -> AC.Danger
              }
              val stroke = when (kind) {
                  BtnKind.Primary -> Color(0x55FFFFFF)
                  BtnKind.Glass -> AC.GlassStroke
                  BtnKind.Danger -> AC.Danger.copy(alpha = 0.6f)
              }
              Box(
                  modifier
                      .bounceClick(enabled = enabled, onClick = onClick)
                      .graphicsLayer { alpha = if (enabled) 1f else 0.4f }
                      .clip(shape)
                      .drawBehind {
                          when (kind) {
                              BtnKind.Primary -> drawRect(
                                  Brush.linearGradient(
                                      listOf(AC.Blue, AC.Cyan, AC.Violet, AC.Blue),
                                      start = Offset(shift, 0f),
                                      end = Offset(shift + 600f, 160f),
                                      tileMode = TileMode.Mirror
                                  )
                              )
                              BtnKind.Glass -> drawRect(Color(0x22FFFFFF))
                              BtnKind.Danger -> drawRect(Color(0x22FF5C6C))
                          }
                      }
                      .border(1.dp, stroke, shape),
                  contentAlignment = Alignment.Center
              ) {
                  Row(
                      Modifier.padding(
                          horizontal = if (compact) 14.dp else 26.dp,
                          vertical = if (compact) 10.dp else 13.dp
                      ),
                      horizontalArrangement = Arrangement.Center,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      if (icon != null) {
                          Icon(icon, null, tint = fg, modifier = Modifier.size(if (compact) 18.dp else 22.dp))
                          Spacer(Modifier.width(if (compact) 6.dp else 10.dp))
                      }
                      Text(
                          text,
                          color = fg,
                          fontWeight = FontWeight.SemiBold,
                          fontSize = if (compact) 12.sp else 15.sp,
                          letterSpacing = 0.4.sp,
                          maxLines = 1,
                          softWrap = false,
                          overflow = TextOverflow.Ellipsis
                      )
                  }
              }
          }

