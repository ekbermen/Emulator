          fun hexPath(cx: Float, cy: Float, r: Float): Path {
              val path = Path()
              for (i in 0 until 6) {
                  val a = Math.toRadians((60 * i - 90).toDouble())
                  val x = cx + r * cos(a).toFloat()
                  val y = cy + r * sin(a).toFloat()
                  if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
              }
              path.close()
              return path
          }

