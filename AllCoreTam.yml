          cat << 'EOF' > app/src/main/java/com/allcore/emulator/util/Sound.kt
          package com.allcore.emulator.util

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.concurrent.thread
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.pow
          import kotlin.math.sin

          private const val RATE = 22050

          private fun staticTrack(data: ShortArray, content: Int): AudioTrack? {
              return try {
                  val t = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_GAME)
                              .setContentType(content)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setSampleRate(RATE)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(data.size * 2)
                      .setTransferMode(AudioTrack.MODE_STATIC)
                      .build()
                  t.write(data, 0, data.size)
                  t
              } catch (e: Throwable) {
                  null
              }
          }

          private fun toPcm(buf: FloatArray, peak: Float): ShortArray {
              var m = 0.0001f
              for (v in buf) m = max(m, abs(v))
              val k = peak * 32767f / m
              return ShortArray(buf.size) { (buf[it] * k).toInt().coerceIn(-32767, 32767).toShort() }
          }

          // Arka plan muzigi: kodla uretilen yumusak ambient pad dongusu
          object AmbientMusic {
              @Volatile private var track: AudioTrack? = null
              @Volatile private var building = false
              @Volatile private var want = false
              @Volatile var volume = 0.5f

              fun start() {
                  want = true
                  val t = track
                  if (t != null) {
                      try {
                          t.setVolume(volume)
                          t.play()
                      } catch (e: Throwable) {
                      }
                      return
                  }
                  if (building) return
                  building = true
                  thread(name = "allcore-music") {
                      try {
                          val data = compose()
                          val nt = staticTrack(data, AudioAttributes.CONTENT_TYPE_MUSIC)
                          if (nt != null) {
                              nt.setLoopPoints(0, data.size, -1)
                              nt.setVolume(volume)
                              track = nt
                              if (want) nt.play()
                          }
                      } catch (e: Throwable) {
                      } finally {
                          building = false
                      }
                  }
              }

              fun pause() {
                  want = false
                  try {
                      track?.pause()
                  } catch (e: Throwable) {
                  }
              }

              fun applyVolume(v: Float) {
                  volume = v
                  try {
                      track?.setVolume(v)
                  } catch (e: Throwable) {
                  }
              }

              private fun compose(): ShortArray {
                  val chordLen = 4 * RATE
                  val total = chordLen * 4
                  val buf = FloatArray(total)
                  val chords = arrayOf(
                      floatArrayOf(110.00f, 164.81f, 220.00f, 261.63f, 329.63f),
                      floatArrayOf(87.31f, 130.81f, 174.61f, 220.00f, 261.63f),
                      floatArrayOf(130.81f, 196.00f, 261.63f, 329.63f, 392.00f),
                      floatArrayOf(98.00f, 146.83f, 196.00f, 246.94f, 293.66f)
                  )
                  val win = chordLen + chordLen / 2
                  for (c in 0 until 4) {
                      val start = c * chordLen
                      for ((ni, f) in chords[c].withIndex()) {
                          val amp = if (ni == 0) 0.9 else 0.55
                          val w = 2.0 * PI * f / RATE
                          val w2 = w * 1.004
                          val lfo = 2.0 * PI * (0.18 + 0.05 * ni) / RATE
                          for (j in 0 until win) {
                              val u = j.toDouble() / win
                              val env = sin(PI * u).pow(2.0)
                              val trem = 1.0 + 0.18 * sin(lfo * j + ni)
                              val s = (sin(w * j) + 0.6 * sin(w2 * j)) * env * trem * amp
                              buf[(start + j) % total] += s.toFloat()
                          }
                      }
                  }
                  val bells = floatArrayOf(659.25f, 783.99f, 880.00f, 987.77f, 1174.66f)
                  val seq = intArrayOf(0, 2, 4, 3, 1, 2, 4, 0)
                  for (b in 0 until 8) {
                      val start = b * (total / 8)
                      val w = 2.0 * PI * bells[seq[b]] / RATE
                      val len = (2.6 * RATE).toInt()
                      for (j in 0 until len) {
                          val t = j.toDouble() / RATE
                          val env = exp(-2.2 * t) * minOf(1.0, j / (RATE * 0.01))
                          buf[(start + j) % total] += (0.22 * sin(w * j) * env).toFloat()
                      }
                  }
                  return toPcm(buf, 0.55f)
              }
          }

          // Arayuz ses efektleri
          object Sfx {
              @Volatile var enabled = true
              @Volatile var volume = 0.6f
              private val tracks = ConcurrentHashMap<String, AudioTrack>()

              private class N(val f: Float, val at: Int, val len: Int, val amp: Float)

              private fun build(name: String, totalMs: Int, notes: List<N>) {
                  val n = RATE * totalMs / 1000
                  val buf = FloatArray(n)
                  for (nt in notes) {
                      val s0 = RATE * nt.at / 1000
                      val l = RATE * nt.len / 1000
                      val w = 2.0 * PI * nt.f / RATE
                      for (j in 0 until l) {
                          val i = s0 + j
                          if (i >= n) break
                          val att = minOf(1.0, j / (RATE * 0.004))
                          val env = att * (1.0 - j.toDouble() / l).pow(2.0)
                          buf[i] += ((sin(w * j) + 0.35 * sin(2 * w * j)) * env * nt.amp).toFloat()
                      }
                  }
                  val t = staticTrack(toPcm(buf, 0.8f), AudioAttributes.CONTENT_TYPE_SONIFICATION)
                  if (t != null) tracks[name] = t
              }

              fun init() {
                  if (tracks.isNotEmpty()) return
                  build("move", 80, listOf(N(1500f, 0, 70, 0.6f), N(2250f, 10, 60, 0.25f)))
                  build("select", 300, listOf(N(523.25f, 0, 140, 0.6f), N(659.25f, 50, 160, 0.6f), N(1046.5f, 100, 200, 0.5f)))
                  build("back", 260, listOf(N(784f, 0, 110, 0.6f), N(523.25f, 70, 120, 0.6f), N(392f, 130, 130, 0.5f)))
                  build("toggle", 160, listOf(N(880f, 0, 80, 0.6f), N(1320f, 50, 100, 0.5f)))
                  build(
                      "boot", 2600,
                      listOf(
                          N(130.81f, 0, 2200, 0.45f),
                          N(261.63f, 0, 1500, 0.5f),
                          N(329.63f, 200, 1500, 0.5f),
                          N(392f, 400, 1600, 0.5f),
                          N(523.25f, 600, 1700, 0.55f),
                          N(659.25f, 900, 1500, 0.4f),
                          N(783.99f, 1200, 1300, 0.35f),
                          N(1046.5f, 1500, 1000, 0.3f),
                          N(1568f, 1700, 800, 0.15f)
                      )
                  )
              }

              private fun play(name: String) {
                  if (!enabled) return
                  val t = tracks[name] ?: return
                  try {
                      t.setVolume(volume)
                      t.stop()
                      t.reloadStaticData()
                      t.play()
                  } catch (e: Throwable) {
                  }
              }

              fun move() = play("move")
              fun select() = play("select")
              fun back() = play("back")
              fun boot() = play("boot")
              fun toggle() = play("toggle")
          }
          EOF

