          cat << 'EOF' > app/src/main/java/com/allcore/emulator/util/PlatformDetector.kt
          package com.allcore.emulator.util

          enum class Platform(
              val display: String,
              val title: String,
              val color: Long,
              val formats: String
          ) {
              PS1("PS1", "PlayStation", 0xFF9FB4D9, "cue, chd, pbp, bin, iso"),
              PSP("PSP", "PlayStation Portable", 0xFF3B82F6, "iso, cso"),
              PS2("PS2", "PlayStation 2", 0xFF4F6BFF, "iso, bin"),
              PS3("PS3", "PlayStation 3", 0xFF8B5CF6, "pkg, iso"),
              NES("NES", "Nintendo Entertainment System", 0xFFEF4444, "nes"),
              SNES("SNES", "Super Nintendo", 0xFFA78BFA, "sfc, smc"),
              GB("GB", "Game Boy", 0xFF84CC16, "gb"),
              GBC("GBC", "Game Boy Color", 0xFFF59E0B, "gbc"),
              GBA("GBA", "Game Boy Advance", 0xFF6366F1, "gba"),
              N64("N64", "Nintendo 64", 0xFF10B981, "n64, z64, v64"),
              NDS("NDS", "Nintendo DS", 0xFF14B8A6, "nds"),
              GAMECUBE("GameCube", "Nintendo GameCube", 0xFF9B7CFF, "gcm, gcz, iso"),
              WII("Wii", "Nintendo Wii", 0xFF38BDF8, "wbfs, rvz, iso"),
              UNKNOWN("Bilinmiyor", "Bilinmeyen platform", 0xFF64748B, "-");

              companion object {
                  fun fromDisplay(s: String): Platform =
                      values().firstOrNull { it.display == s } ?: UNKNOWN
              }
          }

          object PlatformDetector {
              private val gcRegex = Regex("(^|[^a-z])gc([^a-z]|$)")

              fun detect(fileName: String): Platform {
                  val lower = fileName.lowercase()
                  val ext = lower.substringAfterLast('.', "")
                  return when (ext) {
                      "pbp", "cue", "chd" -> Platform.PS1
                      "cso" -> Platform.PSP
                      "nes" -> Platform.NES
                      "sfc", "smc" -> Platform.SNES
                      "gb" -> Platform.GB
                      "gbc" -> Platform.GBC
                      "gba" -> Platform.GBA
                      "n64", "z64", "v64" -> Platform.N64
                      "nds" -> Platform.NDS
                      "gcm", "gcz" -> Platform.GAMECUBE
                      "wbfs", "rvz" -> Platform.WII
                      "pkg" -> Platform.PS3
                      "iso", "bin" -> when {
                          lower.contains("ps2") -> Platform.PS2
                          lower.contains("ps3") -> Platform.PS3
                          lower.contains("gamecube") || gcRegex.containsMatchIn(lower) -> Platform.GAMECUBE
                          lower.contains("wii") -> Platform.WII
                          else -> Platform.PS1
                      }
                      else -> Platform.UNKNOWN
                  }
              }
          }
