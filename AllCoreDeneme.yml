      - name: Fetch libretro cores
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          base=https://buildbot.libretro.com/nightly/android/latest/arm64-v8a
          for c in ppsspp pcsx_rearmed mupen64plus_next_gles3 snes9x mgba fceumm gambatte play melondsds melonds desmume azahar; do
            if curl -fsSL --retry 3 -o /tmp/$c.zip "$base/${c}_libretro_android.so.zip" && unzip -oq /tmp/$c.zip -d /tmp/core_$c; then
              cp /tmp/core_$c/${c}_libretro_android.so app/src/main/jniLibs/arm64-v8a/lib${c}_libretro_android.so
              echo "OK: $c"
            else
              echo "UYARI: $c indirilemedi, bu platform harici emulatorle acilacak"
            fi
          done
          curl -fsSL --retry 3 -o app/src/main/assets/PPSSPP.zip https://buildbot.libretro.com/assets/system/PPSSPP.zip || echo "UYARI: PPSSPP sistem dosyalari indirilemedi"
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllCore-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
