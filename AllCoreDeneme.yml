                  root.addView(p, FrameLayout.LayoutParams(-1, -1))
                  pad = p

                  // NDS / 3DS: bos yere dokunma = alt ekran dokunmatigi (yansima ile, API farkina karsi guvenli)
                  if (Cores.touchScreen(platform)) {
                      gl?.setOnTouchListener { _, ev ->
                          try {
                              val v = gl
                              if (v != null) v.javaClass.getMethod("sendTouchEvent", MotionEvent::class.java).invoke(v, ev)
                          } catch (t: Throwable) {
                          }
                          true
                      }
                  }

                  val mb = TextView(this)
                  mb.text = "\u2630"
                  mb.textSize = 20f
                  mb.setTextColor(Color.WHITE)
