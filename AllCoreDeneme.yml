          import com.allcore.emulator.util.Prefs
          import com.allcore.emulator.util.Sfx
          import com.allcore.emulator.util.toast

          sealed class Screen {
              object Home : Screen()
              object Add : Screen()
              data class Detail(val id: Long) : Screen()
          }

          @Composable
          fun AllCoreApp(vm: GameViewModel) {
              val ctx = LocalContext.current
          val allGames by vm.games.collectAsState()
              val appCtx = androidx.compose.ui.platform.LocalContext.current
              val games = remember(allGames, UiState.profileId, UiState.profileTick) {
                  val pid = UiState.profileId
                  if (pid == null) allGames else allGames.filter { ProfileStore.owns(appCtx, pid, it.id) }
              }
              var splash by remember { mutableStateOf(true) }
              var screen by remember { mutableStateOf<Screen>(Screen.Home) }
              var tab by remember { mutableStateOf(NavTab.values().getOrElse(Prefs.getInt(ctx, "st_tab", 0)) { NavTab.HOME }) }
              var sel by remember { mutableIntStateOf(Prefs.getInt(ctx, "st_sel", 0)) }
              var accent by remember { mutableStateOf(AC.Blue) }
              var musicOn by remember { mutableStateOf(Prefs.music(ctx)) }
              val browser = remember { BrowserHolder() }

              DownloadWatcher(vm)

              // Otomatik kayit: her 5 saniyede ve uygulamadan cikarken
              val owner = LocalLifecycleOwner.current
              DisposableEffect(owner) {
                  val obs = LifecycleEventObserver { _, e ->
                      if (e == Lifecycle.Event.ON_PAUSE) {
                          Prefs.setInt(ctx, "st_sel", sel)
                          Prefs.setInt(ctx, "st_tab", tab.ordinal)
                      }
                  }
                  owner.lifecycle.addObserver(obs)
                  onDispose { owner.lifecycle.removeObserver(obs) }
              }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(5000)
                      Prefs.setInt(ctx, "st_sel", sel)
                      Prefs.setInt(ctx, "st_tab", tab.ordinal)
                  }
              }

              LaunchedEffect(tab, screen) {
                  if (screen == Screen.Home && tab != NavTab.HOME) accent = AC.Blue
              }

              BackHandler(enabled = !splash && (screen != Screen.Home || tab != NavTab.HOME)) {
                  if (screen != Screen.Home) {
                      Sfx.back()
                      screen = Screen.Home
                  } else if (tab == NavTab.BROWSER && browser.webView?.canGoBack() == true) {
                      browser.webView?.goBack()
                  } else {
                      Sfx.back()
                      tab = NavTab.HOME
                  }
              }

              Box(Modifier.fillMaxSize()) {
                  AnimatedBackground(accent)
                  Crossfade(targetState = splash, animationSpec = tween(600), label = "splash") { s ->
                      if (s) {
                          SplashScreen { splash = false }
                      } else if (UiState.profileId == null) {
                          ProfilePicker {
                              UiState.profileId = it
                              ProfileStore.currentId = it
                          }
                      } else {
                          Box(Modifier.fillMaxSize().displayCutoutPadding()) {
                              AnimatedContent(
                                  targetState = screen,
                                  transitionSpec = {
                                      (fadeIn(tween(350)) + scaleIn(tween(350), initialScale = 0.96f)) togetherWith
                                          fadeOut(tween(200))
                                  },
                                  label = "screen"
                              ) { sc ->
                                  when (sc) {
                                      is Screen.Home -> Column(Modifier.fillMaxSize()) {
                                          TopNav(tab, musicOn) { t ->
                                              if (t != tab) {
                                                  Sfx.move()
                                                  tab = t
                                              }
                                          }
                                          Box(Modifier.weight(1f).fillMaxSize()) {
                                              AnimatedContent(
                                                  targetState = tab,
                                                  transitionSpec = {
                                                      (fadeIn(tween(350)) + slideInHorizontally(tween(350)) { it / 10 }) togetherWith
                                                          fadeOut(tween(200))
                                                  },
                                                  label = "tab"
                                              ) { t ->
                                                  when (t) {
                                                      NavTab.HOME -> LibraryScreen(
                                                          games = games,
                                                          selIndex = sel,
                                                          onSel = { sel = it },
                                                          onOpen = { g -> screen = Screen.Detail(g.id) },
                                                          onAdd = { screen = Screen.Add },
                                                          onToggleFav = { g -> vm.updateGame(g.copy(favorite = !g.favorite)) },
                                                          onAccent = { accent = it }
                                                      )
                                                      NavTab.CONSOLES -> ConsolesScreen()
                                                      NavTab.BROWSER -> BrowserScreen(browser)
                                                      NavTab.SETTINGS -> SettingsScreen(vm, games.size) { musicOn = it }
                                                  }
                                              }
                                          }
                                      }
                                      is Screen.Add -> AddGameScreen(
                                          vm = vm,
                                          onBack = { screen = Screen.Home },
                                          onSaved = { id ->
                                              sel = 0
                                              screen = Screen.Detail(id)
                                          },
                                          onAccent = { accent = it }
                                      )
                                      is Screen.Detail -> {
                                          val g = games.firstOrNull { it.id == sc.id }
                                          if (g == null) {
                                              LaunchedEffect(Unit) { screen = Screen.Home }
                                          } else {
                                              GameDetailScreen(
                                                  game = g,
                                                  onBack = { screen = Screen.Home },
                                                  onToggleFav = { vm.updateGame(g.copy(favorite = !g.favorite)) },
                                                  onDelete = {
                                                      vm.deleteGame(g)
                                                      sel = 0
                                                      screen = Screen.Home
                                                      toast(ctx, "Oyun kutuphaneden silindi")
                                                  },
                                                  onAccent = { accent = it }
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
