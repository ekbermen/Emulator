              onAccent: (Color) -> Unit
          ) {
              val ctx = LocalContext.current
              val p = Platform.fromDisplay(game.platform)
              val c = Color(p.color)
              LaunchedEffect(c) { onAccent(c) }
              val tick = rememberResumeTick()
              val bridge = EmulatorRegistry.bridgeFor(p)
              val installed = remember(tick) { bridge?.isInstalled(ctx) ?: false }
              val file = remember(game.filePath) { File(game.filePath) }
              val exists = remember(game.filePath, tick) { file.exists() }
              val sizeText = remember(game.filePath, tick) {
                  if (file.exists()) {
                      val mb = file.length() / (1024.0 * 1024.0)
                      if (mb >= 1024) String.format(Locale.US, "%.2f GB", mb / 1024.0)
                      else String.format(Locale.US, "%.1f MB", mb)
                  } else "-"
              }
              val dateText = remember(game.addedAt) {
                  SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.getDefault()).format(Date(game.addedAt))
              }
              var confirm by remember { mutableStateOf(false) }
              val inf = rememberInfiniteTransition(label = "detail")
              val floatY by inf.animateFloat(
                  -8f, 8f,
                  infiniteRepeatable(tween(2600, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "float"
              )

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader(game.name, onBack = { Sfx.back(); onBack() }) {
