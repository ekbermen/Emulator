              }

              private fun savePad(all: Boolean) {
                  val js = pad?.toJson() ?: return
                  val e = padPrefs().edit()
                  e.putString(padKey(), js)
                  if (all) e.putString("pad_default", js)
                  e.apply()
                  say(if (all) "Tum oyunlar icin kaydedildi" else "Bu oyun icin kaydedildi")
                  setEditing(false)
              }

              private fun setEditing(on: Boolean) {
                  pad?.editing = on
                  editBar?.visibility = if (on) View.VISIBLE else View.GONE
                  menuBtn?.visibility = if (on) View.GONE else View.VISIBLE
                  if (!on) pad?.fromJson(padPrefs().getString(padKey(), null) ?: padPrefs().getString("pad_default", null))
              }

              private fun setTvMode(on: Boolean) {
                  tvMode = on
                  val c = tvCover ?: return
                  if (on) {
                      c.text = "TV'de oynaniyor\n\n" + TvHub.url() + "/tv"
                      c.visibility = View.VISIBLE
                  } else {
                      c.visibility = View.GONE
                  }
                  menuBtn?.bringToFront()
              }

              private fun showMenu() {
                  if (menuOpen) return
                  menuOpen = true
                  val items = ArrayList<String>()
                  val acts = ArrayList<() -> Unit>()
                  fun add(t: String, f: () -> Unit) {
                      items.add(t)
                      acts.add(f)
                  }
                  add("Devam et") {}
                  add("Durumu kaydet") { pickSlot(true) }
                  add("Durumu yukle") { pickSlot(false) }
                  if (pad?.visibility != View.GONE) add("Tuslari duzenle") { setEditing(true) }
                  add(if (recorder != null) "Kaydi durdur" else "Ekran kaydi baslat") { toggleRecord() }
                  add("Ceviri: " + LiveTranslate.names[LiveTranslate.mode]) { pickTranslate() }
                  add("TV'ye baglan (QR tara)") { TvHub.scan(this) { m -> say(m) } }
                  if (TvHub.running) add(if (tvMode) "TV modunu kapat" else "TV modu: telefon sadece kumanda") { setTvMode(!tvMode) }
                  add("Oyundan cik") { finish() }
                  AlertDialog.Builder(this)
                      .setTitle(gameName)
                      .setItems(items.toTypedArray()) { _, i -> acts[i]() }
                      .setOnDismissListener {
                          menuOpen = false
                          hideBars()
                      }
                      .show()
              }

              private fun pickTranslate() {
                  AlertDialog.Builder(this)
                      .setTitle("Canli ceviri (altyazi)")
                      .setItems(LiveTranslate.names) { _, i ->
                          LiveTranslate.mode = i
                          if (i == 0) {
                              sub?.visibility = View.GONE
                              LiveTranslate.release()
                          } else {
                              say("Ilk kullanimda ceviri verisi indirilir (internet gerekir)")
                          }
                      }
                      .show()
              }

              private fun pickSlot(save: Boolean) {
                  AlertDialog.Builder(this)
                      .setTitle(if (save) "Kaydet" else "Yukle")
                      .setItems(arrayOf("Slot 1", "Slot 2", "Slot 3")) { _, i ->
                          if (save) saveState("s$i", true, false) else loadState("s$i", false)
                      }
                      .show()
              }

              // ---------- Girdi ----------
              override fun dispatchKeyEvent(e: KeyEvent): Boolean {
                  if (e.keyCode == KeyEvent.KEYCODE_BACK) {
                      if (e.action == KeyEvent.ACTION_UP) {
                          if (pad?.editing == true) setEditing(false) else showMenu()
                      }
                      return true
                  }
                  val d = e.device
                  val s = e.source
                  val padSrc = (s and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
                      (s and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK
                  if (padSrc && d != null && !d.isVirtual) {
                      gl?.sendKeyEvent(e.action, e.keyCode, 0)
                      if (!TvHub.monitorMode) pad?.visibility = View.INVISIBLE
                      return true
                  }
                  return super.dispatchKeyEvent(e)
              }

              override fun dispatchGenericMotionEvent(e: MotionEvent): Boolean {
                  if ((e.source and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK && e.action == MotionEvent.ACTION_MOVE) {
                      val v = gl
                      if (v != null) {
                          v.sendMotionEvent(GLRetroView.MOTION_SOURCE_ANALOG_LEFT, e.getAxisValue(MotionEvent.AXIS_X), e.getAxisValue(MotionEvent.AXIS_Y), 0)
                          v.sendMotionEvent(GLRetroView.MOTION_SOURCE_ANALOG_RIGHT, e.getAxisValue(MotionEvent.AXIS_Z), e.getAxisValue(MotionEvent.AXIS_RZ), 0)
                          v.sendMotionEvent(GLRetroView.MOTION_SOURCE_DPAD, e.getAxisValue(MotionEvent.AXIS_HAT_X), e.getAxisValue(MotionEvent.AXIS_HAT_Y), 0)
                      }
                      return true
                  }
                  return super.dispatchGenericMotionEvent(e)
              }

              override fun dispatchTouchEvent(e: MotionEvent): Boolean {
                  val p = pad
                  if (p != null && !TvHub.monitorMode && p.visibility == View.INVISIBLE && e.action == MotionEvent.ACTION_DOWN) p.visibility = View.VISIBLE
                  return super.dispatchTouchEvent(e)
              }

              // ---------- Yasam dongusu ----------
              override fun onResume() {
                  super.onResume()
                  hideBars()
              }

              override fun onPause() {
                  // Uygulama kapaninca / arka plana gidince sessizce kaydet
                  saveState("auto", false, true)
                  super.onPause()
              }

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  capH?.removeCallbacksAndMessages(null)
                  capThread?.quitSafely()
                  val r = recorder
                  recorder = null
                  if (r != null) Thread { r.stop() }.start()
                  LiveTranslate.onText = null
                  LiveTranslate.mode = 0
                  LiveTranslate.release()
                  if (TvHub.sink === mySink) TvHub.sink = null
                  TvHub.pushFrame(TvHub.placeholder())
                  if (!TvHub.monitorMode) TvHub.players[0] = null
                  super.onDestroy()
              }
          }
