                  }
                  btn("Kucult") { pad?.resizeSelected(0.9f) }
                  btn("Buyut") { pad?.resizeSelected(1.1f) }
                  btn("Soluk") { pad?.let { it.opacity = it.opacity - 0.1f } }
                  btn("Belirgin") { pad?.let { it.opacity = it.opacity + 0.1f } }
                  btn("Sifirla") { pad?.resetDefaults() }
                  btn("Bu oyun icin kaydet") { savePad(false) }
                  btn("Hepsi icin kaydet") { savePad(true) }
