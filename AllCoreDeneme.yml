                  sb.setTextColor(Color.WHITE)
                  sb.textSize = 17f
                  sb.gravity = Gravity.CENTER
                  sb.setPadding(dp(14), dp(6), dp(14), dp(6))
                  sb.setBackgroundColor(Color.argb(190, 0, 0, 0))
