          package com.allcore.emulator.emulator

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.view.HapticFeedbackConstants
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import org.json.JSONArray
          import org.json.JSONObject
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.min

          enum class PadId { L1, L2, R1, R2, DPAD, STICK, FACE, SELECT, START }

          class PadEl(var x: Float, var y: Float, var s: Float)

          class PadView(ctx: Context) : View(ctx) {

              interface Listener {
                  fun onKey(code: Int, down: Boolean)
                  fun onStick(x: Float, y: Float)
              }

              private class FB(val dx: Float, val dy: Float, val key: Int, val kind: Int)

              var listener: Listener? = null
              var opacity = 1f
                  set(v) {
                      field = v.coerceIn(0.25f, 1f)
                      invalidate()
                  }
              var editing = false
                  set(v) {
                      field = v
                      selected = null
                      releaseAll()
                      invalidate()
                  }
              var selected: PadId? = null
              var swapAB = false
              var passThrough = false

              private fun fk(k: Int): Int {
                  if (!swapAB) return k
                  return when (k) {
                      KeyEvent.KEYCODE_BUTTON_A -> KeyEvent.KEYCODE_BUTTON_B
                      KeyEvent.KEYCODE_BUTTON_B -> KeyEvent.KEYCODE_BUTTON_A
                      KeyEvent.KEYCODE_BUTTON_X -> KeyEvent.KEYCODE_BUTTON_Y
                      KeyEvent.KEYCODE_BUTTON_Y -> KeyEvent.KEYCODE_BUTTON_X
                      else -> k
                  }
              }
              val els = LinkedHashMap<PadId, PadEl>()

              private val cur = HashSet<Int>()
              private var stickPtr = -1
              private var knobX = 0f
              private var knobY = 0f
              private var lastX = 0f
              private var lastY = 0f
              private val d = resources.displayMetrics.density
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeJoin = Paint.Join.ROUND
                  strokeCap = Paint.Cap.ROUND
              }
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  isFakeBoldText = true
              }
              private val rect = RectF()
              private val path = Path()
              private val faceBtns = listOf(
                  FB(0f, -1f, KeyEvent.KEYCODE_BUTTON_X, 0),
                  FB(1f, 0f, KeyEvent.KEYCODE_BUTTON_A, 1),
                  FB(0f, 1f, KeyEvent.KEYCODE_BUTTON_B, 2),
                  FB(-1f, 0f, KeyEvent.KEYCODE_BUTTON_Y, 3)
              )

              init {
                  resetDefaults()
              }

              fun resetDefaults() {
                  els.clear()
                  els[PadId.L2] = PadEl(0.08f, 0.07f, 0.20f)
                  els[PadId.L1] = PadEl(0.08f, 0.19f, 0.20f)
                  els[PadId.R2] = PadEl(0.92f, 0.07f, 0.20f)
                  els[PadId.R1] = PadEl(0.92f, 0.19f, 0.20f)
                  els[PadId.DPAD] = PadEl(0.13f, 0.46f, 0.32f)
                  els[PadId.STICK] = PadEl(0.15f, 0.80f, 0.28f)
                  els[PadId.FACE] = PadEl(0.87f, 0.52f, 0.36f)
                  els[PadId.SELECT] = PadEl(0.43f, 0.91f, 0.15f)
                  els[PadId.START] = PadEl(0.57f, 0.91f, 0.15f)
                  invalidate()
              }

              fun toJson(): String {
                  val o = JSONObject()
                  for ((id, e) in els) o.put(id.name, JSONArray().put(e.x.toDouble()).put(e.y.toDouble()).put(e.s.toDouble()))
                  o.put("o", opacity.toDouble())
                  return o.toString()
              }

              fun fromJson(js: String?) {
                  resetDefaults()
                  if (js == null) return
                  try {
                      val o = JSONObject(js)
                      for (id in PadId.values()) {
                          val a = o.optJSONArray(id.name) ?: continue
                          els[id] = PadEl(a.getDouble(0).toFloat(), a.getDouble(1).toFloat(), a.getDouble(2).toFloat())
                      }
                      opacity = o.optDouble("o", 1.0).toFloat()
                  } catch (e: Exception) {
                      resetDefaults()
                  }
              }

              fun resizeSelected(f: Float) {
                  val e = selected?.let { els[it] } ?: return
                  e.s = (e.s * f).coerceIn(0.08f, 0.6f)
                  invalidate()
              }

              private fun keyOf(id: PadId): Int = when (id) {
                  PadId.L1 -> KeyEvent.KEYCODE_BUTTON_L1
                  PadId.L2 -> KeyEvent.KEYCODE_BUTTON_L2
                  PadId.R1 -> KeyEvent.KEYCODE_BUTTON_R1
                  PadId.R2 -> KeyEvent.KEYCODE_BUTTON_R2
                  PadId.SELECT -> KeyEvent.KEYCODE_BUTTON_SELECT
                  PadId.START -> KeyEvent.KEYCODE_BUTTON_START
                  else -> 0
              }

              private fun releaseAll() {
                  for (k in cur) listener?.onKey(k, false)
                  cur.clear()
                  if (stickPtr != -1) listener?.onStick(0f, 0f)
                  stickPtr = -1
                  knobX = 0f
                  knobY = 0f
              }

              // ---------- cizim ----------
              private fun style(pressed: Boolean) {
                  val a = (255 * opacity).toInt()
                  fill.style = Paint.Style.FILL
                  fill.color = Color.argb(((if (pressed) 125 else 42) * a) / 255, 255, 255, 255)
                  line.strokeWidth = 2f * d
                  line.color = Color.argb((150 * a) / 255, 255, 255, 255)
              }

              private fun label(c: Canvas, s: String, x: Float, y: Float, size: Float) {
                  txt.textSize = size
                  txt.color = Color.argb((225 * opacity).toInt(), 255, 255, 255)
                  c.drawText(s, x, y + size * 0.35f, txt)
              }

              override fun onDraw(c: Canvas) {
                  val m = min(width, height).toFloat()
                  for ((id, e) in els) {
                      val cx = e.x * width
                      val cy = e.y * height
                      val sz = e.s * m
                      when (id) {
                          PadId.L1, PadId.L2, PadId.R1, PadId.R2 -> {
                              style(cur.contains(keyOf(id)))
                              rect.set(cx - sz / 2, cy - sz * 0.25f, cx + sz / 2, cy + sz * 0.25f)
                              c.drawRoundRect(rect, sz * 0.2f, sz * 0.2f, fill)
                              c.drawRoundRect(rect, sz * 0.2f, sz * 0.2f, line)
                              label(c, id.name, cx, cy, sz * 0.22f)
                          }
                          PadId.SELECT, PadId.START -> {
                              style(cur.contains(keyOf(id)))
                              rect.set(cx - sz / 2, cy - sz * 0.18f, cx + sz / 2, cy + sz * 0.18f)
                              c.drawRoundRect(rect, sz * 0.18f, sz * 0.18f, fill)
                              c.drawRoundRect(rect, sz * 0.18f, sz * 0.18f, line)
                              label(c, id.name, cx, cy, sz * 0.17f)
                          }
                          PadId.DPAD -> drawDpad(c, cx, cy, sz)
                          PadId.STICK -> {
                              style(stickPtr != -1)
                              c.drawCircle(cx, cy, sz * 0.5f, fill)
                              c.drawCircle(cx, cy, sz * 0.5f, line)
                              fill.color = Color.argb((120 * opacity).toInt(), 255, 255, 255)
                              c.drawCircle(cx + knobX * sz * 0.28f, cy + knobY * sz * 0.28f, sz * 0.22f, fill)
                              line.color = Color.argb((200 * opacity).toInt(), 255, 255, 255)
                              c.drawCircle(cx + knobX * sz * 0.28f, cy + knobY * sz * 0.28f, sz * 0.22f, line)
                          }
                          PadId.FACE -> for (b in faceBtns) {
                              val bx = cx + b.dx * sz * 0.3f
                              val by = cy + b.dy * sz * 0.3f
                              val pr = cur.contains(fk(b.key))
                              style(pr)
                              c.drawCircle(bx, by, sz * 0.2f, fill)
                              val tint = when (b.kind) { 0 -> Color.rgb(74, 222, 128); 1 -> Color.rgb(255, 92, 108); 2 -> Color.rgb(90, 169, 255); else -> Color.rgb(232, 121, 249) }
                              fill.color = Color.argb(((if (pr) 150 else 55) * opacity).toInt(), Color.red(tint), Color.green(tint), Color.blue(tint))
                              c.drawCircle(bx, by, sz * 0.2f, fill)
                              c.drawCircle(bx, by, sz * 0.2f, line)
                              symbol(c, b.kind, bx, by, sz * 0.2f)
                          }
                      }
                      if (editing && id == selected) {
                          val p = Paint(Paint.ANTI_ALIAS_FLAG)
                          p.style = Paint.Style.STROKE
                          p.strokeWidth = 3f * d
                          p.color = Color.rgb(61, 224, 255)
                          p.pathEffect = DashPathEffect(floatArrayOf(14f, 10f), 0f)
                          c.drawCircle(cx, cy, sz * 0.62f, p)
                      }
                  }
                  if (editing) {
                      txt.textSize = 14f * d
                      txt.color = Color.WHITE
                      c.drawText("Tusu surukle, ustteki cubuktan boyutlandir", width / 2f, height * 0.5f, txt)
                  }
              }

              private fun drawDpad(c: Canvas, cx: Float, cy: Float, sz: Float) {
                  val h = sz / 2
                  val w = sz * 0.17f
                  path.reset()
                  path.moveTo(cx - w, cy - h); path.lineTo(cx + w, cy - h); path.lineTo(cx + w, cy - w)
                  path.lineTo(cx + h, cy - w); path.lineTo(cx + h, cy + w); path.lineTo(cx + w, cy + w)
                  path.lineTo(cx + w, cy + h); path.lineTo(cx - w, cy + h); path.lineTo(cx - w, cy + w)
                  path.lineTo(cx - h, cy + w); path.lineTo(cx - h, cy - w); path.lineTo(cx - w, cy - w)
                  path.close()
                  style(false)
                  c.drawPath(path, fill)
                  c.drawPath(path, line)
                  fill.color = Color.argb((125 * opacity).toInt(), 255, 255, 255)
                  if (cur.contains(KeyEvent.KEYCODE_DPAD_UP)) c.drawRect(cx - w, cy - h, cx + w, cy - w, fill)
                  if (cur.contains(KeyEvent.KEYCODE_DPAD_DOWN)) c.drawRect(cx - w, cy + w, cx + w, cy + h, fill)
                  if (cur.contains(KeyEvent.KEYCODE_DPAD_LEFT)) c.drawRect(cx - h, cy - w, cx - w, cy + w, fill)
                  if (cur.contains(KeyEvent.KEYCODE_DPAD_RIGHT)) c.drawRect(cx + w, cy - w, cx + h, cy + w, fill)
                  fill.color = Color.argb((190 * opacity).toInt(), 255, 255, 255)
                  val t = sz * 0.07f
                  val o = sz * 0.36f
                  tri(c, cx, cy - o, 0f, -t)
                  tri(c, cx, cy + o, 0f, t)
                  tri(c, cx - o, cy, -t, 0f)
                  tri(c, cx + o, cy, t, 0f)
              }

              private fun tri(c: Canvas, x: Float, y: Float, dx: Float, dy: Float) {
                  path.reset()
                  if (dy != 0f) {
                      path.moveTo(x, y + dy); path.lineTo(x - abs(dy), y - dy); path.lineTo(x + abs(dy), y - dy)
                  } else {
                      path.moveTo(x + dx, y); path.lineTo(x - dx, y - abs(dx)); path.lineTo(x - dx, y + abs(dx))
                  }
                  path.close()
                  c.drawPath(path, fill)
              }

              private fun symbol(c: Canvas, kind: Int, x: Float, y: Float, r: Float) {
                  line.strokeWidth = 2.6f * d
                  val a = (235 * opacity).toInt()
                  when (kind) {
                      0 -> {
                          line.color = Color.argb(a, 74, 222, 128)
                          path.reset()
                          path.moveTo(x, y - r * 0.5f); path.lineTo(x + r * 0.5f, y + r * 0.36f); path.lineTo(x - r * 0.5f, y + r * 0.36f)
                          path.close()
                          c.drawPath(path, line)
                      }
                      1 -> {
                          line.color = Color.argb(a, 255, 92, 108)
                          c.drawCircle(x, y, r * 0.45f, line)
                      }
                      2 -> {
                          line.color = Color.argb(a, 90, 169, 255)
                          c.drawLine(x - r * 0.4f, y - r * 0.4f, x + r * 0.4f, y + r * 0.4f, line)
                          c.drawLine(x + r * 0.4f, y - r * 0.4f, x - r * 0.4f, y + r * 0.4f, line)
                      }
                      else -> {
                          line.color = Color.argb(a, 232, 121, 249)
                          c.drawRect(x - r * 0.4f, y - r * 0.4f, x + r * 0.4f, y + r * 0.4f, line)
                      }
                  }
              }

              // ---------- dokunma ----------
              private fun collect(px: Float, py: Float, out: HashSet<Int>) {
                  val m = min(width, height).toFloat()
                  for ((id, e) in els) {
                      val cx = e.x * width
                      val cy = e.y * height
                      val sz = e.s * m
                      when (id) {
                          PadId.L1, PadId.L2, PadId.R1, PadId.R2 ->
                              if (abs(px - cx) < sz * 0.65f && abs(py - cy) < sz * 0.42f) out.add(keyOf(id))
                          PadId.SELECT, PadId.START ->
                              if (abs(px - cx) < sz * 0.7f && abs(py - cy) < sz * 0.4f) out.add(keyOf(id))
                          PadId.DPAD -> {
                              val dx = px - cx
                              val dy = py - cy
                              if (hypot(dx, dy) < sz * 0.62f) {
                                  val t = sz * 0.14f
                                  if (dx < -t) out.add(KeyEvent.KEYCODE_DPAD_LEFT)
                                  if (dx > t) out.add(KeyEvent.KEYCODE_DPAD_RIGHT)
                                  if (dy < -t) out.add(KeyEvent.KEYCODE_DPAD_UP)
                                  if (dy > t) out.add(KeyEvent.KEYCODE_DPAD_DOWN)
                              }
                          }
                          PadId.FACE -> for (b in faceBtns) {
                              if (hypot(px - (cx + b.dx * sz * 0.3f), py - (cy + b.dy * sz * 0.3f)) < sz * 0.3f) out.add(fk(b.key))
                          }
                          PadId.STICK -> {}
                      }
                  }
              }

              private fun updateStick(px: Float, py: Float) {
                  val e = els[PadId.STICK] ?: return
                  val sz = e.s * min(width, height)
                  val r = sz * 0.5f
                  var dx = (px - e.x * width) / r
                  var dy = (py - e.y * height) / r
                  val len = hypot(dx, dy)
                  if (len > 1f) {
                      dx /= len
                      dy /= len
                  }
                  knobX = dx
                  knobY = dy
                  listener?.onStick(dx, dy)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (editing) return editTouch(e)
                  val a = e.actionMasked
                  if (passThrough && a == MotionEvent.ACTION_DOWN && !hitAny(e.x, e.y)) return false
                  if (a == MotionEvent.ACTION_CANCEL) {
                      releaseAll()
                      invalidate()
                      return true
                  }
                  if (a == MotionEvent.ACTION_DOWN || a == MotionEvent.ACTION_POINTER_DOWN) {
                      val i = e.actionIndex
                      val s = els[PadId.STICK]
                      if (stickPtr == -1 && s != null) {
                          val sz = s.s * min(width, height)
                          if (hypot(e.getX(i) - s.x * width, e.getY(i) - s.y * height) < sz * 0.65f) stickPtr = e.getPointerId(i)
                      }
                  }
                  val upId = if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_POINTER_UP) e.getPointerId(e.actionIndex) else -1
                  val now = HashSet<Int>()
                  for (i in 0 until e.pointerCount) {
                      val id = e.getPointerId(i)
                      if (id == upId) continue
                      if (id == stickPtr) {
                          updateStick(e.getX(i), e.getY(i))
                          continue
                      }
                      collect(e.getX(i), e.getY(i), now)
                  }
                  if (upId != -1 && upId == stickPtr) {
                      stickPtr = -1
                      knobX = 0f
                      knobY = 0f
                      listener?.onStick(0f, 0f)
                  }
                  for (k in now) if (!cur.contains(k)) {
                      listener?.onKey(k, true)
                      performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
                  }
                  for (k in cur) if (!now.contains(k)) listener?.onKey(k, false)
                  cur.clear()
                  cur.addAll(now)
                  invalidate()
                  return true
              }

              private fun hitAny(px: Float, py: Float): Boolean {
                  val set = HashSet<Int>()
                  collect(px, py, set)
                  if (set.isNotEmpty()) return true
                  val s = els[PadId.STICK] ?: return false
                  return hypot(px - s.x * width, py - s.y * height) < s.e() * 0.7f
              }

              private fun PadEl.e(): Float = this.s * min(width, height)

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  if (android.os.Build.VERSION.SDK_INT >= 29) systemGestureExclusionRects = listOf(android.graphics.Rect(0, 0, w, h))
              }

              private fun pick(px: Float, py: Float): PadId? {
                  var best: PadId? = null
                  var bd = Float.MAX_VALUE
                  val m = min(width, height).toFloat()
                  for ((id, e) in els) {
                      val dd = hypot(px - e.x * width, py - e.y * height)
                      if (dd < e.s * m * 0.65f && dd < bd) {
                          best = id
                          bd = dd
                      }
                  }
                  return best
              }

              private fun editTouch(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          selected = pick(e.x, e.y)
                          lastX = e.x
                          lastY = e.y
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val s = selected?.let { els[it] }
                          if (s != null) {
                              s.x = (s.x + (e.x - lastX) / width).coerceIn(0.03f, 0.97f)
                              s.y = (s.y + (e.y - lastY) / height).coerceIn(0.05f, 0.97f)
                              lastX = e.x
                              lastY = e.y
                              invalidate()
                          }
                      }
                  }
                  return true
              }
          }
