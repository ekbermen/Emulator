          package com.allcore.emulator.emulator

          import android.content.Context
          import android.graphics.Bitmap
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions
          import com.googlecode.tesseract.android.TessBaseAPI
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.atomic.AtomicBoolean

          // Canli ceviri: ekrandaki yaziyi okur (OCR), cevirir, altyazi olarak gosterir.
          object LiveTranslate {
              // 0 kapali, 1 Rusca>Turkce, 2 Rusca>Ingilizce, 3 Ingilizce>Turkce
              @Volatile var mode = 0
              @Volatile var onText: ((String) -> Unit)? = null
              private val busy = AtomicBoolean(false)
              private var last = ""
              private var lastRun = 0L
              private var tess: TessBaseAPI? = null
              private var tessLang = ""
              private val cache = HashMap<String, com.google.mlkit.nl.translate.Translator>()
              val names = arrayOf("Kapali", "Rusca > Turkce", "Rusca > Ingilizce", "Ingilizce > Turkce")

              fun due(): Boolean = mode != 0 && !busy.get() && System.currentTimeMillis() - lastRun > 2500

              fun feed(ctx: Context, bmp: Bitmap) {
                  if (!busy.compareAndSet(false, true)) return
                  lastRun = System.currentTimeMillis()
                  val copy = bmp.copy(Bitmap.Config.ARGB_8888, false)
                  Thread {
                      try {
                          work(ctx.applicationContext, copy)
                      } catch (e: Throwable) {
                          onText?.invoke("Ceviri hatasi: internet gerekebilir")
                      } finally {
                          copy.recycle()
                          busy.set(false)
                      }
                  }.start()
              }

              fun release() {
                  try {
                      tess?.recycle()
                  } catch (e: Throwable) {
                  }
                  tess = null
                  tessLang = ""
                  last = ""
              }

              private fun download(url: String, f: File) {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  c.instanceFollowRedirects = true
                  val tmp = File(f.parentFile, f.name + ".tmp")
                  c.inputStream.use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                  tmp.renameTo(f)
              }

              private fun work(ctx: Context, bmp: Bitmap) {
                  val src: String
                  val dst: String
                  val ocr: String
                  when (mode) {
                      1 -> { src = TranslateLanguage.RUSSIAN; dst = TranslateLanguage.TURKISH; ocr = "rus" }
                      2 -> { src = TranslateLanguage.RUSSIAN; dst = TranslateLanguage.ENGLISH; ocr = "rus" }
                      else -> { src = TranslateLanguage.ENGLISH; dst = TranslateLanguage.TURKISH; ocr = "eng" }
                  }
                  val dir = File(ctx.filesDir, "ocr")
                  val td = File(dir, "tessdata")
                  td.mkdirs()
                  val tf = File(td, "$ocr.traineddata")
                  if (!tf.exists()) {
                      onText?.invoke("Ceviri verisi indiriliyor...")
                      download("https://github.com/tesseract-ocr/tessdata_fast/raw/main/$ocr.traineddata", tf)
                  }
                  if (tess == null || tessLang != ocr) {
                      release()
                      val t = TessBaseAPI()
                      if (!t.init(dir.absolutePath, ocr)) return
                      tess = t
                      tessLang = ocr
                  }
                  val t = tess ?: return
                  t.setImage(bmp)
                  val text = (t.getUTF8Text() ?: "").replace(Regex("\\s+"), " ").trim()
                  if (text.length < 4 || text == last) return
                  last = text
                  val key = "$src>$dst"
                  val tr = cache.getOrPut(key) {
                      Translation.getClient(TranslatorOptions.Builder().setSourceLanguage(src).setTargetLanguage(dst).build())
                  }
                  Tasks.await(tr.downloadModelIfNeeded(DownloadConditions.Builder().build()))
                  onText?.invoke(Tasks.await(tr.translate(text)))
              }
          }
