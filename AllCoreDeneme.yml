          @Composable
          fun AddGameScreen(
              vm: GameViewModel,
              onBack: () -> Unit,
              onSaved: (Long) -> Unit,
              onAccent: (Color) -> Unit
          ) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var uri by remember { mutableStateOf<Uri?>(null) }
              var fileName by remember { mutableStateOf("") }
              var platform by remember { mutableStateOf(Platform.UNKNOWN) }
              var manual by remember { mutableStateOf(false) }
              var info by remember { mutableStateOf<DiscInfo?>(null) }
              var cover by remember { mutableStateOf<ImageBitmap?>(null) }
              var analyzing by remember { mutableStateOf(false) }
              var saving by remember { mutableStateOf(false) }
              var progress by remember { mutableFloatStateOf(0f) }

              LaunchedEffect(platform) { onAccent(Color(platform.color)) }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u ->
                  if (u != null) {
                      uri = u
                      fileName = FileHelper.queryName(ctx, u)
                      platform = PlatformDetector.detect(fileName)
                      manual = false
                      info = null
                      cover = null
                      val ext = fileName.substringAfterLast('.', "").lowercase()
                      if (ext == "iso" || ext == "bin" || ext == "img" || ext == "gcm") {
                          analyzing = true
                          scope.launch {
                              val r = withContext(Dispatchers.IO) {
                                  try {
                                      ctx.contentResolver.openFileDescriptor(u, "r")?.use { pfd ->
                                          DiscAnalyzer.analyze(FileInputStream(pfd.fileDescriptor).channel)
                                      }
                                  } catch (e: Exception) {
                                      null
                                  }
                              }
                              analyzing = false
                              info = r
                              if (r != null) {
                                  if (!manual) platform = r.platform
                                  cover = r.cover?.let { BitmapFactory.decodeByteArray(it, 0, it.size)?.asImageBitmap() }
                              }
                          }
                      }
                  }
              }

              val inf = rememberInfiniteTransition(label = "add")
              val bob by inf.animateFloat(
                  -10f, 10f,
                  infiniteRepeatable(tween(1800, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "bob"
              )

              val canSave = uri != null && !saving && !analyzing &&
                  (platform != Platform.UNKNOWN || fileName.endsWith(".zip", true))

              val save: () -> Unit = {
                  val u = uri
                  val inf0 = info
                  if (u != null && !saving) {
                      scope.launch {
                          saving = true
                          progress = 0f
                          val result = withContext(Dispatchers.IO) {
                              try {
                                  val dest = FileHelper.uniqueFile(FileHelper.gamesDir(ctx), fileName)
                                  FileHelper.moveFromUri(ctx, u, dest) { pr -> progress = pr }
                                  val f = FileHelper.resolveGameFile(dest)
                                  var cp: String? = null
                                  val cb = inf0?.cover
                                  if (cb != null) {
                                      val dir = File(ctx.filesDir, "covers")
                                      dir.mkdirs()
                                      val cf = File(dir, "c" + System.currentTimeMillis() + ".png")
                                      cf.writeBytes(cb)
                                      cp = cf.absolutePath
                                  }
                                  Pair(f, cp)
                              } catch (e: Exception) {
                                  null
                              }
                          }
                          saving = false
                          if (result == null) {
                              toast(ctx, "Dosya kopyalanamadi")
                          } else {
                              val f = result.first
                              val plat = if (platform == Platform.UNKNOWN) PlatformDetector.detect(f.name) else platform
                              if (plat == Platform.UNKNOWN) {
                                  f.delete()
                                  toast(ctx, "Desteklenmeyen dosya turu")
                              } else {
                                  val title = inf0?.title
                                  val game = Game(
                                      name = if (!title.isNullOrBlank()) title else FileHelper.displayName(f.name),
                                      filePath = f.absolutePath,
                                      platform = plat.display,
                                      coverPath = result.second
                                  )
                                  vm.addGame(game) { id ->
                                      toast(ctx, "Kutuphaneye eklendi")
                                      onSaved(id)
                                  }
                              }
                          }
                      }
                  }
              }

              Column(Modifier.fillMaxSize()) {
                  ScreenHeader("Oyun Ekle", onBack = { Sfx.back(); onBack() })
                  Row(
                      Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .padding(horizontal = 40.dp, vertical = 8.dp),
                      horizontalArrangement = Arrangement.spacedBy(28.dp)
                  ) {
                      Reveal(0, Modifier.weight(1f).fillMaxHeight()) {
                          Column(
                              Modifier
                                  .fillMaxSize()
                                  .glass(RoundedCornerShape(26.dp))
                                  .padding(20.dp),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              val cv = cover
                              if (cv != null) {
                                  Image(
                                      bitmap = cv,
                                      contentDescription = null,
                                      contentScale = ContentScale.Crop,
                                      modifier = Modifier
                                          .size(120.dp)
                                          .graphicsLayer { translationY = bob }
                                          .clip(RoundedCornerShape(18.dp))
                                  )
                              } else {
                                  Icon(
                                      Icons.Rounded.FolderOpen,
                                      null,
                                      tint = AC.Cyan,
                                      modifier = Modifier
                                          .size(64.dp)
                                          .graphicsLayer { translationY = bob }
                                  )
                              }
                              Spacer(Modifier.height(10.dp))
                              Text(
                                  if (analyzing) "Analiz ediliyor..." else "Oyun dosyasini sec",
                                  color = AC.Text, fontSize = 20.sp, fontWeight = FontWeight.Black
                              )
                              Spacer(Modifier.height(4.dp))
                              Text(
                                  "PS1, PS2, PS3, PSP: ISO, CSO, CHD, PBP",
                                  color = AC.Muted,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center
                              )
                              Spacer(Modifier.height(16.dp))
                              AcButton("Dosya Sec", Icons.Rounded.FolderOpen, BtnKind.Primary) {
                                  picker.launch(arrayOf("*/*"))
                              }
                          }
                      }
                      Reveal(120, Modifier.weight(1f).fillMaxHeight()) {
                          Column(
                              Modifier.fillMaxSize().verticalScroll(rememberScrollState()),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              InfoCard("DOSYA", if (fileName.isEmpty()) "Henuz secilmedi" else fileName)
                              val t = info?.title
                              if (!t.isNullOrBlank()) InfoCard("OYUN ADI", t)
                              InfoCard(
                                  "ALGILANAN PLATFORM",
                                  if (analyzing) "Analiz ediliyor..." else if (uri == null) "-" else platform.title
                              )
                              Text("Platformu degistir", color = AC.Muted, fontSize = 12.sp)
                              Row(
                                  Modifier.horizontalScroll(rememberScrollState()),
                                  horizontalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  Platform.values().filter { it != Platform.UNKNOWN }.forEach { pl ->
                                      SelectChip(pl.display, platform == pl, Color(pl.color)) {
                                          platform = pl
                                          manual = true
                                      }
                                  }
                              }
                              if (saving) {
                                  Text(
                                      "Kopyalaniyor %" + (progress * 100).toInt(),
                                      color = AC.Cyan,
                                      fontSize = 12.sp
                                  )
                                  ProgressBar(progress, Modifier.fillMaxWidth())
                              }
                              AcButton(
                                  "Kutuphaneye Ekle",
                                  Icons.Rounded.Add,
                                  BtnKind.Primary,
                                  enabled = canSave,
                                  modifier = Modifier.fillMaxWidth()
                              ) { save() }
                              Spacer(Modifier.height(8.dp))
                          }
                      }
                  }
              }
          }
