                              fontWeight = FontWeight.Bold,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                  }
              }
          }

          enum class NavTab(val label: String, val icon: ImageVector) {
              HOME("Oyunlar", Icons.Rounded.SportsEsports),
              CONSOLES("Konsollar", Icons.Rounded.Memory),
              BROWSER("Tarayici", Icons.Rounded.Language),
              SETTINGS("Ayarlar", Icons.Rounded.Settings)
          }

          @Composable
          fun MiniLogo(logoSize: Dp) {
              val inf = rememberInfiniteTransition(label = "mini")
              val rot by inf.animateFloat(
                  0f, 360f,
                  infiniteRepeatable(tween(8000, easing = LinearEasing)),
                  label = "rot"
              )
              Canvas(Modifier.size(logoSize)) {
                  val r = this.size.minDimension / 2f
                  rotate(rot, center) {
                      drawPath(
                          hexPath(center.x, center.y, r * 0.9f),
                          Brush.linearGradient(listOf(AC.Cyan, AC.Blue)),
                          style = Stroke(width = r * 0.18f)
                      )
                  }
                  drawPath(hexPath(center.x, center.y, r * 0.45f), AC.Blue)
              }
          }

          @Composable
          fun EqBars(active: Boolean) {
              val inf = rememberInfiniteTransition(label = "eq")
              val durations = listOf(520, 380, 640, 450)
              Row(
                  Modifier.height(18.dp),
                  verticalAlignment = Alignment.Bottom,
                  horizontalArrangement = Arrangement.spacedBy(3.dp)
              ) {
                  durations.forEachIndexed { i, d ->
                      val h by inf.animateFloat(
                          0.25f, 1f,
                          infiniteRepeatable(tween(d, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                          label = "eq$i"
                      )
                      Box(
                          Modifier
                              .width(3.dp)
                              .fillMaxHeight(if (active) h else 0.2f)
                              .clip(RoundedCornerShape(2.dp))
                              .background(AC.Cyan)
                      )
                  }
              }
          }

          @Composable
          fun Clock() {
              val fmt = remember { SimpleDateFormat("HH:mm", Locale.getDefault()) }
              var t by remember { mutableStateOf(fmt.format(Date())) }
              LaunchedEffect(Unit) {
                  while (true) {
                      t = fmt.format(Date())
                      delay(1000)
                  }
              }
              Text(t, color = AC.Text, fontSize = 18.sp, fontWeight = FontWeight.SemiBold, letterSpacing = 1.sp)
          }

          @Composable
          fun NavItem(tab: NavTab, selected: Boolean, onClick: () -> Unit) {
              val bg by animateColorAsState(
                  if (selected) Color(0x33FFFFFF) else Color.Transparent,
                  tween(300), label = "navBg"
              )
              val tint by animateColorAsState(if (selected) AC.Cyan else AC.Muted, tween(300), label = "navTint")
              Row(
                  Modifier
                      .bounceClick(onClick = onClick)
                      .clip(RoundedCornerShape(50))
                      .background(bg)
                      .padding(horizontal = 14.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Icon(tab.icon, null, tint = tint, modifier = Modifier.size(20.dp))
                  AnimatedVisibility(visible = selected) {
                      Text(
                          tab.label,
                          Modifier.padding(start = 8.dp),
                          color = AC.Text,
                          fontSize = 13.sp,
                          fontWeight = FontWeight.SemiBold,
                          maxLines = 1,
                          softWrap = false
                      )
                  }
              }
          }

          @Composable
          fun TopNav(current: NavTab, musicOn: Boolean, onTab: (NavTab) -> Unit) {
              Row(
                  Modifier.fillMaxWidth().padding(horizontal = 32.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  MiniLogo(24.dp)
                  Spacer(Modifier.width(8.dp))
                  Text("ALL", color = AC.Text, fontSize = 16.sp, fontWeight = FontWeight.Black, letterSpacing = 3.sp)
                  Text("CORE", color = AC.Cyan, fontSize = 16.sp, fontWeight = FontWeight.Black, letterSpacing = 3.sp)
                  Spacer(Modifier.weight(1f))
                  Row(
                      Modifier.clip(RoundedCornerShape(50)).background(Color(0x14FFFFFF)).padding(4.dp),
                      horizontalArrangement = Arrangement.spacedBy(2.dp)
                  ) {
                      NavTab.values().forEach { t -> NavItem(t, t == current) { onTab(t) } }
                  }
                  Spacer(Modifier.weight(1f))
                  EqBars(musicOn)
                  Spacer(Modifier.width(14.dp))
                  Clock()
              }
          }
