              var connected by remember { mutableStateOf(false) }
              LaunchedEffect(UiState.monitorOn) {
                  if (UiState.monitorOn) {
                      TvHub.start(ctx)
                      TvHub.monitorMode = true
                      while (UiState.monitorOn) {
                          connected = TvHub.players.any { it != null }
                          delay(400)
                      }
                  } else {
                      TvHub.monitorMode = false
                      connected = false
                  }
              }
              if (UiState.monitorOn && !connected) MonitorOverlay()
          }

          @Composable
          fun MonitorOverlay() {
              val url = remember(UiState.monitorOn) { TvHub.url() + "/pad" }
              val qr = remember(url) { Qr.make(url, 640) }
              Box(
                  Modifier.fillMaxSize()
                      .background(Brush.linearGradient(listOf(AC.Bg0, AC.Bg1, Color(0xFF1B1140)))),
                  contentAlignment = Alignment.Center
              ) {
                  Row(Modifier.displayCutoutPadding().padding(24.dp), verticalAlignment = Alignment.CenterVertically) {
                      Image(
                          bitmap = qr.asImageBitmap(),
                          contentDescription = null,
                          modifier = Modifier.size(230.dp).clip(RoundedCornerShape(18.dp)).background(Color.White).padding(10.dp)
                      )
                      Spacer(Modifier.width(30.dp))
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text("MONITOR MODU", color = AC.Cyan, fontSize = 26.sp, fontWeight = FontWeight.Black, letterSpacing = 3.sp)
                          Text("Diger telefonla bu QR'i okut", color = AC.Text, fontSize = 18.sp)
                          Text("Kumanda otomatik acilir, bu ekran oyun ekrani olur.", color = AC.Muted, fontSize = 13.sp)
                          Text("Elle: $url", color = AC.Muted, fontSize = 12.sp)
                          Text("Ayni Wi-Fi veya hotspot gerekir, internet gerekmez.", color = AC.Muted, fontSize = 12.sp)
                          Spacer(Modifier.height(6.dp))
                          AcButton("Monitor modunu kapat", null, BtnKind.Glass, compact = true) { UiState.monitorOn = false }
                      }
                  }
              }
          }
          EOF

