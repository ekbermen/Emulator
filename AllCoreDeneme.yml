          // Telefon = oyun sunucusu. TV / bilgisayar tarayicisi goruntuyu izler,
          // diger telefonlar tarayicidan kumanda olur (en fazla 4 oyuncu).
          object TvHub {
              const val PORT = 8765

              interface Sink {
                  fun key(port: Int, code: Int, down: Boolean)
                  fun stick(port: Int, x: Float, y: Float)
              }

              @Volatile var sink: Sink? = null
              @Volatile var gameName: String = ""
              @Volatile var running = false
              @Volatile var monitorMode = false
              val players = arrayOfNulls<String>(4)

              private val KEYS = intArrayOf(
                  KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_DPAD_RIGHT,
                  KeyEvent.KEYCODE_BUTTON_B, KeyEvent.KEYCODE_BUTTON_A, KeyEvent.KEYCODE_BUTTON_Y, KeyEvent.KEYCODE_BUTTON_X,
                  KeyEvent.KEYCODE_BUTTON_L1, KeyEvent.KEYCODE_BUTTON_L2, KeyEvent.KEYCODE_BUTTON_R1, KeyEvent.KEYCODE_BUTTON_R2,
                  KeyEvent.KEYCODE_BUTTON_START, KeyEvent.KEYCODE_BUTTON_SELECT
              )

              private val viewers = AtomicInteger(0)
              @Volatile private var lastPoll = 0L
              @Volatile private var frame: ByteArray = ByteArray(0)
              @Volatile private var seq = 0L
              private var server: ServerSocket? = null
              private val pool = Executors.newCachedThreadPool()
              private var app: Context? = null
              private val main = Handler(Looper.getMainLooper())

              fun viewerCount(): Int = viewers.get() + (if (System.currentTimeMillis() - lastPoll < 3000) 1 else 0)

              fun pushFrame(b: ByteArray) {
                  frame = b
                  seq++
              }

              fun url(): String = "http://${localIp() ?: "?"}:$PORT"

              @Synchronized
              fun start(ctx: Context): Boolean {
                  app = ctx.applicationContext
                  if (running) return true
                  return try {
                      val ss = ServerSocket()
                      ss.reuseAddress = true
                      ss.bind(InetSocketAddress(PORT))
                      server = ss
                      running = true
                      if (frame.isEmpty()) frame = placeholder()
                      val t = Thread {
                          while (running) {
                              try {
                                  val s = ss.accept()
                                  pool.execute { handle(s) }
                              } catch (e: Exception) {
                                  if (ss.isClosed) break
                              }
                          }
                      }
                      t.isDaemon = true
                      t.start()
                      true
                  } catch (e: Exception) {
                      running = false
                      false
                  }
              }

              @Synchronized
              fun stop() {
                  running = false
                  try {
                      server?.close()
                  } catch (e: Exception) {
                  }
                  server = null
                  for (i in players.indices) players[i] = null
                  monitorMode = false
              }

