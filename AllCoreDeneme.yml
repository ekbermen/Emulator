          private class AppEntry(val label: String, val pkg: String)

          private fun loadApps(ctx: Context): List<AppEntry> {
              val pm = ctx.packageManager
              val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(i, 0)
                  .map { AppEntry(it.loadLabel(pm).toString(), it.activityInfo.packageName) }
                  .filter { it.pkg != ctx.packageName }
                  .distinctBy { it.pkg }
                  .sortedBy { it.label.lowercase() }
          }

          private fun saveIcon(ctx: Context, pkg: String): String? {
              return try {
                  val bmp = ctx.packageManager.getApplicationIcon(pkg).toBitmap(256, 256)
                  val d = File(ctx.filesDir, "covers")
                  d.mkdirs()
                  val f = File(d, "app_$pkg.png")
                  f.outputStream().use { bmp.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, it) }
                  f.absolutePath
              } catch (e: Exception) {
                  null
              }
          }

