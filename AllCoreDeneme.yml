          package com.allcore.emulator.emulator

          import android.app.ActivityManager
          import android.content.Context
          import android.os.Build
          import com.allcore.emulator.util.Platform
          import com.allcore.emulator.util.Prefs
          import java.io.File

          object Cores {
              private val names = mapOf(
                  Platform.PSP to listOf("ppsspp"),
                  Platform.PS1 to listOf("pcsx_rearmed"),
                  Platform.PS2 to listOf("play"),
                  Platform.N64 to listOf("mupen64plus_next_gles3"),
                  Platform.SNES to listOf("snes9x"),
                  Platform.GBA to listOf("mgba"),
                  Platform.NES to listOf("fceumm"),
                  Platform.GB to listOf("gambatte"),
                  Platform.GBC to listOf("gambatte"),
                  Platform.NDS to listOf("melondsds", "melonds", "desmume"),
                  Platform.N3DS to listOf("azahar")
              )

              fun libFile(ctx: Context, p: Platform): String? {
                  val dir = ctx.applicationInfo.nativeLibraryDir
                  for (n in names[p] ?: return null) {
                      val f = "lib${n}_libretro_android.so"
                      if (File(dir, f).exists()) return f
                  }
                  return null
              }

              fun available(ctx: Context, p: Platform): Boolean = libFile(ctx, p) != null
              fun experimental(p: Platform): Boolean = p == Platform.PS2 || p == Platform.N3DS
              fun touchScreen(p: Platform): Boolean = p == Platform.NDS || p == Platform.N3DS
          }

          object Perf {
              // 0 otomatik, 1 dusuk, 2 yuksek
              fun low(ctx: Context): Boolean {
                  return when (Prefs.getInt(ctx, "perf_mode", 0)) {
                      1 -> true
                      2 -> false
                      else -> {
                          val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                          am.isLowRamDevice || am.memoryClass < 192 || Build.VERSION.SDK_INT < 28
                      }
                  }
              }
