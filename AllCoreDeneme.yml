          <img id="v" alt="">
          <div id="hud"><b>ALLCORE</b> <span id="game"></span><div id="pl"></div><div id="url"></div><img id="qr" width="150" height="150" alt=""></div>
          <script>
          (function(){
          var v=document.getElementById('v'),hud=document.getElementById('hud');
          var pl=document.getElementById('pl'),url=document.getElementById('url'),qr=document.getElementById('qr'),game=document.getElementById('game');
          var mode='mjpeg',n=0,hideT=null,lastCount=-1;
          function next(){v.src='/frame.jpg?'+(n++);}
          function poll(){v.onload=function(){setTimeout(next,25);};v.onerror=function(){setTimeout(next,800);};next();}
          v.onerror=function(){if(mode==='mjpeg'){mode='poll';poll();}};
          v.src='/stream';
          setTimeout(function(){if(mode==='mjpeg'&&!(v.naturalWidth>0)){mode='poll';poll();}},3500);
          function showHud(ms){hud.style.display='block';if(hideT)clearTimeout(hideT);if(ms>0)hideT=setTimeout(function(){hud.style.display='none';},ms);}
          var padUrl='http://'+location.host+'/pad';
          url.innerHTML='Kumanda icin telefondan ac:<br>'+padUrl;
          qr.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=0&data='+encodeURIComponent(padUrl);
          function render(o){
            var h='',c=0,i;
            game.innerHTML=o.game?('- '+o.game):'';
            for(i=0;i<4;i++){
              if(o.players[i]){c++;h+='<div class="on">P'+(i+1)+' - '+o.players[i]+'</div>';}
              else h+='<div class="p">P'+(i+1)+' - bos</div>';
            }
            pl.innerHTML=h;
            if(c!==lastCount){lastCount=c;showHud(20000);}
          }
          function info(){
            var x=new XMLHttpRequest();
            x.open('GET','/info?'+(new Date().getTime()));
            x.onreadystatechange=function(){if(x.readyState===4&&x.status===200){try{render(JSON.parse(x.responseText));}catch(e){}}};
            x.send();
          }
          setInterval(info,2000);info();showHud(25000);
          document.onkeydown=function(){showHud(hud.style.display==='none'?15000:1);};
          })();
