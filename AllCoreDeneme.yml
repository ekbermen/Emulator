                          fontWeight = FontWeight.Black
                      )
                  }
                  Box(
                      Modifier
                          .fillMaxSize()
                          .background(Brush.linearGradient(listOf(Color.White.copy(alpha = 0.16f), Color.Transparent), end = Offset(260f, 260f)))
                  )
                  Text(
                      p.display,
                      Modifier
                          .align(Alignment.TopStart)
                          .padding(if (big) 14.dp else 7.dp)
                          .clip(RoundedCornerShape(50))
                          .background(Color(0x66000000))
                          .padding(horizontal = 8.dp, vertical = 2.dp),
                      color = Color.White,
                      fontSize = if (big) 12.sp else 9.sp,
