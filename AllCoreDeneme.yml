          cat << 'EOF' > app/src/main/assets/pad.html
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>AllCore Kumanda</title>
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
          <style>
          *{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
          html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}
          #shell{position:absolute;left:1.5%;right:1.5%;top:2%;bottom:2%;border-radius:7vmin;background:linear-gradient(135deg,#2F7BFF 0%,#7A5CFF 55%,#E879F9 100%);box-shadow:0 0 6vmin rgba(122,92,255,.55),inset 0 0 0 1.2vmin rgba(255,255,255,.14)}
          .b{position:absolute;box-sizing:border-box;border:.5vmin solid rgba(255,255,255,.85);background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:3.4vmin;border-radius:2.4vmin;box-shadow:0 .8vmin 1.6vmin rgba(0,0,0,.28);transition:background .04s}
          .on{background:rgba(255,255,255,.88)!important;color:#1b1140!important;transform:scale(.96)}
          .r{border-radius:50%}
          #l2{left:4%;top:5%;width:22vmin;height:11vmin}#l1{left:4%;top:19%;width:22vmin;height:11vmin}
          #r2{right:4%;top:5%;width:22vmin;height:11vmin}#r1{right:4%;top:19%;width:22vmin;height:11vmin}
          #up{left:calc(6% + 12vmin);top:36%;width:12vmin;height:13vmin}
          #dn{left:calc(6% + 12vmin);top:calc(36% + 25vmin);width:12vmin;height:13vmin}
          #lf{left:6%;top:calc(36% + 12vmin);width:13vmin;height:13vmin}
          #rt{left:calc(6% + 24vmin);top:calc(36% + 12vmin);width:13vmin;height:13vmin}
          #fy{right:calc(6% + 13vmin);top:34%;width:12.5vmin;height:12.5vmin;background:rgba(74,222,128,.55)}
          #fb{right:6%;top:calc(34% + 13vmin);width:12.5vmin;height:12.5vmin;background:rgba(255,92,108,.55)}
          #fa{right:calc(6% + 13vmin);top:calc(34% + 26vmin);width:12.5vmin;height:12.5vmin;background:rgba(90,169,255,.55)}
          #fx{right:calc(6% + 26vmin);top:calc(34% + 13vmin);width:12.5vmin;height:12.5vmin;background:rgba(255,255,255,.3)}
          #sel{left:37%;bottom:6%;width:12vmin;height:6.5vmin;font-size:2.4vmin}
          #sta{left:51%;bottom:6%;width:12vmin;height:6.5vmin;font-size:2.4vmin}
          #stick{left:8%;bottom:6%;width:30vmin;height:30vmin;border:.5vmin solid rgba(255,255,255,.85);border-radius:50%;background:rgba(255,255,255,.16)}
          #knob{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin 0 0 -6.5vmin;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 .8vmin 1.6vmin rgba(0,0,0,.3)}
          #st{position:absolute;left:50%;top:5%;margin-left:-20vmin;width:40vmin;text-align:center;font-size:3vmin;color:#fff;font-weight:bold}
          #fs{position:absolute;left:50%;top:11%;margin-left:-8vmin;width:16vmin;text-align:center;font-size:2.4vmin;padding:1vmin;border:1px solid rgba(255,255,255,.7);border-radius:3vmin}
          #rot{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:9;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
          @media (orientation:portrait){#rot{display:flex}}
          </style></head><body>
          <div id="rot">Telefonu yatay cevir</div>
          <div id="shell"></div><div id="st">Baglaniyor...</div><div id="fs">Tam ekran</div>
          <div class="b" id="l2" data-bit="9">L2</div><div class="b" id="l1" data-bit="8">L1</div>
          <div class="b" id="r2" data-bit="11">R2</div><div class="b" id="r1" data-bit="10">R1</div>
          <div class="b" id="up" data-bit="0">&#9650;</div><div class="b" id="dn" data-bit="1">&#9660;</div>
          <div class="b" id="lf" data-bit="2">&#9664;</div><div class="b" id="rt" data-bit="3">&#9654;</div>
          <div class="b r" id="fy" data-bit="7" style="color:#4ADE80">&#9651;</div>
          <div class="b r" id="fb" data-bit="5" style="color:#FF5C6C">&#9675;</div>
          <div class="b r" id="fa" data-bit="4" style="color:#5AA9FF">&#10005;</div>
          <div class="b r" id="fx" data-bit="6" style="color:#E879F9">&#9633;</div>
          <div class="b" id="sel" data-bit="13">SELECT</div><div class="b" id="sta" data-bit="12">START</div>
          <div id="stick" class="b" style="border-radius:50%"><div id="knob"></div></div>
          <script>
          (function(){
          var ws,mask=0,lx=0,ly=0,sent='',stickId=null,i;
          var st=document.getElementById('st'),stickEl=document.getElementById('stick'),knob=document.getElementById('knob');
          var els=document.querySelectorAll('[data-bit]');
          document.getElementById('shell').addEventListener('touchstart',function(e){e.preventDefault();},false);
          function say(t){st.innerHTML=t;}
          function connect(){
            ws=new WebSocket('ws://'+location.host+'/ws');
            ws.onopen=function(){ws.send('hello:Telefon');};
            ws.onmessage=function(e){
              var m=e.data;
              if(m.indexOf('id:')===0){say('Oyuncu '+(parseInt(m.substr(3),10)+1)+' hazir');}
              else if(m==='full'){say('Oda dolu (en fazla 4 kisi)');}
            };
            ws.onclose=function(){say('Baglanti koptu, yeniden deniyor...');setTimeout(connect,1500);};
          }
          function send(){
            var s='s:'+mask+':'+lx.toFixed(2)+':'+ly.toFixed(2);
            if(s!==sent&&ws&&ws.readyState===1){ws.send(s);sent=s;}
          }
          function bitOf(el){
            while(el&&el.getAttribute){var b=el.getAttribute('data-bit');if(b!==null)return parseInt(b,10);el=el.parentNode;}
            return -1;
          }
          function upd(e){
            e.preventDefault();
            var m=0,ts=e.touches,found=false,r=stickEl.getBoundingClientRect(),R=r.width/2,cx=r.left+R,cy=r.top+R,t,b,dx,dy,len;
            for(i=0;i<ts.length;i++){
              t=ts[i];
              if(stickId===null&&Math.sqrt(Math.pow(t.clientX-cx,2)+Math.pow(t.clientY-cy,2))<R*1.25){stickId=t.identifier;}
              if(t.identifier===stickId){
                dx=(t.clientX-cx)/R;dy=(t.clientY-cy)/R;len=Math.sqrt(dx*dx+dy*dy);
                if(len>1){dx/=len;dy/=len;}
                lx=dx;ly=dy;found=true;
                knob.style.webkitTransform=knob.style.transform='translate('+(dx*R*0.45)+'px,'+(dy*R*0.45)+'px)';
                continue;
              }
              b=bitOf(document.elementFromPoint(t.clientX,t.clientY));
              if(b>=0)m|=(1<<b);
            }
            if(!found){stickId=null;lx=0;ly=0;knob.style.webkitTransform=knob.style.transform='translate(0,0)';}
            if(m!==mask&&navigator.vibrate&&(m&~mask))navigator.vibrate(8);
            mask=m;
            for(i=0;i<els.length;i++){
              if(mask&(1<<parseInt(els[i].getAttribute('data-bit'),10)))els[i].classList.add('on');else els[i].classList.remove('on');
            }
            send();
          }
          document.addEventListener('touchstart',upd,false);
          document.addEventListener('touchmove',upd,false);
          document.addEventListener('touchend',upd,false);
          document.addEventListener('touchcancel',upd,false);
          document.getElementById('fs').onclick=function(){var d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d);};
          connect();
          })();
          </script></body></html>
          EOF

