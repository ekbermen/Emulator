          class BrowserHolder {
              var webView: WebView? = null
              var url by mutableStateOf("")
              var progress by mutableFloatStateOf(0f)
              var loading by mutableStateOf(false)
              var canBack by mutableStateOf(false)
              var canForward by mutableStateOf(false)
