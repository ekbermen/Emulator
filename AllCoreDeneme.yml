          package com.allcore.emulator.util

          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import org.json.JSONArray
          import org.json.JSONObject

          object UiState {
              var monitorOn by mutableStateOf(false)
              var profileId by mutableStateOf<Int?>(null)
              var profileTick by mutableIntStateOf(0)
          }

          class Profile(val id: Int, val name: String, val avatar: String)

          // Kullanicilar (en fazla 4): sadece isim + avatar. Her kullanicinin kendi oyun listesi ve kayitlari var.
          object ProfileStore {
              const val MAX = 4
              @Volatile var currentId: Int = -1

              private fun sp(c: Context) = c.applicationContext.getSharedPreferences("allcore_profiles", Context.MODE_PRIVATE)

              fun all(c: Context): List<Profile> {
                  val out = ArrayList<Profile>()
                  try {
                      val a = JSONArray(sp(c).getString("list", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Profile(o.getInt("id"), o.getString("name"), o.getString("av")))
                      }
                  } catch (e: Exception) {
                  }
                  return out
              }

              private fun save(c: Context, l: List<Profile>) {
                  val a = JSONArray()
                  for (p in l) a.put(JSONObject().put("id", p.id).put("name", p.name).put("av", p.avatar))
                  sp(c).edit().putString("list", a.toString()).apply()
              }

              fun add(c: Context, name: String, avatar: String): Profile? {
                  val l = all(c)
                  if (l.size >= MAX || name.isBlank()) return null
                  val id = (l.maxOfOrNull { it.id } ?: 0) + 1
                  val p = Profile(id, name.trim().take(14), avatar)
                  save(c, l + p)
                  return p
              }

              fun remove(c: Context, id: Int) {
                  save(c, all(c).filter { it.id != id })
                  sp(c).edit().remove("g$id").apply()
              }

              fun get(c: Context, id: Int?): Profile? = all(c).firstOrNull { it.id == id }

              fun assign(c: Context, pid: Int, gameId: Long) {
                  if (pid < 0) return
                  val s = HashSet(sp(c).getStringSet("g$pid", emptySet()) ?: emptySet())
                  s.add(gameId.toString())
                  sp(c).edit().putStringSet("g$pid", s).apply()
              }

              fun owns(c: Context, pid: Int, gameId: Long): Boolean {
                  val mine = sp(c).getStringSet("g$pid", emptySet()) ?: emptySet()
                  if (mine.contains(gameId.toString())) return true
                  // Kimseye atanmamis (eski) oyunlar ilk kullaniciya aittir
                  val list = all(c)
                  for (p in list) {
                      if (p.id != pid && (sp(c).getStringSet("g${p.id}", emptySet()) ?: emptySet()).contains(gameId.toString())) return false
                  }
                  return list.firstOrNull()?.id == pid
              }
          }
