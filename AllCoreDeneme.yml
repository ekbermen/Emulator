          package com.allcore.emulator.util

          import java.nio.ByteBuffer
          import java.nio.channels.FileChannel

          class DiscInfo(val platform: Platform, val title: String?, val cover: ByteArray?)

          // ISO9660 disk imajini okuyup platformu, oyun adini ve kapak resmini cikarir
          object DiscAnalyzer {
              private class Rec(val name: String, val lba: Long, val size: Long, val dir: Boolean)
              private class Lay(val ss: Int, val off: Int)

              private fun rd(ch: FileChannel, pos: Long, len: Int): ByteArray {
                  val b = ByteBuffer.allocate(len)
                  var p = pos
                  while (b.hasRemaining()) {
                      val n = ch.read(b, p)
                      if (n <= 0) break
                      p += n
                  }
                  return b.array().copyOf(b.position())
              }

              private fun le32(b: ByteArray, o: Int): Long {
                  var r = 0L
                  for (i in 3 downTo 0) r = (r shl 8) or (b[o + i].toLong() and 0xFF)
                  return r
              }

              private fun be32(b: ByteArray, o: Int): Long {
                  var r = 0L
                  for (i in 0..3) r = (r shl 8) or (b[o + i].toLong() and 0xFF)
                  return r
              }

              private fun data(ch: FileChannel, l: Lay, lba: Long, bytes: Int): ByteArray {
                  val out = ByteArray(bytes)
                  var done = 0
                  var s = 0L
                  while (done < bytes) {
                      val chunk = rd(ch, (lba + s) * l.ss + l.off, 2048)
                      if (chunk.isEmpty()) break
                      val n = minOf(chunk.size, bytes - done)
                      System.arraycopy(chunk, 0, out, done, n)
                      done += n
                      s++
                  }
                  return out.copyOf(done)
              }

              private fun list(ch: FileChannel, l: Lay, lba: Long, size: Long): List<Rec> {
                  val d = data(ch, l, lba, size.coerceIn(0L, 65536L).toInt())
                  val out = ArrayList<Rec>()
                  var i = 0
                  while (i + 34 <= d.size) {
                      val len = d[i].toInt() and 0xFF
                      if (len == 0) {
                          i = (i / 2048 + 1) * 2048
                          continue
                      }
                      val nl = d[i + 32].toInt() and 0xFF
                      if (i + 33 + nl <= d.size && (nl > 1 || (nl == 1 && d[i + 33].toInt() > 1))) {
                          val name = String(d, i + 33, nl, Charsets.ISO_8859_1).substringBefore(';')
                          val isDir = (d[i + 25].toInt() and 2) != 0
                          out.add(Rec(name, le32(d, i + 2), le32(d, i + 10), isDir))
                      }
                      i += len
                  }
                  return out
              }

              private fun file(ch: FileChannel, l: Lay, r: Rec, max: Int): ByteArray =
                  data(ch, l, r.lba, minOf(r.size, max.toLong()).toInt())

              private fun sfoTitle(b: ByteArray): String? {
                  if (b.size < 20 || b[1] != 'P'.code.toByte()) return null
                  val kt = le32(b, 8).toInt()
                  val dt = le32(b, 12).toInt()
                  val n = le32(b, 16).toInt()
                  for (i in 0 until n) {
                      val e = 20 + i * 16
                      if (e + 16 > b.size) break
                      val ko = (b[e].toInt() and 0xFF) or ((b[e + 1].toInt() and 0xFF) shl 8)
                      val len = le32(b, e + 4).toInt()
                      val doff = le32(b, e + 12).toInt()
                      val k = kt + ko
                      var end = k
                      while (end < b.size && b[end].toInt() != 0) end++
                      if (String(b, k, end - k) == "TITLE") {
                          val de = dt + doff
                          var x = de
                          while (x < de + len && x < b.size && b[x].toInt() != 0) x++
                          return String(b, de, x - de, Charsets.UTF_8).trim()
                      }
                  }
                  return null
              }

              fun analyze(ch: FileChannel): DiscInfo? {
                  try {
                      val head = rd(ch, 0, 0x20)
                      if (head.size >= 0x20) {
                          if (be32(head, 0x18) == 0x5D1C9EA3L) return DiscInfo(Platform.WII, null, null)
                          if (be32(head, 0x1C) == 0xC2339F3DL) return DiscInfo(Platform.GAMECUBE, null, null)
                      }
                      var found: Lay? = null
                      for (c in listOf(Lay(2048, 0), Lay(2352, 16), Lay(2352, 24))) {
                          val m = rd(ch, 16L * c.ss + c.off, 6)
                          if (m.size == 6 && String(m, 1, 5, Charsets.ISO_8859_1) == "CD001") {
                              found = c
                              break
                          }
                      }
                      val l = found ?: return null
                      val pvd = data(ch, l, 16, 2048)
                      if (pvd.size < 170) return null
                      val root = list(ch, l, le32(pvd, 158), le32(pvd, 166))
                      val dirName = when {
                          root.any { it.dir && it.name.equals("PSP_GAME", true) } -> "PSP_GAME"
                          root.any { it.dir && it.name.equals("PS3_GAME", true) } -> "PS3_GAME"
                          else -> null
                      }
                      if (dirName != null) {
                          val plat = if (dirName == "PSP_GAME") Platform.PSP else Platform.PS3
                          val dr = root.first { it.dir && it.name.equals(dirName, true) }
                          val sub = list(ch, l, dr.lba, dr.size)
                          val sfo = sub.firstOrNull { it.name.equals("PARAM.SFO", true) }
                          val ico = sub.firstOrNull { it.name.equals("ICON0.PNG", true) }
                          val title = sfo?.let { sfoTitle(file(ch, l, it, 65536)) }
                          val cover = ico?.let { file(ch, l, it, 2_000_000) }
                          return DiscInfo(plat, title, cover)
                      }
                      val cnf = root.firstOrNull { it.name.equals("SYSTEM.CNF", true) }
                      if (cnf != null) {
                          val t = String(file(ch, l, cnf, 2048), Charsets.ISO_8859_1).uppercase()
                          if (t.contains("BOOT2")) return DiscInfo(Platform.PS2, null, null)
                          if (t.contains("BOOT")) return DiscInfo(Platform.PS1, null, null)
                      }
                      return null
                  } catch (e: Exception) {
                      return null
                  }
              }
          }
