                  return bos.toByteArray()
              }

              fun localIp(): String? {
                  try {
                      val en = NetworkInterface.getNetworkInterfaces() ?: return null
                      var best: String? = null
                      for (ni in en) {
                          if (!ni.isUp || ni.isLoopback) continue
                          for (a in ni.inetAddresses) {
                              if (a is Inet4Address && !a.isLoopbackAddress && a.isSiteLocalAddress) {
                                  if (ni.name.startsWith("wlan")) return a.hostAddress
                                  if (best == null) best = a.hostAddress
                              }
                          }
                      }
                      return best
                  } catch (e: Exception) {
                      return null
                  }
              }

              // ---------- HTTP ----------
              private fun readLine(i: InputStream): String? {
                  val sb = StringBuilder()
                  while (true) {
                      val c = i.read()
                      if (c < 0) return if (sb.isEmpty()) null else sb.toString()
                      if (c == '\n'.code) break
                      if (c != '\r'.code) sb.append(c.toChar())
                      if (sb.length > 8192) return null
                  }
                  return sb.toString()
              }

              private fun send(out: OutputStream, code: String, type: String, body: ByteArray, extra: String = "") {
                  val head = "HTTP/1.1 $code\r\nContent-Type: $type\r\nContent-Length: ${body.size}\r\n" +
                      "Cache-Control: no-store\r\nAccess-Control-Allow-Origin: *\r\nConnection: close\r\n$extra\r\n"
                  out.write(head.toByteArray())
                  out.write(body)
                  out.flush()
              }

              private fun asset(name: String): ByteArray = app!!.assets.open(name).use { it.readBytes() }

              private fun handle(s: Socket) {
                  try {
                      s.tcpNoDelay = true
                      val ins = BufferedInputStream(s.getInputStream())
                      val out = s.getOutputStream()
                      val req = readLine(ins) ?: return
                      val parts = req.split(" ")
                      if (parts.size < 2) return
                      val path = parts[1].substringBefore('?')
                      val h = HashMap<String, String>()
                      while (true) {
                          val l = readLine(ins) ?: break
                          if (l.isEmpty()) break
                          val i = l.indexOf(':')
                          if (i > 0) h[l.substring(0, i).trim().lowercase()] = l.substring(i + 1).trim()
                      }
                      when (path) {
                          "/ws" -> ws(ins, out, h)
                          "/stream" -> mjpeg(out)
                          "/frame.jpg" -> {
                              lastPoll = System.currentTimeMillis()
                              send(out, "200 OK", "image/jpeg", frame)
                          }
                          "/tv" -> send(out, "200 OK", "text/html; charset=utf-8", asset("tv.html"))
                          "/pad" -> send(out, "200 OK", "text/html; charset=utf-8", asset("pad.html"))
                          "/info" -> {
                              val sb = StringBuilder("{\"game\":\"")
                              sb.append(gameName.replace("\"", "").replace("\\", ""))
                              sb.append("\",\"players\":[")
                              for (i in 0..3) {
                                  if (i > 0) sb.append(',')
                                  val n = players[i]
                                  if (n == null) sb.append("null") else sb.append('"').append(n.replace("\"", "").replace("\\", "")).append('"')
                              }
                              sb.append("]}")
                              send(out, "200 OK", "application/json", sb.toString().toByteArray())
                          }
                          "/" -> send(out, "302 Found", "text/plain", ByteArray(0), "Location: /tv\r\n")
                          else -> send(out, "404 Not Found", "text/plain", "404".toByteArray())
                      }
                  } catch (e: Exception) {
                  } finally {
                      try {
                          s.close()
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun mjpeg(out: OutputStream) {
                  viewers.incrementAndGet()
                  try {
                      out.write(
                          ("HTTP/1.1 200 OK\r\nContent-Type: multipart/x-mixed-replace; boundary=acframe\r\n" +
                              "Cache-Control: no-store\r\nConnection: close\r\n\r\n").toByteArray()
                      )
                      var last = -1L
                      while (running) {
                          if (seq == last) {
                              Thread.sleep(12)
                              continue
                          }
                          last = seq
                          val f = frame
                          out.write("--acframe\r\nContent-Type: image/jpeg\r\nContent-Length: ${f.size}\r\n\r\n".toByteArray())
                          out.write(f)
                          out.write("\r\n".toByteArray())
                          out.flush()
                      }
                  } finally {
                      viewers.decrementAndGet()
                  }
              }

              // ---------- WebSocket (kumanda) ----------
              private fun readFully(i: InputStream, b: ByteArray) {
                  var n = 0
                  while (n < b.size) {
                      val r = i.read(b, n, b.size - n)
                      if (r < 0) throw EOFException()
                      n += r
                  }
              }

              private fun wsFrame(out: OutputStream, op: Int, data: ByteArray) {
                  synchronized(out) {
                      out.write(0x80 or op)
                      if (data.size < 126) {
                          out.write(data.size)
                      } else {
                          out.write(126)
                          out.write(data.size shr 8)
                          out.write(data.size and 0xFF)
                      }
                      out.write(data)
                      out.flush()
                  }
              }

              private fun readWs(i: InputStream, out: OutputStream): String? {
                  while (true) {
                      val b0 = i.read()
                      val b1 = i.read()
                      if (b0 < 0 || b1 < 0) return null
                      val op = b0 and 0x0F
                      var len = (b1 and 0x7F).toLong()
                      if (len == 126L) {
                          val a = i.read()
                          val b = i.read()
                          len = ((a shl 8) or b).toLong()
                      } else if (len == 127L) {
                          len = 0
                          repeat(8) { len = (len shl 8) or i.read().toLong() }
                      }
                      if (len > 65536) return null
                      val masked = (b1 and 0x80) != 0
                      val mask = ByteArray(4)
                      if (masked) readFully(i, mask)
                      val data = ByteArray(len.toInt())
                      readFully(i, data)
                      if (masked) for (k in data.indices) data[k] = (data[k].toInt() xor mask[k % 4].toInt()).toByte()
                      when (op) {
                          8 -> return null
                          9 -> wsFrame(out, 0xA, data)
                          1 -> return String(data, Charsets.UTF_8)
                          else -> {}
                      }
                  }
              }

              @Synchronized
              private fun claim(name: String): Int {
                  for (i in (if (monitorMode) 0 else 1)..3) if (players[i] == null) {
                      players[i] = name.take(16)
                      return i
                  }
                  return -1
              }

              private fun ws(ins: InputStream, out: OutputStream, h: Map<String, String>) {
                  val key = h["sec-websocket-key"] ?: return
                  val acc = Base64.encodeToString(
                      MessageDigest.getInstance("SHA-1").digest((key + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").toByteArray()),
                      Base64.NO_WRAP
                  )
                  out.write(
                      ("HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n" +
                          "Sec-WebSocket-Accept: $acc\r\n\r\n").toByteArray()
                  )
                  out.flush()
                  var port = -1
                  var prev = 0
                  var px = 0f
                  var py = 0f
                  try {
                      while (running) {
                          val msg = readWs(ins, out) ?: break
                          if (msg.startsWith("hello")) {
                              port = claim(msg.substringAfter(':', "Oyuncu"))
                              wsFrame(out, 1, (if (port < 0) "full" else "id:$port").toByteArray())
                              if (port < 0) break
                          } else if (msg.startsWith("s:") && port >= 0) {
                              val p = msg.split(":")
                              val mask = p.getOrNull(1)?.toIntOrNull() ?: 0
                              val lx = p.getOrNull(2)?.toFloatOrNull() ?: 0f
                              val ly = p.getOrNull(3)?.toFloatOrNull() ?: 0f
                              for (b in KEYS.indices) {
                                  val was = (prev shr b) and 1
                                  val now = (mask shr b) and 1
                                  if (was != now) sink?.key(port, KEYS[b], now == 1)
                              }
                              prev = mask
                              if (lx != px || ly != py) {
                                  px = lx
                                  py = ly
                                  sink?.stick(port, lx, ly)
                              }
                          }
                      }
                  } catch (e: Exception) {
                  } finally {
                      if (port >= 0) {
                          for (b in KEYS.indices) if (((prev shr b) and 1) == 1) sink?.key(port, KEYS[b], false)
                          sink?.stick(port, 0f, 0f)
                          players[port] = null
                      }
                  }
              }

              // ---------- TV eslestirme ----------
              fun scan(ctx: Context, cb: (String) -> Unit) {
                  try {
                      val opt = GmsBarcodeScannerOptions.Builder().setBarcodeFormats(Barcode.FORMAT_QR_CODE).build()
                      GmsBarcodeScanning.getClient(ctx, opt).startScan()
                          .addOnSuccessListener { b -> pair(ctx, b.rawValue ?: "", cb) }
                          .addOnFailureListener { cb("QR tarayici acilamadi. Kodu elle girebilirsin (Ayarlar > TV).") }
                  } catch (e: Throwable) {
                      cb("QR tarayici kullanilamiyor. Kodu elle girebilirsin (Ayarlar > TV).")
                  }
              }

              fun pair(ctx: Context, raw: String, cb: (String) -> Unit) {
                  val code = raw.trim().uppercase().removePrefix("ALLCORE:")
                  if (!Regex("[A-Z0-9]{4,12}").matches(code)) {
                      main.post { cb("Gecersiz QR kodu") }
                      return
                  }
                  if (!start(ctx)) {
                      main.post { cb("Sunucu baslatilamadi") }
                      return
                  }
                  val ip = localIp()
                  if (ip == null) {
                      main.post { cb("Wi-Fi baglantisi bulunamadi") }
                      return
                  }
                  Thread {
                      var msg: String
                      try {
                          val c = URL("https://ntfy.sh/allcore-$code").openConnection() as HttpURLConnection
                          c.requestMethod = "POST"
                          c.doOutput = true
                          c.connectTimeout = 8000
                          c.readTimeout = 8000
                          c.outputStream.use { it.write("$ip:$PORT".toByteArray()) }
                          msg = if (c.responseCode in 200..299) "TV'ye baglandi ($ip)" else "Baglanti hatasi (${c.responseCode})"
                          c.disconnect()
                      } catch (e: Exception) {
                          msg = "Eslesme icin internet gerekli. Internetsiz: TV tarayicisina ${url()}/tv yaz."
                      }
                      main.post { cb(msg) }
                  }.start()
              }
          }
